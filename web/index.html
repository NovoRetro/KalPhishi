<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bathtub Bets — Phish Setlist Predictor</title>
<style>
  :root {
    color-scheme: light;
    /* --card-bg is OPAQUE in both themes, and that is the fix for the single worst
       legibility problem this page had. The hall runs 760px down the page, well past the
       tab row and behind the top of the game card, so a translucent card let saturated
       moving beams through the text. Nothing that could be done to the ink would win that:
       the ink was already #fff in dark and the background underneath it was changing colour
       twice a second. The light still falls on the app around and between the cards, which
       is the effect the hall was for — it just no longer falls THROUGH the words. */
    --page: #f9f9f7; --surface: #fcfcfb; --card-bg: #ffffff;
    /* --muted was one value shared by both themes, which cannot be right: the same grey
       cannot sit correctly on #f9f9f7 and on #0d0d0d. On light it measured 3.3:1 and it is
       used at 11-12px on the set labels, the "0 of 10" counters, table headers and the empty
       bingo cells — all of it under the 4.5:1 AA floor for text that size. Retuned per theme;
       the ratios are asserted in test/assets.test.mjs so they cannot drift back. */
    --ink: #0b0b0b; --ink-2: #4a4945; --muted: #6b6a65;
    --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.14);
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
    --miss: #c9384a; /* results only — the palette had no red, and orange reads as a warning */
    /* Lock mode's border. Same value as --miss today, deliberately a separate name: --miss
       is fenced to results, and a locked square is not a wrong answer. Naming them apart
       means either can be retuned without dragging the other with it. */
    --lock: #c9384a;
    /* The locked square's FILL. Lock state moved off the border channel entirely
       (2026-08-15): the mobile bustout tiers took borders over, and a locked mega-bustout
       under the old scheme was two near-identical reds fighting for one border. Locks now
       say themselves the way `checked` does — a background wash — so a square can be locked
       AND busted and both read. */
    --lock-wash: rgba(201,56,74,0.16);
    /* Bustout's rarest tier. A third name for the same idea as --miss/--lock — none of them
       share a variable, all three are free to retune independently — but this one was a
       bare hardcoded hex on the .p-bust.mega badge until the mobile bingo border needed the
       identical colour and a second hardcoded copy was how token drift starts. */
    --bust-mega: #e34948;
    /* The outlined label chips — OPENER, CLOSER, ENCORE. These were --series-2 orange,
       which in dark mode is a chart colour doing a badge's job and reads as mud on the
       card. Green, per the 2026-08-15 direction, and bright in dark on purpose: an
       outline chip is coloured text, so it has to clear the same contrast bar text does —
       light stays deep enough for AA on white, dark goes to mint because #199e70-class
       greens vanish on #151514. */
    --chip: #128a60;
    --accent-wash: rgba(42,120,214,0.10);
    /* Beam palette for the light rig — see the .stage block. Deliberately outside the
       chart series above: those encode data and must stay stable and readable, these are
       stage lights and are allowed to be saturated. Weighted violet the way the rig
       actually is, with green and cyan as the counterpoints. */
    --beam-1: #8b5cf6; --beam-2: #a855f7; --beam-3: #6d4fd6;
    --beam-4: #2ee6a8; --beam-5: #38bdf8; --beam-6: #ddd0ff;
    /* The haze tint and the title's glow follow the beam palette — they are the same
       light, diffused. Defaulted here to the violet rig; the per-game blocks below
       retint all three together so the wall never disagrees with its own air. */
    --haze: rgba(160,125,255,0.30);
    --glow: rgba(168,85,247,0.45);
  }
  /* ---- The rig plays the game (data-rig on <html>, set by renderTabs). Bingo is the
     house violet above. Setlist Bets goes sunset — red, orange, yellow, Carini vibes —
     and Wombat goes green, yellow, indigo. Deliberately NOT theme-scoped: the hall is
     dark in both themes, so one palette per game serves light and dark alike, and these
     stay out of the two dark token blocks the identity test guards. Note --beam-2 also
     tints the active tab underline, the Play pill and the crew bar — the accent follows
     the game on purpose, one light source for the whole page. */
  :root[data-rig="setlist"] {
    --beam-1: #f97316; --beam-2: #ef4444; --beam-3: #dc2626;
    --beam-4: #fbbf24; --beam-5: #fb923c; --beam-6: #fde68a;
    --haze: rgba(249,115,22,0.28);
    --glow: rgba(239,68,68,0.45);
  }
  :root[data-rig="wombat"] {
    --beam-1: #22c55e; --beam-2: #eab308; --beam-3: #6366f1;
    --beam-4: #4ade80; --beam-5: #818cf8; --beam-6: #fef08a;
    --haze: rgba(99,102,241,0.28);
    --glow: rgba(34,197,94,0.45);
  }
  /* ---- Dark, declared TWICE on purpose, and the two blocks must stay identical.
     The theme control has three states. "Auto" stamps nothing on <html> and is the default,
     so only prefers-color-scheme separates light from dark — that is the first block. An
     explicit choice stamps data-theme, and an explicit "dark" has to win on a machine whose
     OS is set to light, which no media query can do — that is the second block. The
     :not([data-theme="light"]) guard on the first is what lets an explicit "light" win back
     on a dark OS.
     A single rule cannot serve both: one lives inside a media query and the other must not,
     and CSS has no way to share a body across that boundary. So they are duplicated, and
     test/assets.test.mjs asserts the two blocks declare exactly the same tokens with exactly
     the same values — the drift this invites is silent and only shows up on one OS. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --card-bg: #151514;
      --ink: #ffffff; --ink-2: #d5d4c9; --muted: #a8a69d;
      --grid: #34342f; --baseline: #45453f; --border: rgba(255,255,255,0.16);
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
      --miss: #e2596b;
      --lock: #e2596b;
      --lock-wash: rgba(226,89,107,0.22);
      --bust-mega: #e66767;
      --chip: #2ee6a8;
      --accent-wash: rgba(57,135,229,0.15);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --card-bg: #151514;
    --ink: #ffffff; --ink-2: #d5d4c9; --muted: #a8a69d;
    --grid: #34342f; --baseline: #45453f; --border: rgba(255,255,255,0.16);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --miss: #e2596b;
    --lock: #e2596b;
    --lock-wash: rgba(226,89,107,0.22);
    --bust-mega: #e66767;
    --chip: #2ee6a8;
    --accent-wash: rgba(57,135,229,0.15);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.5; padding: 24px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; position: relative; }
  /* Everything real sits above the hall behind it. */
  .wrap > *:not(.hall) { position: relative; z-index: 1; }
  /* Centred: the name and the rotating tagline are the marquee, and the rig below them
     reads as a rig only if it is symmetrical about something. The menu button is
     position:fixed at the right, so it does not participate in this and cannot collide —
     "Bathtub Bets" measures 148px of ink at 26px semibold, leaving 30px of clearance at
     320px — the narrowest width supported — and it does not wrap there either. Measured off
     a Range over the text node, not the h1 box: the h1 is a full-width centred block, so its
     box overlaps the button at every width and says nothing. Re-measure if the name grows. */
  header { text-align: center; }

  /* ——— CK5 ———
     Chris Kuroda has lit Phish since 1989 and improvises the whole show live; "2001" is the
     long-standing showcase for it. The look this is after is the wall of beams: narrow
     shafts thrown from fixture points along the truss, fanning at angles, crossing each
     other and getting brighter where they cross, the whole thing mirror-symmetric about
     centre. Violet-dominant with green and cyan against it.

     Three things follow from that and are load-bearing here:
       · Beams are cones, not bars — a triangle clipped out of a gradient that fades before
         it reaches the floor, so it reads as light falling rather than a painted stripe.
       · mix-blend-mode: screen. Light is additive: two beams crossing must be brighter
         than either alone. Without it they just occlude and the whole thing looks flat.
       · The hall is dark. Beams only exist against darkness, so it stays near-black in
         both themes rather than following the page — a lit room with a dark stage in it is
         the correct reading, and a light-mode wash would have none.
     Peaks on save and on BINGO — see rigPeak(). */

  /* The rig used to be trapped in a rounded panel around the header. This is that panel
     unrolled down the page: an absolutely-positioned layer behind .wrap that carries both
     the darkness and the beams past the tab row and across the top of the content, so the
     light falls on the app instead of stopping at a border. Masked rather than cropped —
     darkness and light have to run out together, or the bottom edge reads as a banner
     ending rather than as light falling off. */
  .hall { position: absolute; top: 0; left: 0; right: 0; height: 760px;
    z-index: 0; pointer-events: none; overflow: hidden; isolation: isolate;
    border-radius: 14px 14px 0 0;
    background: radial-gradient(120% 34% at 50% 0%, #17122a 0%, #0b0a12 46%, #08070d 100%);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 44%, transparent 99%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 44%, transparent 99%); }
  /* Haze. The beams are only visible in a real hall because the air is full of it, and it
     is what stops the cones reading as hard-edged geometry. Its own layer so the peak can
     bloom it — a gradient cannot be transitioned, an opacity can. */
  .hall::after { content: ''; position: absolute; inset: 0; opacity: 0.55;
    background: radial-gradient(70% 36% at 50% 4%, var(--haze), transparent 72%);
    transition: opacity 380ms ease; }

  .stage { padding: 30px 18px 34px; }
  /* The beams converge on centre, which is exactly where the title and tagline are. On a
     narrow screen a full-brightness shaft lands right behind the words and the tagline
     stops being readable. This is a scrim under the text only — soft-edged and confined to
     the middle of the header, so it buys the contrast back without dimming the rig or
     showing an edge of its own. */
  .stage::before { content: ''; position: absolute; inset: 6% 2%; z-index: 1;
    pointer-events: none; transition: background 260ms ease;
    background: radial-gradient(56% 60% at 50% 50%, rgba(6,5,12,0.74), transparent 72%); }
  /* On the hit the beams behind the words go pure white, and a scrim tuned for coloured
     light is not enough to keep the tagline off it. Sibling selector because the peak
     class lives on the hall, which precedes the stage. */
  .hall.peak ~ .stage::before {
    background: radial-gradient(56% 60% at 50% 50%, rgba(4,3,10,0.88), transparent 74%); }
  .stage header { position: relative; z-index: 2; }
  .stage h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; color: #fff;
    text-shadow: 0 0 22px var(--glow), 0 2px 14px rgba(0,0,0,0.65); }
  /* Set above the stats line, not below: it is the one sentence that says what the page
     is, and it has to land before the reader starts parsing tour numbers. */
  /* Capped and centred so it cannot run underneath the banner actions on the right. The
     list is meant to grow, so this has to hold for lines nobody has written yet rather
     than for the ones that happen to fit today: measured across all 13, five of them
     reached into the actions at full width.
     min-height reserves the second line every line-length needs, so a rotation from a
     short tagline to a long one does not shove the whole page down 22px. */
  .stage .tagline { font-size: 15px; color: #e7e1f8; margin: 8px auto 0;
    max-width: 420px; min-height: 3em;
    text-shadow: 0 1px 10px rgba(0,0,0,0.75); transition: opacity 220ms ease; }
  .stage .tagline.tagline-out { opacity: 0; }

  .rig { position: absolute; inset: 0; pointer-events: none; }
  /* Anchored at its fixture point on the truss and rotated about it, which is how a real
     one moves — the head pans, the beam sweeps from where it is bolted. */
  .rig .beam {
    position: absolute; top: 0; left: var(--x); width: var(--w); height: 100%;
    margin-left: calc(var(--w) / -2); transform-origin: 50% 0;
    clip-path: polygon(47% 0, 53% 0, 100% 100%, 0% 100%);
    background: linear-gradient(to bottom, var(--c) 0%, transparent 72%);
    opacity: var(--o); filter: blur(3.5px); mix-blend-mode: screen;
    will-change: transform, opacity;
    animation: sweep var(--dur) ease-in-out var(--delay) infinite alternate;
    /* transform is transitioned here rather than under .peak so the descent still eases
       after the peak class comes off. While the sweep is running the animation wins and
       the transition is inert, so this only ever applies during a peak. */
    transition: opacity 300ms ease, background 260ms ease,
                transform 1050ms cubic-bezier(.16,.85,.24,1);
  }
  @keyframes sweep { from { transform: rotate(var(--a1)); } to { transform: rotate(var(--a2)); } }
  .rig.idle .beam { animation-play-state: paused; }

  /* The fanfare: every head blows out to pure white and raises. The colour is dropped
     outright rather than brightened — a rig hitting full is white light, and keeping a hue
     would read as "the violet one got louder" instead of as the hit. The raise itself is
     driven from rigPeak(), which has to pin each head at its live angle first. */
  .hall.peak .beam { opacity: 1;
    background: linear-gradient(to bottom, #fff 0%, rgba(255,255,255,0.92) 18%,
                                rgba(255,255,255,0) 78%); }
  .hall.peak::after { opacity: 1; }

  /* Reduced motion keeps the rig — it is colour and shape, not just movement — but the
     heads stop panning and the peak becomes a brightness change only. */
  @media (prefers-reduced-motion: reduce) {
    .rig .beam { animation: none; transform: rotate(var(--a1)); }
    .hall.peak .beam { animation: none; }
    .stage .tagline { transition: none; }
  }

  .tabs { display: flex; gap: 4px; margin-top: 16px; border-bottom: 1px solid rgba(255,255,255,0.15); flex-wrap: wrap; align-items: center; }
  /* The freshness stamp alone, right-aligned against the centred title. It describes the
     data behind Data rather than the page, and it is not somewhere you go, so it stays off
     the tab row — unlike Play a Show, which is a destination and now sits in the row with
     the other four.
     Absolute on desktop so the title stays optically centred in the full width instead of
     being shoved off-centre by a sibling. The top offset clears the menu button, which is
     position:fixed over the same right edge and occupies the viewport's top 54px. */
  .stage-actions { position: absolute; top: 46px; right: 18px; z-index: 3;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .stage-actions .stamp { margin-left: 0; color: #fff;
    background: rgba(0,0,0,0.30); border-color: rgba(255,255,255,0.22); }
  /* Pinned to the far right of the tab row, so it reads as separated from the four views
     rather than a fifth one. margin-left:auto here rather than a spacer element, so the
     tabs keep their natural widths and only the gap absorbs the change. */
  .btn-play { margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer; font: inherit; font-size: 14px; font-weight: 600; color: #fff;
    padding: 6px 14px; min-height: 36px; border-radius: 99px;
    border: 1px solid rgba(255,255,255,0.30); background: rgba(255,255,255,0.10);
    text-shadow: 0 1px 6px rgba(0,0,0,0.85); }
  .btn-play:hover { background: rgba(255,255,255,0.18); border-color: #fff; }
  .btn-play.active { background: var(--beam-2); border-color: var(--beam-2); }
  .btn-play-ico { font-size: 11px; }
  /* On a phone the centred title fills the width, so an absolute block would land on top
     of it. Drops into the flow below the tagline instead. */
  /* On a phone the centred title fills the width, so an absolute block would land on top
     of it. Drops into the flow below the tagline instead.
     The rest of this block is the mobile-first pass: at 375px the header was spending 300
     CSS px — well over a third of the viewport — before the game began, so a visitor landed
     on a title, a joke and a date stamp and had to scroll to reach the thing they came for.
     Everything here is the same content, smaller, and the hall is cut to end at the tab row
     rather than running 760px down behind the card. Desktop is untouched: it has the height
     to spend and the rig is the first impression there. */
  @media (max-width: 560px) {
    .stage-actions { position: static; align-items: center; margin-top: 10px; }
    .stage { padding: 16px 14px 18px; }
    /* The banner text vs the rig, on a phone (2026-08-15 direction). At 375px the beams
       converge exactly where the title sits, and the brighter per-game palettes — the
       sunset's yellows especially — can wash white text out entirely at full beam. Two
       defences, both here and not on desktop, which has the width to keep text and
       beams apart: the scrim under the words deepens and widens, and the text carries a
       hard dark contact shadow UNDER its coloured glow, so legibility never depends on
       what colour the light behind it happens to be at that moment. */
    .stage::before { background: radial-gradient(62% 66% at 50% 50%, rgba(6,5,12,0.86), transparent 76%); }
    .hall.peak ~ .stage::before {
      background: radial-gradient(62% 66% at 50% 50%, rgba(4,3,10,0.94), transparent 78%); }
    .stage h1 { font-size: 22px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.95), 0 0 18px var(--glow), 0 2px 12px rgba(0,0,0,0.85); }
    .stage .tagline {
      text-shadow: 0 1px 2px rgba(0,0,0,0.95), 0 1px 10px rgba(0,0,0,0.85); }
    .tab, .subtab, .stamp { text-shadow: 0 1px 2px rgba(0,0,0,0.95), 0 1px 6px rgba(0,0,0,0.85); }
    /* min-height still reserves the wrap, so rotating from a short tagline to a long one
       does not shove the page down — it just reserves two lines now instead of three. */
    .stage .tagline { font-size: 13px; margin-top: 6px; min-height: 2.4em; max-width: 300px; }
    .hall { height: 420px; }
    .tabs { margin-top: 10px; }
    .tab { padding: 8px 10px; }
    body { padding: 12px; }
  }

  /* ---- Play a Show ---- */
  .ps-quick-host:empty { display: none; }
  .ps-quick { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    margin: 4px 0 14px; padding: 12px 14px; min-height: 44px; cursor: pointer;
    font: inherit; color: var(--ink); border: 1px solid var(--series-1);
    border-radius: 10px; background: var(--accent-wash); }
  .ps-quick:hover { border-color: var(--series-3); }
  .ps-quick-ico { font-size: 18px; color: var(--series-1); }
  .ps-quick-main { display: block; font-weight: 600; }
  .ps-quick-sub { display: block; font-size: 12px; color: var(--ink-2); margin-top: 1px; }

  .ps-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .ps-year { font: inherit; font-size: 13px; min-height: 38px; padding: 6px 10px;
    border: 1px solid var(--baseline); border-radius: 8px;
    background: var(--surface); color: var(--ink); }
  /* Descendant selector, not a bare .ps-search: it is also a .ta-input, whose own
     max-width is declared further down this sheet. At equal specificity that wins on
     source order, and this rule would silently do nothing. */
  .ps-filters .ps-search { max-width: 320px; }
  .ps-listhead { font-size: 12px; color: var(--muted); margin-bottom: 6px; }

  .ps-list { display: flex; flex-direction: column; gap: 4px; }
  .ps-row { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .ps-row.open { border-color: var(--series-1); }
  .ps-rowhead { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left;
    font: inherit; font-size: 13px; color: var(--ink); background: none; border: none;
    padding: 11px 12px; min-height: 44px; cursor: pointer; border-radius: 8px; }
  .ps-rowhead:hover { background: var(--accent-wash); }
  .ps-caret { color: var(--muted); transition: transform 140ms ease; display: inline-block; }
  .ps-row.open .ps-caret { transform: rotate(90deg); }
  .ps-date { font-weight: 600; white-space: nowrap; }
  .ps-where { color: var(--ink-2); flex: 1; }
  .ps-sbd { font-size: 10px; letter-spacing: 0.04em; color: var(--series-3);
    border: 1px solid var(--series-3); border-radius: 4px; padding: 0 4px; }
  /* Hidden, not removed: a collapsed row whose recording is still playing keeps its
     transport controls alive and repainting, because the <audio> element is global and
     carries on regardless of what the DOM does. */
  .ps-body { display: none; padding: 0 12px 12px; }
  .ps-row.open .ps-body { display: block; }
  @media (prefers-reduced-motion: reduce) { .ps-caret { transition: none; } }
  @media (max-width: 560px) {
    .ps-rowhead { flex-wrap: wrap; gap: 2px 8px; }
    .ps-where { flex-basis: 100%; font-size: 12px; }
    .ps-filters .ps-search { max-width: none; }
  }

  /* The nav sits inside the hall now, so it is lit from behind rather than sitting on the
     page. It is styled for darkness in BOTH themes for that reason — following --ink here
     would put near-black labels on a near-black hall in light mode. */
  /* The nav is white-on-dark sitting over moving light, so a beam drifting behind a label
     takes its contrast with it — and at the peak, when everything goes white, takes it
     entirely. The shadow is what keeps these legible against their own background. */
  .tab, .subtab, .stamp { text-shadow: 0 1px 6px rgba(0,0,0,0.85); }
  /* Full white, no alpha. Dimming an inactive tab is the normal way to rank it, but here
     the background is moving light — a 0.66 label lands on a bright beam and disappears.
     Rank is carried by weight and the underline instead, which a beam cannot wash out. */
  .tab { background: none; border: none; font: inherit; color: #fff; padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: #fff; background: rgba(255,255,255,0.09); border-radius: 6px 6px 0 0; }
  .tab.active { color: #fff; font-weight: 600; border-bottom-color: var(--beam-2); }
  /* Second level, under Data. Pills rather than underlined tabs, so the two rows never
     read as competing for the same job. */
  .subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  /* In the hall too — same reasoning as .tab. */
  .subtab { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); border-radius: 99px; font: inherit; font-size: 13px; color: #fff; padding: 5px 12px; cursor: pointer; }
  .subtab:hover { color: #fff; border-color: rgba(255,255,255,0.34); }
  .subtab.active { color: #fff; border-color: var(--beam-2); background: rgba(139,92,246,0.26); font-weight: 600; }
  .pill { display: inline-block; padding: 1px 8px; border: 1px solid var(--border); border-radius: 99px; font-size: 12px; color: var(--ink-2); background: var(--surface); margin-left: 6px; }
  .grid { display: grid; gap: 16px; margin-top: 20px; }
  .cols-2 { grid-template-columns: 1fr 1fr; }
  .cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 900px) { .cols-2, .cols-3 { grid-template-columns: 1fr; } }
  /* Opaque. This was translucent so the beams still falling on this part of the page would
     read through the card instead of stopping dead at its edge, and that is a real effect —
     but the top card is the game, the hall runs 760px down the page, and the cost was every
     word of both games sitting on moving saturated light. The light still lands on the page
     around the cards, in the margins and the gaps between them, which is where it reads as
     light falling on the app rather than as a wash over the text. */
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; overflow-x: auto; }
  .card.card-overflow { overflow: visible; }
  .card h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin-bottom: 10px; }
  .card h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 500; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--grid); }
  td { padding: 4px 10px 4px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .filter-row th { padding: 3px 10px 5px 0; }
  .th-controls { display: flex; gap: 3px; align-items: center; }
  .th-sort { background: none; border: 1px solid var(--grid); border-radius: 6px; color: var(--muted); cursor: pointer; font: inherit; font-size: 11px; padding: 1px 5px; flex-shrink: 0; }
  .th-sort:hover { color: var(--ink); }
  .th-sort.active { color: var(--series-1); border-color: var(--series-1); }
  .th-filter { width: 100%; min-width: 44px; box-sizing: border-box; font: inherit; font-size: 11px; padding: 2px 6px; border: 1px solid var(--grid); border-radius: 6px; background: var(--surface); color: var(--ink); }
  .th-filter:focus { outline: none; border-color: var(--series-1); }
  .th-filter::placeholder { color: var(--muted); }
  tr:hover td { background: var(--accent-wash); }
  .song { font-weight: 500; }
  .setlist { display: flex; flex-wrap: wrap; gap: 4px 0; align-items: baseline; }
  .setlist .s { padding: 2px 6px; border-radius: 6px; cursor: default; position: relative; }
  .setlist .s:hover { background: var(--accent-wash); }
  /* Playable songs get a pointer and a colour on hover, but deliberately NOT an underline:
     .overlap already underlines to mean "also in the current top-40 candidates", and
     underlining every song as a link would erase that signal on the very grid it exists to
     mark up. :not(.overlap) so the anchor's default underline is stripped everywhere
     except where the data one has to survive. */
  .setlist a.s { color: inherit; cursor: pointer; }
  .setlist a.s:not(.overlap) { text-decoration: none; }
  .setlist a.s:hover { color: var(--series-3); background: var(--accent-wash); }
  .setlist .t { color: var(--muted); padding: 0 2px; }
  .setlabel { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 10px 0 4px; }
  .marquee { border-left: 3px solid var(--series-1); }
  .why { color: var(--muted); font-size: 12px; }
  .venue-show { margin-bottom: 14px; }
  .venue-show .date { font-weight: 600; }
  .venue-show .tour { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .overlap { text-decoration: underline; text-decoration-color: var(--series-2); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 8px; }
  .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
  .bar .fill { width: 100%; max-width: 42px; background: var(--series-1); border-radius: 4px 4px 0 0; min-height: 2px; }
  /* Axis labels fill their whole slot and use tabular figures, so every tick occupies an
     identical box and the digits line up in a column. Left to shrink-wrap, a label sat at
     its own text width inside an equal-width bar — "Jul 7" measured 21.8px against 27.7px
     for "Jul 22" — and the short ones read as inset next to their neighbours. */
  .bar .x { font-size: 11px; color: var(--muted); width: 100%; text-align: center; font-variant-numeric: tabular-nums; }
  .bar .v { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .legend-note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .score { color: var(--series-1); font-weight: 600; font-variant-numeric: tabular-nums; }
  /* Heavier than the score beside it: Chance is the column a reader can act on, and score is
     the internal unit that produced the ordering. Ink, not a series colour — the series
     colours encode data categories elsewhere and this is not one of them. */
  .chance { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .chance-none { color: var(--muted); font-weight: 400; }

  /* ---- Nerd Zone ---- */
  /* Reading measure. 66ch is a readability FLOOR, not a target, and treating it as a hard cap
     stranded the prose at 498px inside a 1180px card while the tables beside it spanned 1143px
     — a 42%-against-97% mismatch that reads as broken rather than as deliberate restraint.
     The fix is COLUMNS, not longer lines: a 1100px line is unreadable however much room there
     is, so the text keeps its measure and uses the width by splitting instead. */
  .nz-prose p { margin: 0 0 10px; font-size: 14px; line-height: 1.55; }
  .nz-prose p:last-child { margin-bottom: 0; }
  @media (min-width: 920px) {
    .nz-prose { columns: 2; column-gap: 38px; }
    /* Without this a paragraph breaks across the fold and the reader loses the thread
       mid-sentence, which is worse than the whitespace this is fixing. */
    .nz-prose p { break-inside: avoid; }
  }
  .nz-picker { margin: 6px 0 8px; }
  .nz-blurb { margin-bottom: 12px; }
  /* Marks the shipping arm in the comparison table without a colour, which would read as a
     ranking of its own next to columns that already rank. */
  .nz-ship { font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  /* Marks a row that is not competing. Same shape as .nz-ship and deliberately no colour —
     the table already ranks, and a coloured badge would read as a second ranking. */
  .nz-whatif { font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--muted); border: 1px dashed var(--border); border-radius: 4px; padding: 0 4px; }
  /* The playground. Its own tint so the one interactive zone on the card is findable at a
     glance among four sections of reference material. */
  .nz-play-intro { margin: 2px 0 10px; max-width: min(100%, 82ch); font-size: 13px;
    line-height: 1.55; color: var(--ink-2); }
  .nz-play-intro p { margin: 0 0 8px; }
  .nz-play-intro p:last-child { margin-bottom: 0; }
  /* Where the choice actually shows up in the games. Called out because the picker is on the
     Data tab and the button it renames is two taps away inside a menu on another tab — without
     this, choosing an approach looks like it did nothing. */
  .nz-where { padding: 8px 10px; border-left: 3px solid var(--series-1);
    background: var(--accent-wash); border-radius: 0 6px 6px 0; color: var(--ink); }
  .nz-group-note { margin: 2px 0 6px; max-width: min(100%, 82ch); }
  .nz-current { margin: 4px 0 14px; padding: 8px 10px; border-radius: 8px; font-size: 13px;
    background: var(--accent-wash); border: 1px solid var(--border); }
  .nz-cur-label { color: var(--ink-2); }
  /* Nested one level in, so the scoreboard reads as part of the playground rather than as a
     sibling of it. No top rule for the same reason. */
  /* Both classes, because .nz-sec is declared later in this sheet and would otherwise win the
     border on source order alone — same specificity, and it lost silently. */
  .nz-sec.nz-sec-nested { border-top: none; margin-top: 10px; }
  .nz-sec-nested > summary { font-size: 13px; color: var(--series-1); }
  .nz-notes { margin-top: 12px; padding: 10px 12px; border-left: 3px solid var(--series-2);
    background: var(--accent-wash); border-radius: 0 8px 8px 0; max-width: min(100%, 82ch); }
  .nz-notes p { margin: 0 0 8px; font-size: 13px; line-height: 1.5; }
  .nz-notes p:last-child { margin-bottom: 0; }
  /* Diagnostics. Separated from the picker by a rule because they are measurements of the
     shipping model, NOT more approaches — sat directly under a row of buttons they read as
     further options, which is the one thing they must not. */
  .nz-diag { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 14px; }
  .nz-diag h3 { margin: 0 0 6px; font-size: 15px; }
  .nz-diag p { margin: 0 0 8px; font-size: 13px; line-height: 1.55; max-width: min(100%, 82ch); }
  .nz-diag table { margin: 8px 0 6px; }
  /* Collapsible sections. <details> rather than a hand-rolled accordion: it is keyboard
     operable and screen-reader labelled for free, it works with no JS at all, and the
     browser's own find-in-page opens a closed section to reveal a match. None of that comes
     free with a div and a click handler, and all of it is the sort of thing that quietly
     stops working. The card runs to ~2900px on a desktop with every section open, which is
     the navigation problem these solve. */
  .nz-sec { border-top: 1px solid var(--border); }
  /* The explainer sits directly under the h2, where a rule would read as a stray divider
     rather than as a section boundary. */
  .nz-sec-first { border-top: none; }
  .nz-sec > summary { cursor: pointer; padding: 11px 0; font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 9px; min-height: 44px; list-style: none; }
  /* Both are needed: ::marker covers modern browsers, the -webkit- pseudo covers older
     WebKit, and leaving either in place shows a second triangle beside our own. */
  .nz-sec > summary::marker { content: ''; }
  .nz-sec > summary::-webkit-details-marker { display: none; }
  .nz-sec > summary::before { content: '▸'; color: var(--muted); font-size: 12px;
    transition: transform 0.15s ease; }
  .nz-sec[open] > summary::before { transform: rotate(90deg); }
  .nz-sec > summary:hover { color: var(--series-1); }
  .nz-secbody { padding-bottom: 16px; }
  /* Prose beside its chart where there is room for both, stacked where there is not. This is
     the other half of the width fix: the spread and reliability sections have a visual whose
     natural width is far under the card's, so the explanation sits next to it rather than
     above it leaving a gap the width of the page. */
  .nz-split { display: grid; gap: 2px 34px; align-items: start; }
  @media (min-width: 920px) {
    .nz-split { grid-template-columns: minmax(0, 1fr) minmax(0, 480px); }
    .nz-split > :first-child p:last-child { margin-bottom: 0; }
  }
  /* Hits per show. A bar chart rather than a table because the SHAPE is the finding — the
     mean sits on a wide, flat hump, and no column of numbers says that at a glance. Widths
     are a share of the tallest bucket, so the count is printed too: a bar is not a quantity. */
  .nz-hist { display: grid; grid-template-columns: auto minmax(60px, 1fr) auto; gap: 3px 8px;
    align-items: center; font-variant-numeric: tabular-nums; font-size: 12px;
    margin: 10px 0; max-width: 440px; }
  .nz-hist .hk { text-align: right; color: var(--ink-2); }
  .nz-hist .hb { height: 11px; border-radius: 3px; background: var(--border); min-width: 3px; }
  /* The middle 80%. Highlighted because that band, not the mean, is what somebody predicting
     a single show should actually expect. */
  .nz-hist .hb.mid { background: var(--series-1); }
  .nz-hist .hn { color: var(--muted); font-size: 11px; white-space: nowrap; }
  /* A year measured on a handful of shows is noise; it stays in the table because dropping
     rows to make a trend look cleaner is the thing this whole section argues against. */
  .nz-thin { color: var(--muted); font-style: italic; }
  /* Shown on every card a lens has altered. Deliberately loud: a reader who set a lens days
     ago must not mistake an experimental ranking for the app's actual prediction. */
  .lens-badge { margin: 8px 0 10px; padding: 8px 10px; border-radius: 8px; font-size: 13px;
    border: 1px solid var(--series-2); background: var(--accent-wash); }
  .lens-reset { background: none; border: none; padding: 0 2px; font: inherit; font-size: 13px;
    color: var(--series-1); text-decoration: underline; cursor: pointer; }
  @media (max-width: 560px) { .lens-reset { padding: 8px 2px; min-height: 44px; } }
  .sharebar { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .sharebar i { display: inline-block; height: 8px; background: var(--series-1); border-radius: 4px; }
  #tooltip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; max-width: 300px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); display: none; z-index: 10; }
  #tooltip .tt-name { font-weight: 600; margin-bottom: 2px; }
  #tooltip .tt-why { color: var(--ink-2); }
  /* Phone presentation of the same tip — see showTip(). Centred rather than anchored, and
     given room to breathe, since on touch it is only ever shown deliberately. */
  /* width, not max-width: the element is position:fixed and so shrink-to-fit, and with
     left:50% the space it fits into is only what remains to the RIGHT of centre — half the
     screen. A max-width never gets reached and the text wraps into a column half the width
     it was given. An explicit width sidesteps the whole calculation. */
  #tooltip.tt-modal { left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(88vw, 340px); max-width: none; padding: 14px 16px; font-size: 13px;
    line-height: 1.5; box-shadow: 0 14px 44px rgba(0,0,0,0.5); }
  /* The Why column carried the longest text in the table by a wide margin and set the row
     height for every other column with it. Clamped to a single line, with the full text
     still in the DOM: tableOf filters and sorts on textContent, so shortening the string
     would quietly break searching for a reason you can no longer see. */
  .why-trunc { display: block; max-width: 260px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; cursor: help; }
  .why-trunc:hover { color: var(--ink); }
  /* Nowrap keeps every row one line tall, which is what makes the ranked table scan as a
     ranking rather than as a stack of blocks. The table already scrolls sideways inside
     its card, so the width this costs is width the card was prepared to give. */
  .song-link { white-space: nowrap; color: var(--ink); text-decoration: underline;
    text-decoration-color: var(--series-3); text-underline-offset: 3px;
    text-decoration-thickness: 1px; cursor: pointer; }
  .song-link:hover { color: var(--series-3); text-decoration-thickness: 2px; }
  /* predictor */
  .p-login, .p-topbar { margin-bottom: 12px; }
  .p-login { max-width: 420px; } /* full width on any phone; capped so it doesn't stretch edge-to-edge on wide desktop */
  .p-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .p-topbar { display: flex; flex-direction: column; gap: 8px; }
  /* Sign in / create account: always a stacked column, not just below some breakpoint —
     a row of 3-4 inputs plus a button never fit a phone width, and stacked reads fine
     on desktop too. font-size 16px stops iOS Safari's zoom-on-focus. */
  .p-login .p-row { flex-direction: column; align-items: stretch; }
  .p-login .ta-input { max-width: none; font-size: 16px; }
  .p-login .p-btn { width: 100%; }
  .p-login .p-modes { margin-bottom: 4px; }
  .p-modes { display: flex; gap: 6px; flex-wrap: wrap; }
  .p-mode { background: var(--surface); border: 1px solid var(--border); border-radius: 99px; color: var(--ink-2); font: inherit; font-size: 13px; padding: 4px 12px; cursor: pointer; }
  .p-mode.active { color: var(--ink); border-color: var(--series-1); font-weight: 600; }
  .p-btn { background: var(--series-1); color: #fff; border: none; border-radius: 8px; font: inherit; font-weight: 600; padding: 8px 16px; cursor: pointer; margin-top: 10px; }
  .ta-wrap { position: relative; margin-top: 6px; }
  .ta-input { width: 100%; max-width: 280px; font: inherit; padding: 6px 10px; border: 1px solid var(--baseline); border-radius: 8px; background: var(--surface); color: var(--ink); }
  .p-date { max-width: 130px; margin: 0 6px; }
  .ta-list { position: absolute; top: 100%; left: 0; z-index: 5; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; min-width: 280px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
  .ta-item { padding: 6px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  .ta-item.sel, .ta-item:hover { background: var(--accent-wash); }
  .ta-plays { color: var(--muted); font-size: 12px; }
  /* The bottom margin matches the column gap, so the note under the builder clears the
     "add to Set 1…" inputs on the same rhythm the grid already uses. Without it the note
     sat flush against them and read as part of the last field. Set here rather than on
     .hint, which a dozen other places share. */
  .p-sets { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  @media (max-width: 900px) { .p-sets { grid-template-columns: 1fr; } }
  .p-songrow { display: flex; align-items: center; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--grid); }
  /* Wombat's rank column. The first five rows are the card-if-nothing-is-lost, the rest
     are the bench — the heavier rule under row five draws that line without a label, and
     the mint numbers above it say which ranks are doing the bidding. */
  .wb-rank { min-width: 20px; text-align: right; font-weight: 700;
    font-variant-numeric: tabular-nums; color: var(--muted); }
  .wb-list .p-songrow:nth-child(-n+5) .wb-rank { color: var(--chip); }
  .wb-list .p-songrow:nth-child(5) { border-bottom: 2px solid var(--baseline); }
  .p-songmain { display: flex; flex-direction: column; gap: 1px; }
  /* The badge column, ranged right against the ×. margin-left:auto claims the row's free
     space; the × behind it must then give up its own auto margin or flexbox splits the
     space between the two and strands the badges mid-row. Rows without badges keep the ×'s
     auto margin, which is why it is not simply removed from .p-x. */
  .p-rowbadges { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .p-rowbadges + .p-x { margin-left: 0; }
  .p-songmeta { color: var(--muted); font-size: 11px; }
  .p-bust { font-size: 9px; font-weight: 700; letter-spacing: 0.05em; border-radius: 4px; padding: 1px 4px; color: #fff; vertical-align: 1px; }
  .p-bust.minor { background: var(--series-3); }
  .p-bust.major { background: var(--series-2); }
  .p-bust.mega { background: var(--bust-mega); }
  /* touch-action: none so a drag on the handle doesn't scroll the page instead. */
  .p-drag { cursor: grab; color: var(--muted); user-select: none; font-size: 11px; letter-spacing: -1px; padding: 0 2px; touch-action: none; }
  .p-drag:hover { color: var(--ink); }
  .p-songrow.dragging { opacity: 0.45; }
  .p-songrow.drop-above { box-shadow: 0 -2px 0 var(--series-1); }
  .p-songrow.drop-below { box-shadow: 0 2px 0 var(--series-1); }
  .p-stress { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: var(--chip); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
  .p-x { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; margin-left: auto; }
  .p-x:hover { color: var(--ink); }
  /* justify-content, not margin:auto — the columns cap at 130px each, so on a wide card the
     grid is narrower than its container and would otherwise sit hard left with a lake of
     empty space beside it. No effect at the phone breakpoint below, where the columns
     become 1fr and already fill the row. */
  .p-grid { display: grid; grid-template-columns: 28px repeat(5, minmax(90px, 130px)); gap: 4px; margin-top: 12px; justify-content: center; }
  .p-head, .p-corner { display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--ink-2); }
  .p-cell { position: relative; aspect-ratio: 1; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4px; font-size: 12px; line-height: 1.25; cursor: pointer; }
  .p-cell.empty { color: var(--muted); border-style: dashed; }
  .p-cell.empty:hover, .p-cell.filled:hover { background: var(--accent-wash); }
  /* The donut is the whole square now, so it scales up to fill it rather than sitting at
     caption size above a label. line-height 1 keeps the glyph centred in the cell. */
  .p-cell.free { font-size: 54px; line-height: 1; cursor: default; }
  .p-cell.checked { background: var(--accent-wash); border-color: var(--series-1); box-shadow: inset 0 0 0 2px var(--series-1); }
  /* Reordering squares. Drag is mouse-only — see COARSE_POINTER in predictor.js — so no
     touch-action override here, which would otherwise stop a phone scrolling the moment a
     finger landed on the grid. */
  .p-cell.p-swappable { cursor: grab; }
  .p-cell.p-dragging { opacity: 0.4; cursor: grabbing; }
  .p-cell.p-swapfrom { border-color: var(--series-2); box-shadow: inset 0 0 0 2px var(--series-2); }
  .p-cell.p-swaptarget { background: var(--accent-wash); border-style: dashed; border-color: var(--series-2); }
  .p-cell .p-x { position: absolute; top: 0; right: 2px; }
  /* Always a span now, never a button — Lock mode owns the toggling, so this reports state
     and must not offer a cursor suggesting otherwise. It was 0.35 when it was a control
     sitting on all 24 squares and needed to stay out of the way; it now appears only where
     it means something, so it reads at full strength. */
  .p-cell .p-lock { position: absolute; top: 1px; left: 3px; background: none; border: none; cursor: inherit; font-size: 11px; opacity: 0.85; padding: 1px; }
  .p-cell.locked .p-lock { opacity: 1; }
  .p-cell.locked { background: var(--lock-wash); }
  /* Lock mode carries no icons at all. Twenty-four padlocks on a 5x5 grid competed with the
     song titles for the same few pixels — the FILL says locked on its own, and it says it
     from across the card rather than one cell at a time. A wash, not a border, since
     2026-08-15: the mobile bustout tiers own the border channel, and lock red on a border
     was indistinguishable from a mega-bustout ring one square over. Red, and its own token:
     --miss is fenced to results, and a locked square is not a wrong answer. In lock mode
     the fill is the ONLY signal — no glyph is drawn there — so the picker's pressed state
     runs the same wash twice (a full-bleed inset shadow stacks its alpha on the
     background's) to land visibly deeper than a locked square at rest, without minting a
     second token for one state. */
  .p-cell.p-lockpick.locked { background: var(--lock-wash); box-shadow: inset 0 0 0 999px var(--lock-wash); }
  .p-cell.p-lockpick:hover { background: var(--accent-wash); }
  /* Bustout tier, phone only. At 90-130px a desktop cell has room for the "MEGA BUSTOUT"
     pill; at the sub-70px squares five columns leave on a 375px phone it wrapped over half
     the square and buried the song name under its own badge (see the mobile screenshot
     that prompted this — three lines of badge above one line of title). The border already
     carries state on this exact element (checked/locked/swap all live here), so the tier
     joins that channel instead of costing text space: same three colours as the badge,
     moved from a fill to a ring.
     :not() rather than a source-order dependency, on purpose — this file already tracks
     one CSS ordering rule (the two dark token blocks) and a second, differently-shaped one
     living a few hundred lines away in the same stylesheet is exactly the kind of rule a
     future edit reorders by accident. Explicit beats implicit: a cell that is ALSO checked
     or mid-swap shows that state's border, never a fight between two. `.locked` is NOT in
     the guard list — locks moved to a background wash, so a locked bustout shows both:
     red fill, tier ring. */
  @media (max-width: 560px) {
    .p-cell .p-bust { display: none; }
    .p-cell.bust-minor:not(.checked):not(.p-swapfrom):not(.p-swaptarget) {
      border-color: var(--series-3); }
    .p-cell.bust-major:not(.checked):not(.p-swapfrom):not(.p-swaptarget) {
      border-color: var(--series-2); }
    .p-cell.bust-mega:not(.checked):not(.p-swapfrom):not(.p-swaptarget) {
      border-color: var(--bust-mega); box-shadow: inset 0 0 0 1px var(--bust-mega); }
  }
  .p-lockhint { margin: 10px 0 0; padding: 10px 12px; border: 1px solid var(--series-2);
    border-radius: 8px; background: var(--accent-wash); font-size: 13px; line-height: 1.45; }
  /* Scoring rules panel. Width-bounded so the tables stay scannable on a wide screen —
     a full-bleed two-column table reads as two unrelated lists. */
  .p-help { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); max-width: 620px; }
  .p-help table { margin: 2px 0 10px; }
  .p-help td { font-size: 13px; }
  /* Deliberately NOT nowrap: the longest value ("1 each, max 10") held a fixed column on
     a phone and squeezed its description into six wrapped lines. Letting the value wrap
     instead costs one line and keeps the rows readable. */
  .p-help td.num { padding-left: 12px; }
  .p-help .setlabel { margin-top: 6px; }
  .p-help .setlabel:first-child { margin-top: 0; }
  .p-help-note { font-size: 12px; color: var(--muted); line-height: 1.45; margin: -4px 0 12px; }
  .p-help-note:last-child { margin-bottom: 0; }
  /* A graded prediction, drawn as the setlist it was. Same three columns as the builder,
     so a result reads against the thing it is scoring. */
  .p-scored { margin: 2px 0 14px 14px; padding: 10px 12px; border-left: 2px solid var(--grid); }
  .p-scoredgrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .p-scoredgrid { grid-template-columns: 1fr; } }
  .p-pick { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 2px 0; font-size: 13px; border-bottom: 1px solid var(--grid); }
  .p-pickname { display: flex; flex-direction: column; gap: 1px; }
  .p-pickpts { font-variant-numeric: tabular-nums; font-weight: 600; flex-shrink: 0; }
  .p-placed .p-pickname { color: var(--series-3); }
  .p-called .p-pickname { color: var(--series-1); }
  /* Struck through rather than only recoloured: the point is that this pick did not
     happen, which strikethrough says without relying on colour alone. */
  .p-miss .p-pickname { color: var(--miss); text-decoration: line-through; text-decoration-thickness: 1px; }
  .p-miss .p-actual, .p-bonus { text-decoration: none; font-size: 11px; color: var(--muted); }
  .p-bonus { color: var(--series-2); }
  .p-picktotal, .p-grandtotal { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
  .p-picktotal { margin-top: 5px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .p-grandtotal { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--baseline); font-size: 14px; font-weight: 700; }
  .p-scoredfoot { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .p-key { display: flex; align-items: center; gap: 5px; }
  .p-key i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .p-key i.p-placed { background: var(--series-3); }
  .p-key i.p-called { background: var(--series-1); }
  .p-key i.p-miss { background: var(--miss); }
  /* Heading row: game title left, lock countdown pushed right and only as wide as its own
     text. As a full-width banner the countdown read as an alert; inline up here it is a
     status you pass on the way into the game. */
  .p-headrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .p-headrow h2 { margin: 0; }
  /* On a phone the game's own name is one thumb-width under the tab that is already
     showing it selected — hide the h2 and give the row back to the lock pill and the
     status, which are the parts that say something new. Games only (see render()):
     History and Profile have no tab and keep their heading everywhere. */
  @media (max-width: 560px) {
    .p-headrow-game h2 { display: none; }
    .p-headrow-game { justify-content: flex-start; }
  }
  /* Sits with the heading rather than centred between it and the countdown, which is
     where space-between would otherwise strand a third child. */
  .p-headnote { font-size: 13px; color: var(--ink-2); margin-right: auto; }
  /* Names the approach when it is not the house model. A pill rather than plain text, so it
     reads as a setting that is switched on rather than as a description of the game — and
     bordered rather than filled, because it must not compete with the lock countdown, which
     is the one thing on this row with a deadline attached. */
  .p-lensnote { font-size: 12px; color: var(--ink-2); white-space: nowrap;
    border: 1px solid var(--series-2); border-radius: 99px; padding: 2px 9px; cursor: help; }
  @media (max-width: 560px) { .p-lensnote { font-size: 11px; padding: 2px 7px; } }
  .p-lock { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--accent-wash); border: 1px solid var(--border); white-space: nowrap; }
  .p-lock.p-locked { border-color: var(--series-2); color: var(--ink); }
  /* Sits at the right-hand end of a control row without the row needing to know about it. */
  .p-pushright { margin-left: auto; }
  /* Actions dropdown. Anchored to its own button rather than to the row, so it opens under
     the button wherever a wrapped row has put it. The predictor card is .card-overflow
     (overflow: visible), which is what lets this escape the card at all. */
  /* Pinned to the far right of the control row, away from Save. margin-left:auto rather
     than order/float so it also lands last when the row wraps on a narrow screen. */
  .p-actions { position: relative; margin-left: auto; }
  /* One label or the other, never both. The word is the desktop form; on a phone the
     control row is the tightest horizontal space in the app, and "Actions ▾" spends 100px
     of it restating what a menu glyph says in 44. */
  .p-actions-dots { display: none; }
  @media (max-width: 560px) {
    .p-actions-word { display: none; }
    .p-actions-dots { display: inline; font-size: 20px; line-height: 1; }
    /* Square at the tap minimum once the label is gone, same as the Play a Show glyph. */
    .p-actions-btn { min-width: 44px; padding: 10px; justify-content: center; }
  }
  /* Anchored to the button's RIGHT edge, not its left: opening leftward from a right-pinned
     button keeps the panel on screen, where left:0 would push a 220px menu off it. */
  .p-actions-menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 20;
    min-width: 232px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px; box-shadow: 0 10px 28px rgba(0,0,0,0.30);
    display: flex; flex-direction: column; gap: 2px; }
  .p-actions-item { display: block; width: 100%; text-align: left; background: none;
    border: none; font: inherit; font-size: 13px; color: var(--ink); padding: 10px;
    border-radius: 7px; cursor: pointer; min-height: 44px; }
  .p-actions-item:hover:not(:disabled) { background: var(--accent-wash); }
  .p-actions-item:disabled { opacity: 0.4; cursor: default; }
  /* The commit action, centred under whichever game built it. Its own row rather than a
     margin on the button, so both games centre it the same way. */
  .p-saverow { display: flex; justify-content: center; }
  .p-cap { font-size: 11px; color: var(--muted); text-align: right; padding: 4px 2px 0; }
  .p-cap-over { color: var(--series-2); font-weight: 600; }
  /* Set headers are toggles. Baseline-aligned flex so the caret, the SET 1 label and the
     count read as one line; the count is pushed right, mirroring where the old counter
     row sat before it moved up here. The whole width is the target — a caret alone is a
     miss on a phone. */
  .p-sethead { display: flex; align-items: baseline; gap: 6px; width: 100%;
    background: none; border: none; padding: 6px 0 2px; cursor: pointer;
    font: inherit; text-align: left; color: var(--ink); }
  .p-sethead .setlabel { margin: 0; }
  .p-sethead .p-caret { color: var(--muted); font-size: 11px; display: inline-block;
    transition: transform 140ms ease; }
  .p-setcount { margin-left: auto; font-size: 12px; color: var(--ink-2);
    font-variant-numeric: tabular-nums; }
  .p-setcount.p-cap-over { color: var(--series-2); }
  .p-btn-alt { background: var(--surface); color: var(--ink); border: 1px solid var(--baseline); font-weight: 500; }
  .p-cellname { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  /* Phones: let the 5 bingo columns divide the available width instead of holding a
     90px floor, which forced ~498px of sideways scrolling on a 375px screen. Must come
     after the base .p-grid/.p-cell rules — same specificity, so source order decides.
     Also enlarges the drag handle, which is a finger target here rather than a cursor one. */
  @media (max-width: 560px) {
    /* No row labels on a phone — the top P·H·I·S·H already names the game, and the left
       column repeated it five times at the price of ~4px of song title per square. Their
       width goes back to the squares, whose font steps up with it. */
    .p-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; }
    .p-rowhead, .p-corner { display: none; }
    .p-cell { font-size: 10.5px; padding: 2px; border-radius: 6px; line-height: 1.2; }
    .p-cell.free { font-size: 32px; }
    .p-cellname { -webkit-line-clamp: 4; }
    /* Full opacity, not the desktop hover-reveal design: touch has no hover to reveal
       these with, so the faint default was effectively invisible.
       The opacity was the fix; the size was an overcorrection made alongside it. A 14px
       glyph sits in a ~52px cell whose song name is 9.5px, so the badge read louder than
       the square it was labelling. The glyph is back to its desktop size and the padding
       does the reaching instead — a bigger tap area around a smaller mark, with top/left
       compensating so it still lands in the same corner.
       Deliberately NOT the 44px target used elsewhere: these are secondary controls
       *inside* a primary one, and a 44px hit box would cover most of a 52px cell and
       swallow the tap that arms a swap. */
    .p-cell .p-lock { font-size: 11px; opacity: 0.85; padding: 5px; top: 0; left: 1px; }
    .p-cell .p-x { font-size: 12px; opacity: 0.85; padding: 5px; top: -2px; right: 0; line-height: 1; }
    .p-head, .p-corner { font-size: 11px; }
    .p-drag { font-size: 15px; padding: 6px 8px; }
    .p-songrow { padding: 5px 0; }
    /* The "last: date · venue · N shows ago" line under each picked song. At this width it
       set in 11px grey across two wrapped lines per row and made a ten-song set read as a
       wall. Hidden, not shrunk: the same facts are printed in the search suggestions at
       the moment they inform a choice — on a song already picked they are trivia. Desktop
       keeps the line; it has the width to give it one quiet row. */
    .p-songmeta { display: none; }
    /* The set toggles are primary navigation here — finger-sized like the tabs above. */
    .p-sethead { min-height: 44px; align-items: center; }
    /* The section tabs and mode buttons are the primary navigation on a phone and were
       39px tall — under the 44px a fingertip reliably hits. Widened here only, so the
       desktop bar keeps its tighter proportions. */
    .tab { padding: 12px 14px; }
    .p-mode { padding: 12px 14px; }
    .p-btn { padding: 12px 18px; }
    /* Five sub-tabs, laid out 3 over 2 and pinned there.
       As a wrapping flex row the split moved as you browsed: `.subtab.active` adds
       font-weight 600, bold is wider than regular, so activating a pill grew it ~4px and
       that was enough to push a neighbour onto the next line — the row you were looking at
       re-flowed underneath the tap that selected it. Measured: 3/2 became 2/3 on a ~414px
       phone, and at 375px the natural layout was 2/2/1 across three rows.
       A 3-column grid makes column width independent of the label inside it, so the active
       weight can stay and nothing moves. Five items fill it 3 then 2 by definition, at every
       width, with nothing to keep in step. Labels wrap to two lines rather than being
       abbreviated or truncated; the grid equalises row height, so a wrapped row still reads
       as one row. */
    .subtabs { display: grid; grid-template-columns: repeat(3, 1fr); }
    .subtab { padding: 10px 8px; min-height: 44px; text-align: center; line-height: 1.25; }
    /* The game control row only. Measured at 375px: Save + the pick button + the ⋮ came to
       307px in a 290px row, so the menu orphaned onto a line of its own — 17px short, which
       is exactly the 18px of side padding these two buttons did not need. Scoped to .p-row
       so the roomier padding survives everywhere it is not fighting for width. Height is
       untouched, so the 44px targets stand. */
    .p-row .p-btn { padding: 12px 12px; }
    /* The control row NEVER wraps. The padding trim above bought the common case back, but
       any label an em longer — a lens note, a different save label — re-orphaned the ⋮ onto
       its own line. Wrapping is the wrong failure for this row: it is Save, the roll and the
       menu, and a menu on a line by itself reads as a fourth control. So the row holds one
       line and the two TEXT buttons give up width instead, ellipsizing in the extreme.
       min-width: 0 is what actually permits that — a flex item's default min-width is
       max-content, and without zeroing it the buttons refuse to shrink and the row
       overflows the card instead. Scoped to .p-controls (the two game rows), NOT all
       .p-row: the sign-in form is a .p-row and stacks its fields on purpose. */
    .p-controls { flex-wrap: nowrap; }
    .p-controls .p-btn { min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; }
    /* The ⋮ is the one thing that must not shrink — it is already at the 44px minimum. */
    .p-controls .p-actions { flex-shrink: 0; }
    /* Same rule, same reason. It is shorter than 44px in the tab row on desktop on purpose
       — a 44px pill next to 36px text tabs reads as a banner that fell into the row — but a
       fingertip does not care why. */
    .btn-play { min-height: 44px; padding: 10px 14px; }
  }
  /* At 320px — the narrowest phone still worth supporting — the row is tightest. The
     horizontal padding gives space back without touching the 44px height, so the tap
     targets stay legal and only the dead space between labels shrinks. */
  @media (max-width: 360px) {
    .tab { padding: 12px 10px; }
  }
  /* The first-run intro. Sits in the flow above the game rather than over it — see the block
     comment in predictor.js. Bordered in the beam colour so it reads as the app talking,
     distinct from the quieter --border panels around it. */
  .p-wiz { margin: 8px 0 0; padding: 12px 14px; border: 1px solid var(--beam-2);
    border-radius: 10px; background: var(--surface); max-width: 620px; }
  .p-wiz-head { display: flex; align-items: baseline; gap: 8px; }
  .p-wiz-head h3 { margin: 0; font-size: 16px; }
  .p-wiz-skip { margin-left: auto; flex: none; background: none; border: none; cursor: pointer;
    color: var(--muted); font: inherit; font-size: 13px; padding: 6px 4px; min-height: 32px; }
  .p-wiz-skip:hover:not(:disabled) { color: var(--ink); text-decoration: underline; }
  .p-wiz-count { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .p-wiz-body { margin-top: 8px; }
  .p-wiz-copy { margin: 0 0 8px; font-size: 14px; line-height: 1.5; }
  .p-wiz-note { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 8px; }
  .p-wiz-body .p-field { display: block; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
  .p-wiz-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  /* .p-btn carries its own margin-top: 10px for the rows it usually sits in. Here the row
     already spaces itself, and the two stacked to 22px of dead space above the buttons. */
  .p-wiz-actions .p-btn { margin-top: 0; }
  /* Next/Finish pinned right, so the way forward is always in the same place whether or not
     the step has a Back beside it. */
  .p-wiz-actions .p-btn:last-child { margin-left: auto; }
  /* Skip is the escape hatch, so it has to be as hittable as the thing it escapes — it was
     36px wide on touch, under the 44px this file holds everything else to. */
  @media (max-width: 560px) { .p-wiz-skip { min-width: 44px; min-height: 44px; padding: 10px 8px; } }

  /* The pre-lock nudge. Deliberately a quiet strip and not a modal: the landing view opens
     on the games on purpose, and a dialog in front of that undoes the very thing it is
     trying to get somebody to do. Sits above the control row so it is read before the
     board, and disappears the moment a prediction is saved. */
  .p-nudge { display: flex; align-items: center; gap: 8px; margin: 8px 0 0;
    padding: 8px 10px; border-radius: 8px; font-size: 13px; line-height: 1.35;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); }
  .p-nudge b { color: var(--ink); }
  /* Inside 48 hours it earns colour. --lock rather than --miss for the same reason the lock
     borders use it: --miss is fenced to results, and an unsaved card is not a wrong answer. */
  .p-nudge-urgent { border-color: var(--lock); color: var(--ink); }
  .p-nudge-x { margin-left: auto; flex: none; background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 6px; min-height: 32px; }
  .p-nudge-x:hover { color: var(--ink); }
  @media (max-width: 560px) { .p-nudge-x { min-width: 44px; min-height: 44px; } }
  .p-bingo-banner { margin: 12px 0; padding: 12px; border: 2px solid var(--series-2); border-radius: 10px; text-align: center; font-size: 16px; }
  .p-histrow { padding: 5px 0; border-bottom: 1px solid var(--grid); }
  .p-flash { margin-top: 8px; color: var(--series-3); font-weight: 600; }
  .p-flash.err { color: var(--series-2); }
  .p-picker { margin-top: 10px; }
  .vs-controls { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
  .vs-panel { max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin: 6px 0; columns: 4; }
  @media (max-width: 900px) { .vs-panel { columns: 2; } }
  .vs-panel label { display: block; font-size: 12px; padding: 2px 0; break-inside: avoid; cursor: pointer; }
  .p-avatar { font-size: 15px; }
  .p-field { display: inline-block; margin: 6px 14px 6px 0; font-size: 12px; color: var(--ink-2); }
  .p-bio { display: block; min-width: 280px; min-height: 60px; resize: vertical; font: inherit; }
  .p-profilecard { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .p-boardrow { cursor: pointer; }
  .p-boardrow:hover { background: var(--accent-wash); }
  /* Your own row, so a long board answers "where am I" without reading every line. */
  .p-boardrow-me { background: var(--accent-wash); font-weight: 600; }
  /* The standings panel borrows the rules panel's box — same job, same place in the flow,
     opened from the same menu — but keeps its own class so the outside-click handler can
     tell them apart. Clicking inside the board is somebody reading it. */
  .p-board { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); max-width: 620px; }
  .p-board .setlabel:first-child { margin-top: 0; }
  .p-board .p-modes { margin: 6px 0 8px; }
  /* ---- attendance ---- */
  .p-attend { align-self: flex-start; background: var(--surface); color: var(--ink-2); border: 1px solid var(--border);
    border-radius: 99px; font: inherit; font-size: 12px; padding: 7px 14px; min-height: 36px; cursor: pointer; }
  .p-attend:hover { background: var(--accent-wash); }
  .p-attend.on { color: var(--ink); border-color: var(--series-1); font-weight: 600; box-shadow: inset 0 0 0 1px var(--series-1); }
  .p-attend:disabled { opacity: 0.6; cursor: default; }
  .p-there { font-size: 11px; color: var(--series-1); margin-left: 6px; }
  .p-attsummary { font-size: 13px; margin-bottom: 8px; }
  @media (max-width: 560px) { .p-attend { min-height: 44px; font-size: 13px; } }

  /* ---- track record (past predictions, graded) ---- */
  .tr-summary { margin: 6px 0 12px; font-size: 13px; }
  .tr-list { max-height: 190px; overflow-y: auto; margin: 8px 0; border: 1px solid var(--border); border-radius: 8px; }
  .tr-row { display: block; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--grid);
    color: var(--ink); font: inherit; font-size: 12px; padding: 8px 10px; min-height: 44px; cursor: pointer; }
  .tr-row:last-child { border-bottom: none; }
  .tr-row:hover { background: var(--accent-wash); }
  .tr-row.active { background: var(--accent-wash); box-shadow: inset 3px 0 0 var(--series-1); }
  .tr-row-metrics { color: var(--muted); }
  .tr-detail { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  /* ---- listen (Relisten / phish.in) ---- */
  .rl { margin-top: 12px; }
  .rl-open { background: var(--surface); color: var(--ink); border: 1px solid var(--baseline);
    border-radius: 99px; font: inherit; font-size: 13px; padding: 8px 14px; min-height: 44px;
    cursor: pointer; }
  .rl-open::before { content: '\25B6'; margin-right: 7px; color: var(--series-3); }
  .rl-open:hover { border-color: var(--series-3); background: var(--accent-wash); }
  .rl-box { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .rl-status { font-size: 13px; color: var(--ink-2); }
  .rl-now { font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
  /* Capped: a Phish show is routinely 25+ tracks, and an uncapped list pushes the credit
     line and everything after it off the bottom of the card. */
  .rl-tracks { max-height: 260px; overflow-y: auto; border: 1px solid var(--grid); border-radius: 8px; }
  .rl-track { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px;
    background: none; border: none; border-bottom: 1px solid var(--grid); color: var(--ink);
    font: inherit; font-size: 13px; text-align: left; padding: 6px 10px; cursor: pointer; }
  .rl-track:last-child { border-bottom: none; }
  .rl-track:hover { background: var(--accent-wash); }
  .rl-track.current { background: var(--accent-wash); box-shadow: inset 3px 0 0 var(--series-3); }
  .rl-ico { color: var(--series-3); font-size: 11px; width: 14px; flex: none; }
  .rl-title { flex: 1; }
  .rl-dur { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .rl-credit { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.45; }
  .rl-credit a { color: var(--ink-2); }
  .rl-head { font-size: 13px; margin-bottom: 2px; }
  .rl-likes { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .rl-sub { font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
  /* Triggers inside dense tables and grids. Small, but still 32px tall so a thumb can
     land on one — the 44px floor the rest of the app keeps would blow a table row open. */
  .rl-chip { background: none; border: 1px solid var(--border); border-radius: 6px;
    color: var(--ink-2); font: inherit; font-size: 11px; line-height: 1; padding: 6px 7px;

  /* The shared panel a bound container opens at its foot. */

  .tr-metrics { font-size: 13px; margin: 8px 0 10px; }
  .tr-songs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .tr-song { font-size: 11px; padding: 2px 7px; border-radius: 99px; border: 1px solid currentColor; }
  .tr-hit { color: var(--series-1); }
  .tr-miss { color: var(--muted); }

  .tr-slot { font-size: 12px; color: var(--ink-2); padding: 2px 0; }

  .collapsible.collapsed > h2::before { content: '▸'; }

  /* ---- account menu (hamburger, upper right) ---- */
  /* Align with the right edge of the centered 1180px content column (the wrap's edge is

  .menu-btn { position: fixed; top: 10px; right: max(12px, calc((100vw - 1180px) / 2)); z-index: 60; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1;

  .menu-backdrop { position: fixed; inset: 0; z-index: 58; background: rgba(0,0,0,0.35); display: none; }
  .menu-panel { position: fixed; top: 60px; right: max(12px, calc((100vw - 1180px) / 2)); z-index: 59; min-width: 260px; max-width: 92vw;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px;

  /* Also a .menu-item — it is the Profile button — so it needs the flex row back, and the

  .menu-id { display: flex; align-items: center; gap: 8px; padding: 8px 6px 10px;
    border-bottom: 1px solid var(--grid); border-radius: 0; margin-bottom: 8px;
    text-align: left; width: 100%; }
  .menu-id .p-avatar { font-size: 20px; }
  .menu-id:hover { background: var(--accent-wash); }
  .menu-stats { color: var(--muted); font-size: 11px; }
  /* The scoring reference reuses .p-help, which is sized for a card: a 620px cap and its

    margin-bottom: 8px; }
  .menu-scoring .p-help { max-width: none; border: none; background: none;
    padding: 0; margin-top: 0; }
  .menu-item { display: block; width: 100%; text-align: left; padding: 10px 8px; min-height: 44px;
    background: none; border: none; border-radius: 8px; color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
  .menu-item:hover { background: var(--accent-wash); }
  .menu-item.danger { color: var(--series-2); }
  .menu-form { padding: 8px 6px; display: flex; flex-direction: column; gap: 8px; }
  .menu-form .ta-input { max-width: none; }
  .menu-note { font-size: 11px; color: var(--muted); padding: 0 6px; }
  /* Theme pills. A row, not a list of three .menu-items: it is one setting with three

     as the panel's settings footer rather than another destination. */
  .menu-theme { display: flex; align-items: center; gap: 6px; padding: 10px 6px 6px;
    border-top: 1px solid var(--grid); margin-top: 8px; }
  .menu-theme .menu-note { padding: 0; margin-right: auto; }
  .friend-row, .invite-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;

  /* The group row's name-as-button. Takes the label span's flex:1 slot, styled as text

    font: inherit; font-size: 12px; color: var(--ink); text-align: left; cursor: pointer;
    min-height: 32px; }

  /* The roster's per-game dots: filled = saved a prediction for the open show. The pair

  .crew-head .ta-input { max-width: 220px; }

  .crew-strip { margin-bottom: 12px; }

  .crew-bar { height: 6px; border-radius: 99px; background: var(--grid); overflow: hidden; }
  /* The gradient is the rig's violet handing over to the chip green — the one place the

  .crew-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--beam-2), var(--chip)); }
  .crew-tabs { margin-bottom: 4px; }
  .crew-member { display: flex; align-items: center; gap: 6px; }
  .crew-member-right { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; }
  .m-chip-seal { font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; color: var(--lock);
    border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; white-space: nowrap; }
  .crew-roster-label { margin-top: 16px; }
  /* Reveal night. Bordered in the beam colour like the old intro card was — it is the one

  .crew-reveal { margin: 14px 0; padding: 12px 14px; border: 1px solid var(--beam-2);

  .crew-share { margin-top: 10px; }
  .friend-remove { background: none; border: 1px solid var(--border); border-radius: 99px; color: var(--series-2);
    font: inherit; font-size: 11px; padding: 4px 10px; min-height: 32px; cursor: pointer; }

    color: var(--ink); font: inherit; font-size: 12px; padding: 6px 10px; min-height: 32px; cursor: pointer; }
  .invite-copy:hover { background: var(--accent-wash); }

    .friend-remove, .invite-copy, .invite-limit { min-height: 44px; font-size: 13px; }

  /* Phones: right-hand drawer instead of a dropdown. Must follow the base .menu-panel
     rule — same specificity, so source order decides which wins. */
  @media (max-width: 560px) {
    .menu-panel { top: 0; right: 0; bottom: 0; border-radius: 12px 0 0 12px; width: 82vw; max-width: 320px;
      overflow-y: auto; padding-top: 64px; }

  /* ---- sign in / create account modal ---- */

    display: none; align-items: center; justify-content: center; padding: 16px; }

</style>
