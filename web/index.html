<body>
<button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu-panel" aria-label="Account menu">☰</button>
<div class="menu-backdrop" id="menu-backdrop"></div>
<div class="menu-panel" id="menu-panel" role="menu" aria-label="Account"></div>
<div class="auth-modal-backdrop" id="auth-modal-backdrop" role="dialog" aria-modal="true" aria-label="Sign in"></div>
<div class="wrap">
  <!-- Decorative: it carries no state a screen reader needs, so it is hidden from the tree
       entirely. First in .wrap so it sits behind everything that follows. -->
  <div class="hall" id="hall" aria-hidden="true"><div class="rig" id="rig"></div></div>
  <div class="stage" id="stage">
    <header>
      <h1>Bathtub Bets</h1>
      <!-- What this is, before any of the data. A first-time visitor previously met a
           freshness note ("data through August 1") and six analytics tabs, which says what
           the page contains but never what it is for. -->
      <p class="tagline">Guess what Phish plays next. We score you against the real setlist.</p>
    </header>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <nav class="subtabs" id="subtabs" style="display:none"></nav>
  <div class="grid" id="app"></div>
  <footer class="footer">Powered by <span class="nr">NovoRetro</span></footer>
</div>
<div id="tooltip"></div>
<script src="/web/reorder.js"></script>
<script src="/web/relisten.js"></script>
<script src="/web/predictor.js"></script>
<script>
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Rotating tagline: punny hybrids of the game and Phish lyrics. The list only grows —
// add new lines here, nowhere else. Rotates on page load, on a timed cadence while the
// tab is visible, and on sign-in (see the initPredictor call's onSignedIn below).
const TAGLINES = [
  "Place your bets, and lets take a ride",
  "Its 10pm, do you know where your shoes are?",
  "If you've ever gambled on lot oysters then you'll LOVE this game",
  "Have you taken care of your shoes today?",
  "Danger, you were told to expect it",
  "Welcome to the land of lizards",
  "Your fingers are the things on your hand that make contact with the board",
  "You've got a blank space where a setlist should be",
  "Your bets are like mangoes, you're gonna be a genius if you play!",
  "Toss away the songs you don't need in the end. But keep what's important and remember to hit save",
  "Set the gear shift to the high gear of your Bingo!",
  "Meatosticku jiuando, meatosticku basu tabu de no kake, meatosticku toridashta, jiuan, do do atamaga shock, do do atamaga shock",
  "Come waste your setlist with me",
  "Grind, Grind, Grind, Grind, Grind, Grind, Grind, Griiiiiiiiiiiiiind",
  "Melt the guns!",
  "I SAW YOU with a setlist in your hand",
  "You Enjoy My App",
  "Fluff...head?",
  "Never Woo A Wilson",
  "Let's go out to dinner and pick a setlist",
  "I'd like to bet your setlist so I could play it, what do ya say?",
  "Here come the ambassadors!",
  "WE LOVE TO TAKE A BATH!",
  "I think Wendy might still be on the windowsill",
  "Your time is near, the setlist is clear",
];
const TAGLINE_INTERVAL_MS = 60_000;
let taglineIdx = -1;
function nextTaglineIdx() {
  if (TAGLINES.length <= 1) return 0;
  let i;
  do { i = Math.floor(Math.random() * TAGLINES.length); } while (i === taglineIdx);
  return i;
}
// animate=false on first paint: the markup already has a fallback line, so swap it
// straight rather than fading from it. Reduced motion always swaps straight, but still
// rotates — "don't animate" isn't "don't change".
function showTagline(animate) {
  const node = document.querySelector('header .tagline');
  if (!node) return;
  taglineIdx = nextTaglineIdx();
  const text = TAGLINES[taglineIdx];
  const reduced = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  if (!animate || reduced) { node.textContent = text; return; }
  node.classList.add('tagline-out');
  setTimeout(() => { node.textContent = text; node.classList.remove('tagline-out'); }, 220);
}
showTagline(false);
setInterval(() => { if (document.visibilityState === 'visible') showTagline(true); }, TAGLINE_INTERVAL_MS);

// ---- the light rig. See the .stage CSS block for the reference this is built from.
const BEAMS = ['var(--beam-1)', 'var(--beam-2)', 'var(--beam-3)',
               'var(--beam-4)', 'var(--beam-5)', 'var(--beam-6)'];
// Fixture positions along the truss, as a percentage from centre. Every one is mirrored to
// the other side, which is what makes the wall read as a rig rather than as noise — the
// real one is bolted symmetrically and the symmetry survives even when the heads are
// panning independently.
const FIXTURES = [0, 11, 21, 31, 41, 50];
const BEAMS_PER_FIXTURE = 2; // a head throws a fan, not a single shaft
const rigEl = document.getElementById('rig');
const hallEl = document.getElementById('hall');
const reducedMotion = () => !!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;

const rand = (lo, hi) => lo + Math.random() * (hi - lo);

// side is -1 (stage left) or +1. Angles are negated across the centre line so a mirrored
// pair opens and closes together, the way a symmetric pair of heads actually moves.
function makeBeam(offsetPct, side, i) {
  const b = el('span', 'beam');
  // Beams splay outward from centre: the further out the fixture, the steeper its throw.
  const base = (offsetPct / 50) * 34 + rand(4, 14) + i * 7;
  const spread = rand(7, 16);
  const a1 = side * (base - spread);
  b.dataset.a1 = a1.toFixed(1);
  b.style.cssText =
    `--x:${50 + side * offsetPct}%;` +
    // Widths are for the throw length: the cone widens to --w over the hall's full height,
    // so these scale with it. Too narrow over 760px and the beams read as drawn lines.
    `--w:${Math.round(rand(100, 250))}px;` +
    `--c:${BEAMS[Math.floor(Math.random() * BEAMS.length)]};` +
    `--o:${rand(0.30, 0.62).toFixed(2)};` +
    `--a1:${a1.toFixed(1)}deg;` +
    `--a2:${(side * (base + spread)).toFixed(1)}deg;` +
    // Durations are deliberately coprime-ish and delays are negative, so the rig starts
    // mid-sweep already scattered instead of every head leaving home together.
    `--dur:${rand(6, 17).toFixed(1)}s;` +
    `--delay:${(-rand(0, 14)).toFixed(1)}s;`;
  return b;
}
function seedRig() {
  if (!rigEl) return;
  for (const offset of FIXTURES) {
    for (let i = 0; i < BEAMS_PER_FIXTURE; i++) {
      // The centre fixture is its own mirror — giving it a twin just doubles the draw.
      for (const side of offset === 0 ? [1] : [-1, 1]) {
        rigEl.appendChild(makeBeam(offset, side, i));
      }
    }
  }
}
// The fanfare: the whole rig blows out to white and the light raises, then comes back
// down. Fired when the app has something worth celebrating, not on a timer.
// The view is front-on, from the floor, so the hit is one vertical move. Every head
// gathers to straight down, then the light raises: the beams stay bolted to the truss and
// their broad far end lifts from the floor up toward it. Nothing rotates outward and
// nothing flips over — the heads never leave the top.
const PEAK_GATHER_MS = 280;
const PEAK_UP_MS = 900;
const PEAK_DOWN_MS = 860; // 280 + 900 + 860 = the sweep is handed back at exactly 2040ms
// Both ends are written with the SAME transform structure on purpose. Matched function
// lists interpolate component-wise, which is predictable; mismatched ones fall back to
// matrix decomposition, which is where a scale collapsing toward zero gets ambiguous.
// transform-origin is 50% 0, so scaleY shrinks toward the truss rather than about the
// middle — that is what keeps the beam pinned while its far end travels.
const BEAM_LOW = 'rotate(0deg) scaleX(1) scaleY(1)';
// Broader, and raised: the far end lifts to 22% of the hall while the throw widens.
const BEAM_HIGH = 'rotate(0deg) scaleX(1.6) scaleY(0.22)';
function rigPeak() {
  if (!hallEl || !rigEl) return;
  const beams = [...rigEl.children];
  // Reduced motion gets the white and the brightness, but nothing swings.
  if (reducedMotion()) {
    hallEl.classList.add('peak');
    setTimeout(() => hallEl.classList.remove('peak'), 1200);
    return;
  }
  const set = (ms, t) => {
    for (const b of beams) { b.style.transitionDuration = `${ms}ms`; b.style.transform = t; }
  };
  // Pin each head at the angle it is actually at before taking the sweep away, otherwise
  // dropping the animation snaps it home first and the move starts with a jerk.
  for (const b of beams) {
    b.style.transform = getComputedStyle(b).transform;
    b.style.animation = 'none';
  }
  void rigEl.offsetWidth; // flush, so the next write transitions instead of jumping
  hallEl.classList.add('peak');
  set(PEAK_GATHER_MS, BEAM_LOW);                                // gather: straight down
  setTimeout(() => set(PEAK_UP_MS, BEAM_HIGH), PEAK_GATHER_MS); // the hit: the light raises

  setTimeout(() => {
    // Colour returns on the way down, so the white belongs to the top of the raise.
    hallEl.classList.remove('peak');
    // Each head back to its own home angle, so the sweep can be handed back below.
    for (const b of beams) {
      b.style.transitionDuration = `${PEAK_DOWN_MS}ms`;
      b.style.transform = `rotate(${b.dataset.a1}deg)`;
    }
  }, PEAK_GATHER_MS + PEAK_UP_MS);

  setTimeout(() => {
    for (const b of beams) {
      b.style.transform = '';
      b.style.transitionDuration = '';
      // Home is exactly where the sweep's first keyframe is, so it can be handed back with
      // a zero delay and picks up from here seamlessly. Restoring the original negative
      // delay would drop the head mid-phase and jump.
      b.style.setProperty('--delay', '0s');
      b.style.animation = '';
    }
  }, PEAK_GATHER_MS + PEAK_UP_MS + PEAK_DOWN_MS);
}
seedRig();
// The header scrolls out of sight within the first screen, and a paused-for-nobody rig is
// 22 blurred, screen-blended layers still being composited every frame. Browsers throttle
// background *tabs* on their own but not content scrolled off a visible one, so pause it
// on the way out and let it pick up where it left off on the way back.
if (rigEl && hallEl && 'IntersectionObserver' in window) {
  new IntersectionObserver(
    ([e]) => rigEl.classList.toggle('idle', !e.isIntersecting),
  ).observe(hallEl);
}
// predictor.js reaches the rig through this — it is loaded before this script runs, so it
// reads the handle at call time rather than at load time.
window.KalphishiRig = { peak: rigPeak };

// Show dates are stored and compared as ISO (YYYY-MM-DD) everywhere — sorting, object
// keys, API params and search all depend on that — so this is display-only. Parsed from
// the parts rather than `new Date('2026-09-04')`, which JS reads as UTC midnight and then
// renders as the previous day for anyone west of Greenwich.
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'];
function fmtDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso ?? ''));
  if (!m) return String(iso ?? ''); // not a plain date — leave it untouched
  return `${MONTHS[+m[2] - 1]} ${+m[3]}, ${m[1]}`;
}
// Compact variant for dense rows, where the full form will not fit.
function fmtDateShort(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso ?? ''));
  if (!m) return String(iso ?? '');
  return `${MONTHS[+m[2] - 1].slice(0, 3)} ${+m[3]}`;
}
// Chart ticks only: the zero-padded day, nothing else.
//
// Repeating the month on every tick cost most of the slot and could never line up — the
// day alone varies in width ("Jul 7" measured 21.8px against 27.7px for "Jul 22"), and
// padding the day only moved the problem to the month, since "Aug" is wider than "Jul"
// in any proportional face. Two tabular digits are identical for every date there is, and
// the month belongs to the axis as a whole rather than to each tick, so it is stated once
// under the chart. The full date is on hover.
function fmtAxisDay(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso ?? ''));
  if (!m) return String(iso ?? '');
  return m[3];
}
// "Jul 7 – Aug 1, 2026" for a run that crosses a month, "Jul 7 – 31, 2026" for one inside
// it. Carries the context the ticks no longer repeat.
function fmtDateSpan(firstIso, lastIso) {
  const a = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(firstIso ?? ''));
  const b = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(lastIso ?? ''));
  if (!a || !b) return '';
  const mon = m => MONTHS[+m[2] - 1].slice(0, 3);
  const head = `${mon(a)} ${+a[3]}`;
  const tail = a[1] === b[1] && a[2] === b[2] ? `${+b[3]}` : `${mon(b)} ${+b[3]}`;
  return `${head} – ${tail}, ${b[1]}`;
}
window.fmtDate = fmtDate; // predictor.js renders dates too

// ---- account menu ----
// Shell + open/close semantics live here; predictor.js pushes state into it via
// window.KalphishiMenu.update(user, actions) on every render.
(function () {
  const btn = document.getElementById('menu-btn');
  const panel = document.getElementById('menu-panel');
  const backdrop = document.getElementById('menu-backdrop');
  let state = { user: null, actions: null };
  let lastFocus = null;

  const isOpen = () => document.body.classList.contains('menu-open');
  function open() {
    lastFocus = document.activeElement;
    document.body.classList.add('menu-open');
    btn.setAttribute('aria-expanded', 'true');
    drawContent();
    const first = panel.querySelector('button, input');
    if (first) first.focus();
  }
  function close() {
    document.body.classList.remove('menu-open');
    btn.setAttribute('aria-expanded', 'false');
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); else btn.focus();
  }
  btn.addEventListener('click', () => (isOpen() ? close() : open()));
  backdrop.addEventListener('click', close);
  document.addEventListener('keydown', ev => {
    if (!isOpen()) return;
    if (ev.key === 'Escape') { close(); return; }
    if (ev.key === 'Tab') {
      // keep focus inside the panel while it is open
      const focusables = [...panel.querySelectorAll('button, input')].filter(n => !n.disabled);
      if (!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (ev.shiftKey && document.activeElement === first) { last.focus(); ev.preventDefault(); }
      else if (!ev.shiftKey && document.activeElement === last) { first.focus(); ev.preventDefault(); }
    }
  });

  const mfetch = (path, method, body) =>
    fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(r => r.json().then(j => { if (!r.ok) throw new Error(j.error || r.status); return j; }));

  const item = (label, onClick, cls) => {
    const b = el('button', 'menu-item' + (cls ? ' ' + cls : ''), label);
    b.setAttribute('role', 'menuitem');
    b.addEventListener('click', onClick);
    return b;
  };

  function drawContent(view) {
    panel.innerHTML = '';
    const { user, actions } = state;

    // Data rides both states of the menu: it is reference material, it asks for no account,
    // and a signed-out visitor is exactly who arrives wanting to see the predicted setlist.
    const dataItem = () => item('📊 Data', () => { close(); window.KalphishiGoData?.(); });

    if (!user) {
      panel.appendChild(el('div', 'menu-note', 'Not signed in.'));
      panel.appendChild(item('Create account', () => { close(); actions?.openLogin('register'); }));
      panel.appendChild(item('Sign in', () => { close(); actions?.openLogin('login'); }));
      panel.appendChild(dataItem());
      panel.appendChild(themeRow());
      return;
    }

    // The identity block IS the Profile button. It already carried the name, handle and
    // totals; a separate "Profile" row below it was a second way to say the same thing, and
    // the block itself looked like a header you could not do anything with. Tapping who you
    // are to go to who you are needs no label.
    const s = user.stats || {};
    const id = el('button', 'menu-id menu-item',
      `<span class="p-avatar">${esc((user.profile && user.profile.avatar) || '🎣')}</span>` +
      `<span><b>${esc((user.profile && user.profile.displayName) || user.name)}</b> <span class="menu-stats">@${esc(user.handle)}</span><br>` +
      `<span class="menu-stats">${s.predictions ?? 0} predictions · ${s.scored ?? 0} scored` +
      // Setlist points and bingo scores are separate scales and are never merged.
      `${s.setlistPoints != null ? ' · ' + s.setlistPoints + ' pts' : ''}` +
      `${s.bingoScore != null ? ' · bingo ' + s.bingoScore : ''}` +
      `${s.bingos ? ' · ' + s.bingos + ' 🍩' : ''}</span></span>`);
    id.setAttribute('role', 'menuitem');
    id.title = 'Your profile';
    id.addEventListener('click', () => { close(); actions?.goTo('profile'); });
    panel.appendChild(id);

    // Changing a password used to be a view here. It now lives at the foot of Profile in
    // predictor.js — same account, one place — which is also why this panel no longer needs
    // a password branch at all.

    if (view === 'scoring') {
      // The full reference, both games. Built by predictor.js from the same constants the
      // scoring code uses, so this cannot drift from what actually gets awarded.
      const host = el('div', 'menu-scoring');
      const panelNode = actions?.scoringHelp?.();
      host.appendChild(panelNode || el('div', 'menu-note', 'Scoring rules are still loading.'));
      panel.appendChild(host);
      panel.appendChild(item('← Back', () => drawContent()));
      return;
    }

    if (view === 'friends') {
      const wrap = el('div', 'menu-form');
      const msg = el('div', 'menu-note');
      const listHost = el('div');
      const inviteHost = el('div');

      async function drawFriends() {
        listHost.innerHTML = '';
        let friends = [];
        try { friends = (await mfetch('/api/friends', 'GET')).friends; }
        catch (e) { listHost.appendChild(el('div', 'menu-note', e.message)); return; }
        if (!friends.length) {
          listHost.appendChild(el('div', 'menu-note', 'No friends yet — share an invite link below.'));
          return;
        }
        for (const f of friends) {
          const row = el('div', 'friend-row',
            `<span><span class="p-avatar">${esc(f.profile.avatar || '🎣')}</span> <b>${esc(f.name)}</b> ` +
            `<span class="menu-stats">@${esc(f.handle)}</span></span>`);
          const rm = el('button', 'friend-remove', 'Remove');
          rm.title = `Remove ${f.name} — this also removes you from their list`;
          rm.addEventListener('click', async () => {
            rm.disabled = true;
            try {
              await mfetch('/api/friends/' + encodeURIComponent(f.handle), 'DELETE');
              // Unfriending also drops them from your groups server-side, so member
              // counts here would otherwise show stale numbers.
              await Promise.all([drawFriends(), drawGroups()]);
            } catch (e) { rm.disabled = false; msg.textContent = e.message; }
          });
          row.appendChild(rm);
          listHost.appendChild(row);
        }
      }

      async function drawInvites() {
        inviteHost.innerHTML = '';

        // Both fetches up front: the group selector is part of the creation form, so
        // rendering the form before the groups are known would flash a friends-only-looking
        // control that silently gains options a moment later.
        let invites = [], groups = [];
        try {
          [invites, groups] = await Promise.all([
            mfetch('/api/invites', 'GET').then(j => j.invites),
            mfetch('/api/groups', 'GET').then(j => j.groups),
          ]);
        } catch (e) { inviteHost.appendChild(el('div', 'menu-note', e.message)); return; }

        const form = el('div', 'invite-row');
        // Owned groups only — redeeming a group link is the add-a-member act, and that is
        // owner-only. The server refuses anything else; this just doesn't offer it.
        const owned = groups.filter(g => g.isOwner);
        const scope = el('select', 'invite-limit');
        // textContent, not el()'s innerHTML: a group name is free text its owner typed.
        const plain = el('option');
        plain.value = ''; plain.textContent = 'Friend only';
        scope.appendChild(plain);
        for (const g of owned) {
          const opt = el('option');
          opt.value = g.id; opt.textContent = `+ ${g.name}`;
          scope.appendChild(opt);
        }
        const uses = el('input', 'invite-limit');
        uses.type = 'number'; uses.min = '0'; uses.value = '10'; uses.title = 'Uses — 0 for unlimited';
        const days = el('input', 'invite-limit');
        days.type = 'number'; days.min = '0'; days.value = '30'; days.title = 'Days until it expires — 0 for never';
        const make = el('button', 'p-btn', 'Create invite link');
        make.addEventListener('click', async () => {
          make.disabled = true;
          try {
            await mfetch('/api/invites', 'POST', {
              maxUses: Number(uses.value), expiresInDays: Number(days.value),
              groupId: scope.value || undefined,
            });
            await drawInvites();
          } catch (e) { make.disabled = false; msg.textContent = e.message; }
        });
        if (owned.length) form.appendChild(scope);
        form.appendChild(el('span', 'menu-stats', 'uses'));
        form.appendChild(uses);
        form.appendChild(el('span', 'menu-stats', 'days'));
        form.appendChild(days);
        inviteHost.appendChild(form);
        inviteHost.appendChild(make);
        // One note, not two: the old "whoever opens it becomes your friend" line said half
        // of this and sat directly beneath it.
        inviteHost.appendChild(el('div', 'menu-note',
          `Whoever opens it becomes your friend. 0 means no limit.${owned.length
            ? ' Pick a group and they join that too.' : ''}`));

        const live = invites.filter(i => !i.spent && !i.expired);
        if (!live.length) return;
        for (const i of live) {
          const url = `${location.origin}/?invite=${i.code}`;
          const row = el('div', 'invite-row');
          const label = i.group ? `📋 Copy ${i.group.name} link` : '📋 Copy link';
          const copy = el('button', 'invite-copy');
          copy.textContent = label;
          copy.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(url);
              copy.textContent = '✓ Copied';
            } catch {
              // Clipboard needs permission/secure context; fall back to selectable text.
              copy.textContent = 'Copy manually →';
              const box = el('input', 'ta-input');
              box.value = url; box.readOnly = true;
              row.appendChild(box); box.select();
            }
            setTimeout(() => { copy.textContent = label; }, 1800);
          });
          row.appendChild(copy);
          // Limits are shown because they are now real: a link that says nothing about its
          // reach is the state this was fixing.
          const left = i.maxUses == null ? '∞' : i.maxUses - i.uses;
          const dleft = i.expires == null ? null : Math.ceil((i.expires - Date.now()) / 86_400_000);
          row.appendChild(el('span', 'menu-stats',
            ` used ${i.uses}${i.maxUses ? '/' + i.maxUses : ''} · ${left} left` +
            (dleft == null ? ' · no expiry' : dleft <= 1 ? ' · expires today' : ` · ${dleft}d left`)));
          const rev = el('button', 'friend-remove', 'Revoke');
          rev.addEventListener('click', async () => {
            rev.disabled = true;
            try { await mfetch('/api/invites/' + encodeURIComponent(i.code), 'DELETE'); await drawInvites(); }
            catch (e) { rev.disabled = false; msg.textContent = e.message; }
          });
          row.appendChild(rev);
          inviteHost.appendChild(row);
        }
      }

      const groupHost = el('div');

      async function drawGroups() {
        groupHost.innerHTML = '';
        groupHost.appendChild(el('div', 'setlabel', 'Groups'));
        // The open show, from the predictor — it owns which show the games are on. The
        // dots and counts are aimed at it; without it (predictor not ready) the listing
        // still renders, just without the "in for" figures.
        const showdate = state.actions?.showdate?.();
        const groupsPath = '/api/groups' + (showdate ? `?showdate=${encodeURIComponent(showdate)}` : '');
        let groups = [], friends = [];
        try {
          [groups, friends] = await Promise.all([
            mfetch(groupsPath, 'GET').then(j => j.groups),
            mfetch('/api/friends', 'GET').then(j => j.friends),
          ]);
        } catch (e) { groupHost.appendChild(el('div', 'menu-note', e.message)); return; }

        // "Fri", from the show's own date — never from today's.
        const day = showdate
          ? new Date(showdate + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short' })
          : '';
        if (!groups.length) groupHost.appendChild(el('div', 'menu-note', 'No groups yet.'));
        for (const g of groups) {
          // The name is the way into the Crew page (SOCIAL-PLAN.md, Phase 2) — the drawer
          // keeps management, the room gets everything you look at. Phase 1's in-drawer
          // roster lived here for exactly one release before the room replaced it; the
          // route it read is the same one the Crew page reads, so nothing was lost and
          // every member can still open it.
          const row = el('div', 'friend-row');
          const open = el('button', 'grp-open',
            `<b>${esc(g.name)}</b> <span class="menu-stats">${g.memberCount} member${g.memberCount === 1 ? '' : 's'}` +
            `${g.inCount != null ? ` · ${g.inCount} in for ${day}` : ''}` +
            `${g.isOwner ? '' : ' · joined'}</span>`);
          open.title = 'Open this crew’s page';
          open.addEventListener('click', () => { close(); actions?.goToCrew?.(g.id); });
          row.appendChild(open);
          // Owners manage; everyone else can only leave.
          if (g.isOwner) {
            const add = el('button', 'friend-remove', '＋ Add');
            add.style.color = 'var(--ink-2)';
            add.addEventListener('click', () => drawAddPicker(g, friends));
            row.appendChild(add);
            const del = el('button', 'friend-remove', 'Delete');
            del.addEventListener('click', async () => {
              del.disabled = true;
              try {
                await mfetch('/api/groups/' + encodeURIComponent(g.id), 'DELETE');
                // Invites too: any link into this group has just become a plain friend
                // invite, and the selector must lose the option.
                await Promise.all([drawGroups(), drawInvites()]);
              } catch (e) { del.disabled = false; msg.textContent = e.message; }
            });
            row.appendChild(del);
          } else {
            const leave = el('button', 'friend-remove', 'Leave');
            leave.addEventListener('click', async () => {
              leave.disabled = true;
              try {
                await mfetch(`/api/groups/${encodeURIComponent(g.id)}/members/${encodeURIComponent(user.handle)}`, 'DELETE');
                await drawGroups();
              } catch (e) { leave.disabled = false; msg.textContent = e.message; }
            });
            row.appendChild(leave);
          }
          groupHost.appendChild(row);
        }

        const nameInput = el('input', 'ta-input');
        nameInput.placeholder = 'new group name';
        const create = el('button', 'p-btn', 'Create group');
        const go = async () => {
          const name = nameInput.value.trim();
          if (!name) return;
          create.disabled = true;
          try {
            await mfetch('/api/groups', 'POST', { name });
            nameInput.value = '';
            // A brand-new group has to appear in the invite selector, or the first thing
            // an owner wants to do with it — share it — isn't offered.
            await Promise.all([drawGroups(), drawInvites()]);
          } catch (e) { msg.textContent = e.message; }
          create.disabled = false;
        };
        create.addEventListener('click', go);
        nameInput.addEventListener('keydown', ev => { if (ev.key === 'Enter') go(); });
        groupHost.appendChild(nameInput);
        groupHost.appendChild(create);
      }

      // Only friends are offered — groups are subsets of your friend list, so there is
      // no free-text handle entry that would bypass the invite flow.
      async function drawAddPicker(g, friends) {
        groupHost.innerHTML = '';
        groupHost.appendChild(el('div', 'setlabel', `Add to ${g.name}`));
        let members = [];
        try { members = (await mfetch(`/api/groups/${encodeURIComponent(g.id)}/members`, 'GET')).members; }
        catch { /* fall through with an empty list */ }
        const inGroup = new Set(members.map(m => m.handle));
        const available = friends.filter(f => !inGroup.has(f.handle));
        if (!available.length) {
          groupHost.appendChild(el('div', 'menu-note', friends.length
            ? 'All your friends are already in this group.'
            : 'Add friends first — share an invite link above.'));
        }
        for (const f of available) {
          const row = el('div', 'friend-row', `<span><b>${esc(f.name)}</b> <span class="menu-stats">@${esc(f.handle)}</span></span>`);
          const add = el('button', 'friend-remove', 'Add');
          add.style.color = 'var(--ink-2)';
          add.addEventListener('click', async () => {
            add.disabled = true;
            try {
              await mfetch(`/api/groups/${encodeURIComponent(g.id)}/members`, 'POST', { handle: f.handle });
              await drawAddPicker(g, friends);
            } catch (e) { add.disabled = false; msg.textContent = e.message; }
          });
          row.appendChild(add);
          groupHost.appendChild(row);
        }
        // Members currently in the group, with removal for the owner.
        if (members.length > 1) {
          groupHost.appendChild(el('div', 'setlabel', 'In this group'));
          for (const mem of members) {
            const row = el('div', 'friend-row',
              `<span><b>${esc(mem.name)}</b> <span class="menu-stats">@${esc(mem.handle)}${mem.isOwner ? ' · owner' : ''}</span></span>`);
            if (!mem.isOwner) {
              const rm = el('button', 'friend-remove', 'Remove');
              rm.addEventListener('click', async () => {
                rm.disabled = true;
                try {
                  await mfetch(`/api/groups/${encodeURIComponent(g.id)}/members/${encodeURIComponent(mem.handle)}`, 'DELETE');
                  await drawAddPicker(g, friends);
                } catch (e) { rm.disabled = false; msg.textContent = e.message; }
              });
              row.appendChild(rm);
            }
            groupHost.appendChild(row);
          }
        }
        const back = el('button', 'p-btn p-btn-alt', '← Back to groups');
        back.addEventListener('click', () => drawGroups());
        groupHost.appendChild(back);
      }

      wrap.appendChild(listHost);
      wrap.appendChild(inviteHost);
      wrap.appendChild(groupHost);
      wrap.appendChild(msg);
      panel.appendChild(wrap);
      panel.appendChild(item('← Back', () => drawContent()));
      drawFriends();
      drawInvites();
      drawGroups();
      return;
    }

    // Ordered by how often a returning player reaches for each thing, not by how the app is
    // built. Who you are, then what you did, then who you are playing against — that is the
    // loop the cohort is here for, and Friends now sits inside it rather than below the
    // reference material. How scoring works is read once or twice and then rarely, so it
    // drops to just above the way out. Change password is gone from this list entirely: it
    // is account maintenance, it lives in Profile with the rest of the account, and it was
    // taking a top-level slot ahead of the social loop.
    panel.appendChild(item('My History', () => { close(); actions?.goTo('history'); }));
    panel.appendChild(item('Friends', () => drawContent('friends')));
    // Data sits after the social loop and before the reference reading: it is somewhere
    // you go, not something you read here, but it is still reached less often than the
    // people you are playing against. It moved here from the tab row — the row is the
    // game surface, and on a phone Data was costing a third of it.
    panel.appendChild(dataItem());
    panel.appendChild(item('How scoring works', () => drawContent('scoring')));
    panel.appendChild(themeRow());
    panel.appendChild(item('Sign out', async () => { close(); await actions?.signOut(); }, 'danger'));
  }

  // ---- theme ----
  // Three states, and "Auto" is a real one, not the absence of a choice: it means "follow
  // the OS", and most people never need anything else. An explicit choice writes
  // data-theme onto <html>, which the CSS is built around — :root[data-theme="dark"]
  // duplicates the dark tokens outside the media query precisely so that an explicit dark
  // can win on a light OS (see the comment on the token blocks). localStorage rather than
  // the profile: the theme belongs to the device, not the account — the phone on the lawn
  // and the desktop at home want different answers, and a signed-out visitor gets to keep
  // their choice too.
  const THEME_KEY = 'kalphishi-theme';
  const themeGet = () => { try { return localStorage.getItem(THEME_KEY); } catch { return null; } };
  function applyTheme(t) {
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    else delete document.documentElement.dataset.theme;
  }
  function themeRow() {
    const row = el('div', 'menu-theme');
    row.appendChild(el('span', 'menu-note', 'Theme'));
    const cur = themeGet() || 'auto';
    for (const [val, label] of [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']]) {
      const b = el('button', 'p-mode' + (cur === val ? ' active' : ''), label);
      b.addEventListener('click', () => {
        try {
          if (val === 'auto') localStorage.removeItem(THEME_KEY);
          else localStorage.setItem(THEME_KEY, val);
        } catch { /* private mode — applies for this visit, forgets on the next */ }
        applyTheme(val);
        drawContent(); // redraw so the active pill moves
      });
      row.appendChild(b);
    }
    return row;
  }
  applyTheme(themeGet());

  window.KalphishiMenu = {
    update(user, actions) {
      state = { user, actions };
      if (isOpen()) drawContent();
    },
    // The Crew page's link back to the toolbox: its owner ⋮ opens the drawer's Friends
    // view (invites, add, remove) rather than duplicating those flows in the room.
    openFriends() { open(); drawContent('friends'); },
  };
})();

// ---- sign in / create account modal ----
// Pure chrome: predictor.js owns the sign-in/register form and its state (authPrompt);
// this just gives that content a floating home instead of an inline slot in the page
// flow. show()/hide() are the programmatic API predictor.js drives every render from —
// hide() is a no-op if already closed, so calling it unconditionally is safe. Dismissal
// via Esc or backdrop click is chrome-initiated, so it's reported back through the
// dismiss callback rather than assumed — predictor.js's authPrompt is the single source
// of truth for whether the form should be showing.
(function () {
  const backdrop = document.getElementById('auth-modal-backdrop');
  let dismissCb = null;
  let lastFocus = null;

  function isOpen() { return backdrop.classList.contains('open'); }

  function doHide() {
    if (!isOpen()) return;
    backdrop.classList.remove('open');
    backdrop.innerHTML = '';
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); else document.getElementById('menu-btn')?.focus();
  }

  backdrop.addEventListener('click', ev => {
    if (ev.target !== backdrop) return; // only the dimmed area, not the card itself
    doHide();
    dismissCb?.();
  });
  document.addEventListener('keydown', ev => {
    if (!isOpen()) return;
    if (ev.key === 'Escape') { doHide(); dismissCb?.(); return; }
    if (ev.key === 'Tab') {
      const focusables = [...backdrop.querySelectorAll('button, input')].filter(n => !n.disabled);
      if (!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (ev.shiftKey && document.activeElement === first) { last.focus(); ev.preventDefault(); }
      else if (!ev.shiftKey && document.activeElement === last) { first.focus(); ev.preventDefault(); }
    }
  });

  window.KalphishiAuthModal = {
    show(contentNode) {
      if (!isOpen()) lastFocus = document.activeElement;
      backdrop.innerHTML = '';
      backdrop.appendChild(contentNode);
      backdrop.classList.add('open');
      const first = contentNode.querySelector('input') || contentNode.querySelector('button');
      if (first) first.focus();
    },
    hide: doHide,
    onDismiss(cb) { dismissCb = cb; },
  };
})();

const tooltip = document.getElementById('tooltip');

// Mouse tracks on hover; touch has no hover, so a tap toggles the tip and a tap
// anywhere else dismisses it. tipOwner is the node currently showing a tapped tip.
let tipOwner = null;
function showTip(name, why, x, y) {
  tooltip.innerHTML = `<div class="tt-name">${esc(name)}</div><div class="tt-why">${esc(why)}</div>`;
  tooltip.style.display = 'block';
  // A phone has no hover, so every tip here is a deliberate tap — and anchoring a 300px
  // card to a fingertip near the edge of a 375px screen leaves it clamped hard against a
  // margin and half under the thumb that opened it. Centre it instead and let it read as
  // a small panel. Dismissal is unchanged: it is pointer-events:none, so a tap anywhere
  // reaches the document handler below.
  const phone = window.matchMedia('(max-width: 560px)').matches;
  tooltip.classList.toggle('tt-modal', phone);
  if (phone) { tooltip.style.left = ''; tooltip.style.top = ''; return; }
  const w = tooltip.offsetWidth, h = tooltip.offsetHeight;
  // Flip above the finger when there is not room below, and keep it on-screen.
  const top = y + 14 + h > window.innerHeight ? Math.max(8, y - 14 - h) : y + 14;
  tooltip.style.left = Math.max(8, Math.min(x + 14, window.innerWidth - w - 8)) + 'px';
  tooltip.style.top = top + 'px';
}
function hideTip() { tooltip.style.display = 'none'; }

document.addEventListener('pointerup', ev => {
  if (tipOwner && !tipOwner.contains(ev.target)) { hideTip(); tipOwner = null; }
}, true);

function bindTip(node, name, why) {
  node.addEventListener('pointermove', ev => {
    if (ev.pointerType !== 'mouse' || tipOwner) return;
    showTip(name, why, ev.clientX, ev.clientY);
  });
  node.addEventListener('pointerleave', ev => {
    if (ev.pointerType === 'mouse' && !tipOwner) hideTip();
  });
  node.addEventListener('pointerup', ev => {
    if (ev.pointerType === 'mouse') return;
    if (tipOwner === node) { hideTip(); tipOwner = null; }
    else { tipOwner = node; showTip(name, why, ev.clientX, ev.clientY); }
  });
}
