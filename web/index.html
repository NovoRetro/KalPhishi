    : `<span class="song">${esc(x.name)}</span>`);

  const candTable = tableOf(
    ['#', 'Song', 'Chance', 'Score', 'Rotation', 'Shows since', 'Cadence', 'Tour plays', 'Why'],
    rows.slice(0, 60).map((x, i) => [
      num(i + 1),
      songCell(x),
      // Ahead of Score on purpose: this is the column a reader can actually use. Score is
      // the model's internal unit and is kept beside it because the ordering is score's.
      // Whole percent only — the measured worst-bucket error is about 5 points, so a
      // decimal would be advertising precision the fit does not have.
      x.p == null ? '<span class="num chance chance-none">—</span>'
        : `<span class="num chance">${Math.round(x.p * 100)}%</span>`,
      x.score == null ? '<span class="num chance-none">—</span>' : `<span class="score">${x.score}</span>`,
      pct(x.windowFreq), num(x.currentGap), num(x.medianInterval), num(x.tourPlays),
      // Full text, clamped to one line by CSS — see .why-trunc. The reason travels in a
      // data attribute too, so the tip reads it without depending on what the clamp left
      // visible.
      `<span class="why why-trunc" data-song="${esc(x.name)}" data-why="${esc((x.why || []).join('; '))}">${esc((x.why || []).join('; '))}</span>`,
      // Shifted by one from [0,2,3,4,5,6]: inserting Chance at index 2 moved every numeric
      // column after it. These drive right-alignment AND the numeric filter/sort mode, so a
      // stale index silently turns a number column into a substring match.
    ]), [0, 2, 3, 4, 5, 6, 7]);
  c.appendChild(candTable);
  // Where Chance comes from, and what it is not. Both halves matter: without the first it
  // reads as a number somebody made up, and without the second the repeated values in the
  // middle of the table read as a bug rather than as the fit declining to pretend.
  if (rows.some(x => x.p != null)) {
    c.appendChild(el('div', 'hint',
      'Chance is measured, not asserted: every past show in the era window was re-predicted '
      + 'using only what was known beforehand, and each score was scored against what actually '
      + 'played. Of everything called 20%, about 20% played — within roughly 5 points. '
      + '<b>Nothing reaches 30%</b>, because a Phish setlist is never a sure thing; the top of '
      + 'this list plays about three times in ten. Songs sharing a Chance are songs the '
      + 'calibration cannot honestly separate, which is most of the middle of the table — '
      + 'the ranking there is finer than the evidence behind it.'));
  } else if (arm && !arm.usesCalibration) {
    // Not a gap to be filled later — showing a Chance here would be actively wrong. The
    // isotonic bins were fitted on the shipping model's score distribution; run them over a
    // different arm's scores and the number is a mis-calibration wearing a credible label.
    c.appendChild(el('div', 'hint',
      `Chance is blank under <b>${esc(arm.label)}</b>. The calibration was fitted on the `
      + 'shipping model\'s scores, and applying it to a different approach\'s scores would '
      + 'produce a confident-looking number with nothing behind it. The ranking is still this '
      + 'approach\'s own, and its measured accuracy is in the Nerd Zone.'));
  }
  // Bound after the table exists, since tableOf builds its cells from HTML strings and
  // there is no node to hand a listener to until it has run.
  for (const cell of candTable.querySelectorAll('.why-trunc')) {
    bindTip(cell, cell.dataset.song, cell.dataset.why);
  }
  if (window.KalphishiListen) window.KalphishiListen.bind(c);
  }
  fillRanked();
  app.appendChild(c);

  // ---- nerd zone
  //
  // Appended here, with the other cards, because `sections` below is a ONE-TIME snapshot of
  // app.children. A card appended after that line is never in the show/hide loop and would
  // render on every sub-tab at once.
  // Plain `card`, NOT card-overflow: `.card` carries overflow-x:auto, which gives the
  // comparison table its own scroller. card-overflow sets overflow:visible for cards whose
  // content must escape the box, and here that let a 445px table push the page sideways on
  // a 375px phone.
  const nerd = el('div', 'card');
  nerd.dataset.section = 'Nerd Zone';
  nerd.appendChild(el('h2', null, 'Nerd zone <span class="hint">— how the prediction is made, and what happens if you make it differently.</span>'));

  // One collapsible section. Shared by the explainer, the model playground and each diagnostic
  // so they all behave identically — <details>/<summary> for the accessibility and find-in-page
  // behaviour a div with a click handler silently gives up. Returns the body to append into.
  const makeSection = (host, title, { open = false, cls = '' } = {}) => {
    const d = el('details', ('nz-sec ' + cls).trim());
    d.open = open;
    d.appendChild(el('summary', null, title));
    const body = el('div', 'nz-secbody');
    d.appendChild(body);
    host.appendChild(d);
    return body;
  };

  // The explainer is collapsible and starts CLOSED. It was open, but with a playground section
  // below it that is the thing people actually came to touch, four paragraphs of preamble is
  // what stands between them and it. The heading says what is inside.
  const introBody = makeSection(nerd, 'How the prediction is made', { cls: 'nz-sec-first' });

  introBody.appendChild(el('div', 'nz-prose',
    '<p><b>Two slices.</b> Horizontally, what this tour has been playing and how long it has '
    + 'been since each song came round — every song has its own cadence, and being overdue '
    + 'against <i>its own</i> cadence matters more than being rare. Vertically, what this band '
    + 'plays <i>at this venue</i>, which is a real signal at a room they return to.</p>'
    + '<p><b>A score, then a setlist.</b> Each candidate accumulates a score: era frequency as '
    + 'the base, plus dueness, venue history and a bonus for conspicuous absence, minus '
    + 'penalties for having just been played or already appearing three times this tour. Then '
    + 'the songs are assembled into sets — openers, closers and encores are drawn from songs '
    + 'that historically hold those slots, rather than just taking the top of the list.</p>'
    + '<p><b>A probability, separately.</b> The score is an arbitrary unit — 44 is not "twice '
    + 'as likely" as 22. Calibration maps it onto real probabilities by re-predicting every '
    + 'past show and checking what actually played. It is <i>monotonic</i>, so it never '
    + 'reorders anything; it only attaches a meaning to the number.</p>'
    + '<p><b>How any of this is checked.</b> Every approach below was run against '
    + `${A.lenses ? A.lenses.measuredOver : 0} past shows, one at a time, each predicted using `
    + '<i>only</i> what was known before it. The model throws rather than proceed if it is '
    + 'ever handed a row dated on or after the show it is predicting, so a good number here '
    + 'cannot come from having seen the answer.</p>'));

  if (A.lenses && A.lenses.arms.length) {
    // ---- the playground ----
    //
    // Open by default: it is the only part of this card anybody can interact with, and the
    // rest of the tab is reference material around it.
    const play = makeSection(nerd, `🎛 Let's play with models!`, { open: true });
    play.appendChild(el('div', 'nz-play-intro',
      '<p>Swap the model out and watch the night change. Whatever you pick re-ranks '
      + '<b>Predicted Setlist</b> and <b>All candidates</b> here in Data.</p>'
      + '<p class="nz-where"><b>Where you feel it:</b> in either game, open the <b>⋮ Actions</b> '
      + 'menu and press the first item — <b>🛟 Our Prediction</b>. It fills your card from the '
      + 'model, and it is <i>renamed to whatever you pick below</i>, so the button always says '
      + 'which answer you are about to get.</p>'
      + '<p>None of this can touch your points or the standings. A prediction is graded against '
      + 'what the band actually played, never against the model that helped you fill it.</p>'));

    // What is currently selected, and the way back. Previously a reader could only tell by
    // hunting for the highlighted button, and the way back lived on a badge attached to some
    // other card entirely.
    const current = el('div', 'nz-current');
    play.appendChild(current);

    // Two groups, each with a one-line description rather than a bare label. The distinction
    // between them is the whole framing — one set is trying to be right, the other is not —
    // and "Pick an approach" / "Or a what-if" did not carry it on its own.
    play.appendChild(el('div', 'setlabel', 'Approaches'));
    play.appendChild(el('div', 'hint nz-group-note',
      'Real attempts to predict better. Each was run against every past show in the window.'));
    const picker = el('div', 'p-modes nz-picker');
    play.appendChild(picker);

    const whatIfLabel = el('div', 'setlabel', 'What-ifs');
    const whatIfNote = el('div', 'hint nz-group-note',
      'Not attempts to predict better — each re-ranks tonight by how often a song turned up in a '
      + 'past era. Fun, and measurably less accurate; the scoreboard below says by how much.');
    const whatIfPicker = el('div', 'p-modes nz-picker');
    play.append(whatIfLabel, whatIfNote, whatIfPicker);
    const blurb = el('div', 'hint nz-blurb');
    play.appendChild(blurb);

    // Ordered by measured recall, so the menu itself reports the finding rather than
    // flattering the shipping default by putting it first.
    //
    // What-if lenses are sorted WITHIN their own group and always sit below the approaches,
    // never interleaved. Sorted together, era 3.0 lands second on recall — above the shipping
    // model — and the table would then read as "predicting tonight as though it were 2015
    // works better", which is the one thing these numbers do not say: a control with the era
    // data deleted scores identically, so the era table contributes nothing.
    const byRecall = (x, y) => y.recall - x.recall;
    const approaches = A.lenses.arms.filter(a => !a.whatIf).sort(byRecall);
    const whatIfs = A.lenses.arms.filter(a => a.whatIf).sort(byRecall);
    const ordered = [...approaches, ...whatIfs];
    const ref = A.lenses.reference;
    // One decimal, unlike pct() elsewhere. The gaps between these arms are around a single
    // point, and rounding to whole percent renders the two closest as the same number —
    // which turned the finding below into the sentence "28% against 28%".
    const pct1 = v => (v * 100).toFixed(1) + '%';

    // The scoreboard, folded inside the playground. It is the evidence behind every button
    // above and it is six columns of it — unfolded, the numbers arrive before anybody has
    // pressed anything, which is backwards for the one section built to be played with.
    const board = makeSection(play, 'How each one scored', { cls: 'nz-sec-nested' });
    board.appendChild(tableOf(
      ['Approach', 'Precision', 'Recall', 'Hits/show', 'vs baseline', 'Real?'],
      ordered.map(a => [
        `${esc(a.label)}${a.isDefault ? ' <span class="nz-ship">shipping</span>' : ''}`
        + `${a.whatIf ? ' <span class="nz-whatif">what-if</span>' : ''}`,
        pct1(a.precision), pct1(a.recall), a.hitsPerShow.toFixed(2),
        a.key === ref ? '<span class="chance-none">baseline</span>'
          : `${a.deltaRecallVsBaseline >= 0 ? '+' : ''}${(a.deltaRecallVsBaseline * 100).toFixed(1)}pp`,
        a.key === ref ? '<span class="chance-none">—</span>'
          : Math.abs(a.z) >= 2 ? '<b>yes</b>' : '<span class="chance-none">noise</span>',
      ]), [1, 2, 3, 4]));

    board.appendChild(el('div', 'hint',
      `Measured over ${A.lenses.measuredOver} shows. <b>vs baseline</b> is the recall gap `
      + `against <i>${esc(lensByKey.get(ref)?.label || ref)}</i>, the naive "play what they have `
      + 'been playing" approach. <b>Real?</b> asks whether that gap is bigger than two standard '
      + 'errors — under that, it is not distinguishable from chance, however large it looks.'));

    // The two findings a reader should not have to derive from the table themselves.
    const topN = lensByKey.get('modelTopN');
    const shipping = lensByKey.get('model');
    const gap = lensByKey.get('modelShowGap');
    const notes = [];
    if (topN && shipping && topN.recall > shipping.recall) {
      notes.push('<b>The slot logic currently costs accuracy.</b> Taking the top of the list '
        + `and ignoring sets scores ${pct1(topN.recall)} recall against the assembled setlist's `
        + `${pct1(shipping.recall)}. The assembly is what makes a readable setlist with an `
        + `opener and an encore, and it is paying about ${(topN.hitsPerShow - shipping.hitsPerShow).toFixed(2)} `
        + 'hits a show for it.');
    }
    if (gap && Math.abs(gap.z) < 2) {
      notes.push('<b>The old show-gap recency was not beating the naive baseline</b> to within '
        + 'measurement error, which is what the day curve replaced.');
    }

    // The arm at the TOP of the table is the one most able to mislead, because the column it
    // tops is the comparison against a bar every model arm clears. Its two caveats are stated
    // here, from published figures rather than prose, because a reader who takes the top row
    // at face value has been misled by an accurate table.
    const due = lensByKey.get('modelDuenessTopN');
    if (due && due.vsNearest) {
      const vn = due.vsNearest;
      const near = lensByKey.get(vn.arm);
      notes.push(`<b>Native Model tops this table, and it tops it by less than it looks.</b> `
        + `Against the naive baseline it gains ${(due.deltaRecallVsBaseline * 100).toFixed(1)}pp, the most here. `
        + `But it differs from <i>${esc(near?.label || vn.arm)}</i> in exactly one respect — where the `
        + `dueness rule comes from — and measured straight against it the gain is `
        + `${(vn.delta * 100 >= 0 ? '+' : '') + (vn.delta * 100).toFixed(2)}pp with a standard error of `
        + `${(vn.se * 100).toFixed(2)}, so z ${vn.z.toFixed(2)}. By the same test as the <b>Real?</b> column, `
        + 'that is not distinguishable from chance. It is not demonstrably better than the hand-picked rule '
        + 'it replaces — it is fitted rather than guessed, and not worse.');

      // Per-year, so "it gains" and "it gains, all of it lately" cannot be confused. Thin
      // years are dropped from the sentence but stay in the drift table below.
      const mine = due.byYear || [];
      const theirs = near?.byYear || [];
      const deltas = mine
        .map((y, i) => ({ year: y.year, shows: y.shows, d: y.recall - (theirs[i]?.recall ?? y.recall) }))
        .filter(x => x.shows >= 10);
      if (deltas.length >= 2) {
        const worst = deltas.reduce((m, x) => (x.d < m.d ? x : m), deltas[0]);
        const last = deltas[deltas.length - 1];
        if (worst.d < 0 && last.d > 0) {
          notes.push('<b>And what gain there is, is recent.</b> In '
            + `${worst.year} it was ${Math.abs(worst.d * 100).toFixed(1)}pp <i>behind</i> `
            + `${esc(near?.label || vn.arm)}; in ${last.year} it is ${(last.d * 100).toFixed(1)}pp ahead. `
            + 'That fits what the drift measurement below shows — as the rotation churns faster, a curve '
            + 'refitted at every show gains on constants fixed by hand years ago — but a pattern noticed '
            + 'after the fact is a hypothesis, not a result. The next run of shows is the test of it, and '
            + 'this one cannot be, because it is where the pattern was found.');
        }
      }
    }
    // The what-if rows carry a "vs baseline" figure that flatters them, because every approach
    // on this page clears that bar. Era 3.0 in particular reads as a strong positive there and
    // is nothing of the kind — so the control result is stated where the table is read, not
    // left to the blurb somebody sees only after selecting it.
    const era30 = lensByKey.get('modelEra30TopN');
    if (era30 && era30.vsControl) {
      const c = era30.vsControl;
      notes.push('<b>The era lenses are not competing, and the closest one is not doing what it looks '
        + `like it is doing.</b> <i>${esc(era30.label)}</i> scores level with the shipping model, which `
        + 'invites the reading that predicting tonight as a 2015 show works. It does not: running the '
        + 'same maths with the era table <i>deleted</i> — ranking on the model\'s own recent play rate '
        + `instead — scores ${Math.abs(c.delta * 100) < 0.05 ? 'identically' : (c.delta * 100).toFixed(2) + 'pp apart'} `
        + `(z ${c.z.toFixed(2)}). The gain is the shape of the maths, not anything the era knows. `
        + 'That is the third test worth applying to any new term here, after the two in the notes above: '
        + 'does it beat the same term with its new data taken away?');
    }

    if (notes.length) board.appendChild(el('div', 'nz-notes', notes.map(n => `<p>${n}</p>`).join('')));

    // CORRECTED 2026-08-15. This used to read "it does not touch the games — Our Prediction
    // always fills from the shipping model", which stopped being true when a chosen approach
    // was wired into Our Prediction and nobody updated the copy. test/lenses.test.mjs:168
    // documents that the invariant changed deliberately; the sentence describing it did not.
    // What is left here is the part that is still true and still load-bearing.
    play.appendChild(el('div', 'hint',
      '<b>Track record</b> stays pinned to the shipping model whatever you pick: it records '
      + 'predictions that were actually published before a show, and no other approach here has '
      + 'ever published one. Your own points are safe for a simpler reason — a prediction is '
      + 'graded against what the band played, never against the model that helped you fill it.'));

    // Repainted rather than rebuilt, so the card keeps its scroll position on a change.
    function paintPicker() {
      const fill = (host, list) => {
        host.innerHTML = '';
        for (const a of list) {
          const b = el('button', 'p-mode' + (a.key === lens ? ' active' : ''), esc(a.label));
          b.addEventListener('click', () => setLens(a.key));
          host.appendChild(b);
        }
      };
      fill(picker, approaches);
      fill(whatIfPicker, whatIfs);
      // An older arms.json has no what-if arms at all; showing an empty row under a heading
      // reads as a broken feature rather than an absent one.
      const has = whatIfs.length > 0;
      for (const n of [whatIfLabel, whatIfNote, whatIfPicker]) n.style.display = has ? '' : 'none';
      const a = lensArm();
      blurb.innerHTML = a ? `${esc(a.blurb)}` : '';

      // What is on, in words, with the way back beside it. The highlighted button already says
      // this, but only to somebody looking at the row — and the reset used to live on a badge
      // attached to whichever other card the lens had altered.
      current.innerHTML = lensIsDefault()
        ? `<span class="nz-cur-label">Playing:</span> <b>${esc(a ? a.label : 'House Model')}</b> `
          + '<span class="nz-ship">shipping</span>'
        : `<span class="nz-cur-label">Playing:</span> <b>${esc(a ? a.label : '')}</b>`
          + `${a && a.whatIf ? ' <span class="nz-whatif">what-if</span>' : ''}`
          + ' <button class="lens-reset" type="button">back to the shipping model</button>';
    }
    paintPicker();

    // eslint-disable-next-line no-inner-declarations
    function setLens(key) {
      if (!lensByKey.has(key)) return;
      lens = key;
      try { localStorage.setItem('bb-lens', key); } catch { /* private mode */ }
      paintPicker();
      fillPredicted();
      fillRanked();
      // The games show a chip naming the approach, and Our Prediction fills from it, so
      // they have to hear about the change too.
      predictor?.refresh?.();
    }
    // The badge on each re-ranked card offers the way back, and it is rebuilt on every
    // refill, so the listener is delegated from the app root rather than bound per badge.
    app.addEventListener('click', ev => {
      if (ev.target.closest('.lens-reset')) setLens(LENS_DEFAULT);
    });

    // ---- diagnostics ----
    //
    // Measurements of the shipping model, from the same walk-forward that produced the table
    // above. They are NOT arms: nothing here re-ranks anything and there is nothing to pick,
    // which is why they sit below a rule rather than beside the picker.
    //
    // Absent from an arms.json generated before the block existed, hence the guard — an old
    // artifact should cost the section, not the whole card.
    const D = A.lenses.diagnostics;
    if (D) {
      const diag = el('div', 'nz-diag');
      diag.appendChild(el('h3', null, 'How well does it actually work?'));
      diag.appendChild(el('p', 'hint',
        'Nothing below is an option — these are measurements of the shipping model, from the '
        + 'same walk-forward as the table above.'));

      // First column text, the rest numeric. Deliberately not tableOf(): that one adds a
      // filter box and a sort toggle per column, which on a four-row table is more furniture
      // than data.
      const plainTable = (headers, rows) => el('table', null,
        '<tr>' + headers.map((h, i) => `<th${i ? ' class="num"' : ''}>${h}</th>`).join('') + '</tr>'
        + rows.map(r => '<tr>' + r.map((c, i) => `<td${i ? ' class="num"' : ''}>${c}</td>`).join('') + '</tr>').join(''));

      // All four start CLOSED. They were "first open, rest closed" when nothing else on the
      // card was expanded and a page of bare headings would have read as a failure to load.
      // The playground is now open above them, so the card already shows what a section looks
      // like unfolded, and four question-shaped headings under a visible intro line read as a
      // menu rather than as an empty page.
      const section = title => makeSection(diag, esc(title));
      // Prose beside a visual on a wide screen, stacked on a narrow one. Returns both halves.
      const split = parent => {
        const wrap = el('div', 'nz-split');
        const left = el('div');
        const right = el('div');
        wrap.append(left, right);
        parent.appendChild(wrap);
        return { left, right };
      };

      if (D.spread) {
        const s = D.spread;
        const body = section('One show is mostly luck');
        const { left, right } = split(body);
        left.appendChild(el('p', null,
          `Over ${A.lenses.measuredOver} shows the model averages <b>${s.mean.toFixed(1)} hits</b> from `
          + `${s.budget} picks. The average is the least useful number here: half of all shows land `
          + `between ${s.p25} and ${s.p75} hits, the middle 80% between <b>${s.p10} and ${s.p90}</b>, `
          + `and the range runs from ${s.min} to ${s.max}. Predicting one night, that spread is the `
          + 'honest expectation — which is exactly why a three-night run tells you more than a single show.'));

        // Continuous axis: iterating the observed keys alone would silently close a gap and
        // draw a smoother distribution than the one measured.
        const counts = s.histogram;
        const max = Math.max(...Object.values(counts));
        const hist = el('div', 'nz-hist');
        for (let k = s.min; k <= s.max; k++) {
          const n = counts[k] || 0;
          hist.appendChild(el('div', 'hk', String(k)));
          const bar = el('div', 'hb' + (k >= s.p10 && k <= s.p90 ? ' mid' : ''));
          bar.style.width = Math.max(3, Math.round((n / max) * 100)) + '%';
          const cell = el('div');
          cell.appendChild(bar);
          hist.appendChild(cell);
          hist.appendChild(el('div', 'hn', n ? `${n} show${n === 1 ? '' : 's'}` : ''));
        }
        right.appendChild(hist);
        right.appendChild(el('p', 'hint', 'Hits per show. Shaded bars are the middle 80% of shows.'));
      }

      if (D.reachability) {
        const r = D.reachability;
        const body = section('Some of the show was never reachable');
        body.appendChild(el('p', null,
          `An average show is ${r.meanSetSize.toFixed(1)} songs, and <b>${r.meanUnreachable.toFixed(1)} of them</b> `
          + `had not been played once in the previous ${r.trail} shows. Bustouts, debuts and one-offs cannot `
          + 'be produced by <i>any</i> approach on this page, because every one of them ranks songs by how '
          + `they have recently been played. That caps recall at <b>${(r.ceiling * 100).toFixed(0)}%</b> before `
          + `the model does anything at all. Of the ${r.meanReachable.toFixed(1)} songs that <i>were</i> `
          + `reachable, it finds <b>${(r.captured * 100).toFixed(0)}%</b> — so the ceiling is not what is `
          + 'holding the number down.'));
      }

      if (D.drift && D.drift.length) {
        const body = section('Is it holding up?');
        const THIN = 10;
        body.appendChild(plainTable(
          ['Year', 'Shows', 'Model', 'Baseline', 'Gap', 'Unreachable'],
          D.drift.map(r => [
            r.shows < THIN ? `<span class="nz-thin">${r.year}</span>` : r.year,
            r.shows,
            (r.model * 100).toFixed(1) + '%',
            (r.baseline * 100).toFixed(1) + '%',
            `<b>${r.edge >= 0 ? '+' : ''}${(r.edge * 100).toFixed(1)}pp</b>`,
            r.unreachable.toFixed(1),
          ])));
        const solid = D.drift.filter(r => r.shows >= THIN);
        const thin = D.drift.filter(r => r.shows < THIN);
        if (solid.length >= 2) {
          const a = solid[0], b = solid[solid.length - 1];
          body.appendChild(el('p', null,
            `<b>The model is not getting better — the naive approach is getting worse.</b> Its own recall `
            + `is roughly flat (${(a.model * 100).toFixed(1)}% in ${a.year}, ${(b.model * 100).toFixed(1)}% in `
            + `${b.year}). What moved is the baseline, which fell from ${(a.baseline * 100).toFixed(1)}% to `
            + `${(b.baseline * 100).toFixed(1)}% over the same span, while songs it could never reach rose to `
            + `${b.unreachable.toFixed(1)} a night. The gap widens because the band is rotating harder and `
            + 'busting out more, which punishes &ldquo;play what they played last week&rdquo; far more than '
            + 'it punishes a model that also weighs cadence and absence.'));
        }
        if (thin.length) {
          body.appendChild(el('p', 'hint',
            `${thin.map(r => r.year).join(', ')} covers only ${thin.map(r => r.shows).join('/')} shows — `
            + 'too few to read a trend from. It stays in the table because dropping a row to tidy a trend '
            + 'is the thing this whole section argues against.'));
        }
      }

      if (D.reliability) {
        const rel = D.reliability;
        const body = section('Do the percentages mean anything?');
        const { left, right } = split(body);
        left.appendChild(el('p', null,
          'The <b>Chance</b> column on Ranked Songs is only worth printing if it is true. Across '
          + `${rel.shows} shows and ${rel.samples.toLocaleString()} song-outcomes — every one scored against `
          + 'a fit that had not seen it — of everything called X%, this is what actually played:'));
        right.appendChild(plainTable(
          ['Called', 'Actually played', 'Songs'],
          rel.buckets.map(b => [
            (b.predicted * 100).toFixed(1) + '%',
            (b.observed * 100).toFixed(1) + '%',
            b.n.toLocaleString(),
          ])));
        const top = rel.buckets[rel.buckets.length - 1];
        left.appendChild(el('p', null,
          `Average miss <b>${(rel.weightedError * 100).toFixed(2)}pp</b>, worst row `
          + `${(rel.worstBucket * 100).toFixed(1)}pp. The last row is the one worth sitting with: the songs `
          + `this thing is most confident about play about <b>${(top.observed * 100).toFixed(0)}% of the time</b>. `
          + 'There is no bucket above that, because nothing in a Phish setlist is a sure thing — and a model '
          + 'that told you otherwise would be lying to you.'));
      }

      nerd.appendChild(diag);
    }
  } else {
    // This is a USER-FACING surface and this branch used to print "Run `npm run backtest`" —
    // a shell command, on a phone, to somebody who came to guess a setlist. It fires whenever
    // the visitor's cached analysis.json predates the lens payload, which is exactly what
    // happens to anyone who had the site open before a deploy, so it is not rare enough to be
    // treated as developer-only. Say what the reader can actually do about it.
    nerd.appendChild(el('div', 'hint',
      'The approach comparison is not loading. If you had this page open earlier, a reload '
      + 'should bring it back — it usually means your browser is holding an older copy of the '
      + 'data.'));
  }
  app.appendChild(nerd);

  // ---- play a show
  //
  // Its own destination rather than another Data sub-tab: everywhere else audio hangs off
  // a show the model was already talking about, so it answers "what did that sound like".
  // This one answers "I want to listen to something", which is a different errand and does
  // not start from the model at all.
  //
  // The catalogue is Relisten's, not ours — 39 years of it — so nothing here is derived
  // from analysis.json. A year is one request, cached for the session, and the list only
  // ever offers shows that actually have a source behind them.
  const playCard = el('div', 'card card-overflow');
  playCard.dataset.play = '1';
  app.appendChild(playCard);

  let playBuilt = false;
  function buildPlayShow() {
    if (playBuilt) return;
    playBuilt = true;
    const L = window.KalphishiListen;
    playCard.innerHTML = '';
    playCard.appendChild(el('h2', null,
      'Play a Show <span class="hint">— streamed from phish.in, indexed by Relisten</span>'));
    if (!L || !L.loadYears) {
      playCard.appendChild(el('div', 'hint', 'The listening module did not load.'));
      return;
    }

    const quickHost = el('div', 'ps-quick-host');
    playCard.appendChild(quickHost);

    const filters = el('div', 'ps-filters');
    const yearSel = el('select', 'ps-year');
    const search = el('input', 'ta-input ps-search');
    search.placeholder = 'filter by venue, city or date…';
    search.setAttribute('aria-label', 'Filter shows');
    filters.appendChild(yearSel);
    filters.appendChild(search);
    playCard.appendChild(filters);

    const head = el('div', 'ps-listhead', 'Loading the catalogue…');
    playCard.appendChild(head);
    const list = el('div', 'ps-list');
    playCard.appendChild(list);

    // `all` is every show for the selected scope; `label` describes that scope. The search
    // box filters `all` on the way to the DOM rather than mutating it, so clearing the box
    // restores the full list without another fetch.
    let all = [];
    let label = '';

    const matches = (s, q) =>
      !q || `${s.date} ${fmtDate(s.date)} ${s.venue} ${s.location}`.toLowerCase().includes(q);

    function paintList() {
      const q = search.value.trim().toLowerCase();
      const rows = all.filter(s => matches(s, q));
      list.innerHTML = '';
      head.textContent = rows.length === all.length
        ? `${label} · ${all.length} show${all.length === 1 ? '' : 's'}`
        : `${label} · ${rows.length} of ${all.length} shown`;
      if (!rows.length) {
        list.appendChild(el('div', 'hint', 'No shows match that filter.'));
        return;
      }
      for (const s of rows) list.appendChild(showRow(s));
    }

    // Collapsed by default; the panel is built once on first expand and then only hidden,
    // never removed. Destroying it would take its transport controls away from a recording
    // that carries on playing — the <audio> is global and does not care about the DOM.
    function showRow(s) {
      const row = el('div', 'ps-row');
      const where = [s.venue, s.location].filter(Boolean).join(' · ');
      const btn = el('button', 'ps-rowhead',
        `<span class="ps-caret">&#9656;</span>` +
        `<span class="ps-date">${esc(fmtDate(s.date))}</span>` +
        `<span class="ps-where">${esc(where)}</span>` +
        (s.soundboard ? '<span class="ps-sbd" title="A soundboard source exists">SBD</span>' : ''));
      btn.setAttribute('aria-expanded', 'false');
      const body = el('div', 'ps-body');
      let loaded = false;
      btn.addEventListener('click', () => {
        const open = row.classList.toggle('open');
        btn.setAttribute('aria-expanded', String(open));
        if (open && !loaded) { loaded = true; L.renderShow(body, s.date); }
      });
      row.appendChild(btn);
      row.appendChild(body);
      return row;
    }

    // The quick way in. Names the most recent show Relisten actually has, so it stays
    // truthful as the tour advances without anything here being edited.
    function paintQuick(s) {
      quickHost.innerHTML = '';
      if (!s) return;
      const where = [s.venue, s.location].filter(Boolean).join(' · ');
      const b = el('button', 'ps-quick',
        `<span class="ps-quick-ico">&#9654;</span>` +
        `<span><span class="ps-quick-main">Play ${esc(fmtDate(s.date))}</span>` +
        `<span class="ps-quick-sub">${esc(where)} — the latest show with a recording</span></span>`);
      b.addEventListener('click', () => {
        // Jump to that row, open it, and start it from the top. One press, one stream.
        const target = [...list.querySelectorAll('.ps-row')]
          .find(r => r.querySelector('.ps-date').textContent === fmtDate(s.date));
        if (target && !target.classList.contains('open')) target.querySelector('.ps-rowhead').click();
        if (target) target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        const body = target ? target.querySelector('.ps-body') : el('div');
        L.renderShow(body, s.date, { start: true });
      });
      quickHost.appendChild(b);
    }

    search.addEventListener('input', paintList);
    yearSel.addEventListener('change', async () => {
      const v = yearSel.value;
      head.textContent = 'Loading…';
      list.innerHTML = '';
      if (v === 'tour') return showTour();
      all = await L.loadYear(v);
      label = v;
      paintList();
    });

    let tourShows = [];
    let tourName = '';
    function showTour() {
      all = tourShows;
      label = tourName || 'Most recent shows';
      paintList();
    }

    (async () => {
      const years = await L.loadYears();
      if (!years.length) {
        head.textContent = 'Could not reach the Relisten catalogue.';
        return;
      }
      // The most recent tour, derived from the newest year's newest show rather than
      // hardcoded — Relisten labels each show with its tour, so "this tour" is a fact in
      // the data instead of a date range we would have to maintain.
      const latest = await L.loadYear(years[0].year);
      const newest = latest[0];
      tourName = newest && newest.tour ? newest.tour : `${years[0].year} shows`;
      tourShows = newest && newest.tour ? latest.filter(s => s.tour === newest.tour) : latest;

      yearSel.appendChild(el('option', null, tourName)).value = 'tour';
      for (const y of years) {
        yearSel.appendChild(el('option', null, `${y.year} (${y.shows})`)).value = y.year;
      }
      yearSel.value = 'tour';
      showTour();
      paintQuick(newest);
    })();
  }

  // ---- tabs
  //
  // The games come first, because they are why the app gets opened. Everything the model
  // knows sits behind Data, subdivided — it used to all render at once on an "All Data"
  // default, which was 45,000px and 55 screens of scrolling on a phone before a visitor
  // had done anything.
  const tabBar = document.getElementById('tabs');
  const subBar = document.getElementById('subtabs');
  const sections = [...app.children];
  const GAME_TABS = [
    { name: 'Phish Bingo', mode: 'bingo' },
    { name: 'Setlist Bets', mode: 'setlist' },
    // The draft-crossed-with-ranked-choice crew game — see WOMBAT.md for the rules and
    // the simulation that shaped them. Third and last: the row holds four items at
    // 320px only because Data left it for the menu.
    { name: 'Wombat', mode: 'wombat' },
  ];
  // Six now. The mobile grid is repeat(3, 1fr), so six pills fill it 3+3 with no trailing
  // gap — measured, no CSS change needed. These strings are matched character-for-character
  // against each card's dataset.section; a typo makes a pill that shows nothing.
  const DATA_TABS = ['Predicted Setlist', 'Song Rotation', 'Album Coverage', 'Venue History', 'Ranked Songs', 'Nerd Zone'];
  let activeTab = GAME_TABS[0].name;
  let activeDataTab = DATA_TABS[0];

  // The standings are not in this row. They were, briefly, and a fourth tab cost a
  // permanent slot in the one row a phone can least afford for something read occasionally
  // — and a combined board had to rank by one game's scale while printing the other's
  // beside it. They now open per game from that game's Actions menu, ranked by the game
  // they belong to.
  //
  // The short labels stay: three full labels plus Play a Show still need more room than a
  // 375px phone has, and shortening them is what keeps this to one line.
  const SHORT_LABELS = { 'Phish Bingo': 'Bingo', 'Setlist Bets': 'Setlist' };
  // 560px, the same breakpoint the touch sizing and the banner stack already use, rather
  // than the 460 this started at. Measured by sweeping widths: the full labels plus the full
  // Play a Show button need 498px and do not fit until about 522px, so a 460px switch left a
  // band from 461 to ~530 where the row wrapped — narrow enough to miss on a phone and a
  // desktop and to only turn up on a tablet.
  const narrowTabs = window.matchMedia('(max-width: 560px)');
  const tabLabel = name => (narrowTabs.matches && SHORT_LABELS[name]) || name;

  // ---- banner actions
  //
  // Built once and left alone, unlike the tab bar, which is emptied and rebuilt on every
  // render — so renderTabs re-appends the button rather than re-creating it, and its click
  // handler survives.
  //
  // Play a Show rides the tab row, pinned right. It sat floating on the banner above the
  // row, which read as elevated above the things it is actually a peer of — it is somewhere
  // you go, and every other somewhere-you-go is in that row. The freshness stamp stays on
  // the banner: it describes the data behind Data and is not a destination at all.
  //
  // The catalogue is fetched the first time the button is pressed, not at page load — 39
  // years of index is not worth loading for a visitor who came to fill in a bingo card.
  const stageEl = document.getElementById('stage');
  const stageActions = el('div', 'stage-actions');
  // "Updated", not "Last updated:" — the shorter label is what keeps this narrow enough for
  // the tagline to keep a readable column beside it. At the longer wording the block is
  // 171px wide and the tagline has to drop to a 340px column, which pushes the longest
  // lines to three rows.
  stageActions.appendChild(el('span', 'pill stamp', 'Updated ' + esc(fmtDate(A.asOf))));
  if (stageEl) stageEl.appendChild(stageActions);

  const playBtn = el('button', 'btn-play');
  playBtn.addEventListener('click', () => {
    activeTab = 'Play a Show'; menuMode = null; buildPlayShow(); renderTabs();
  });

  function renderTabs() {
    const game = GAME_TABS.find(g => g.name === activeTab);
    // History and profile come from the account menu and belong to no tab, so while one is
    // open the card shows and no game reads as selected.
    const showingGames = !!game || !!menuMode;

    // The rig plays the game you're in (2026-08-15 direction): bingo keeps the violet
    // wall, Setlist Bets goes sunset (Carini), Wombat goes green/yellow/indigo. The
    // attribute drives CSS variable overrides — the beams reference var(--beam-N) live,
    // so the wall re-colours without touching a single element. Set only when a game is
    // active: menu views keep whatever was playing, which reads as the lights holding
    // between songs rather than the rig noticing you opened a menu.
    if (game) document.documentElement.dataset.rig = game.mode;

    tabBar.innerHTML = '';
    for (const { name } of GAME_TABS) {
      const b = el('button', 'tab' + (name === activeTab && !menuMode ? ' active' : ''), esc(tabLabel(name)));
      b.addEventListener('click', () => { activeTab = name; menuMode = null; renderTabs(); });
      tabBar.appendChild(b);
    }
    // Data is not in this row any more — it opens from the ☰ menu, beside My History and
    // Friends. The row is the game surface, and Data is reference material: on a phone the
    // slot it held was a third of the one row that has to hold the games, spent on the
    // destination visitors reach for least. The view itself is unchanged — activeTab still
    // takes 'Data', the sub-tab pills still render under the row — only the way in moved.
    // window.KalphishiGoData (below) is the way the menu reaches it.

    // Pinned to the far right of the row by margin-left:auto in the CSS, so it reads as
    // separated from the four that are views rather than a fifth one. Re-appended rather
    // than rebuilt — the row is emptied every render and the handler lives on the element.
    // The narrow form was the glyph alone, from when a Leaderboard tab shared this row and
    // there was no room for a word. That tab is gone, so re-measured: three short tabs and
    // the gaps take 199 of the 327px bar at 375px, and "▶ Play" needs 71 — 57px to spare,
    // and 50 at 320px. A bare glyph asks the reader to guess; the word does not.
    playBtn.innerHTML = narrowTabs.matches
      ? '<span class="btn-play-ico">&#9654;</span> Play'
      : '<span class="btn-play-ico">&#9654;</span> Play a Show';
    playBtn.setAttribute('aria-label', 'Play a Show');
    playBtn.title = 'Play a Show';
    playBtn.classList.toggle('active', activeTab === 'Play a Show' && !menuMode);
    tabBar.appendChild(playBtn);

    subBar.innerHTML = '';
    subBar.style.display = activeTab === 'Data' ? '' : 'none';
    if (activeTab === 'Data') {
      for (const name of DATA_TABS) {
        const b = el('button', 'subtab' + (name === activeDataTab ? ' active' : ''), esc(name));
        b.addEventListener('click', () => { activeDataTab = name; renderTabs(); });
        subBar.appendChild(b);
      }
    }

    for (const s of sections) {
      s.style.display = s.dataset.games
        ? (showingGames ? '' : 'none')
        : s.dataset.play
          ? (activeTab === 'Play a Show' && !menuMode ? '' : 'none')
          : (activeTab === 'Data' && s.dataset.section === activeDataTab ? '' : 'none');
    }
    // Only steer the predictor when a game tab is what selected it — otherwise opening
    // History from the menu would immediately be overwritten by the tab it left behind.
    if (game && !menuMode && predictor) predictor.setMode(game.mode);
  }
  renderTabs();
  // Rotating a phone crosses the breakpoint without a reload, and the labels are baked in
  // at render time rather than by CSS, so the row has to be rebuilt when it changes.
  narrowTabs.addEventListener('change', renderTabs);

  // The menu's way into Data. The account menu is its own IIFE and closed over its own
  // state, so this is the one handle the dashboard offers it. Scrolls to the tab bar, not
  // the content: the sub-tab pills are the map of where you just arrived, and landing below
  // them strands a phone reader in the middle of a card with no way of knowing which one.
  window.KalphishiGoData = subtab => {
    activeTab = 'Data';
    if (subtab && DATA_TABS.includes(subtab)) activeDataTab = subtab;
    menuMode = null;
    renderTabs();
    tabBar.scrollIntoView({ block: 'start', behavior: 'smooth' });
  };

  // Clicking a card's own <h2> collapses it. Delegated rather than bound directly,
  // because the predictor card rebuilds its heading on every render — a listener
  // attached to the original element would be discarded on the first re-render.
  // The .collapsed class lives on the card, which survives, so the state does too.
  function makeCollapsible(card) {
    card.classList.add('collapsible');

    const mark = () => {
      const h = [...card.children].find(n => n.tagName === 'H2');
      if (!h || h.dataset.collapseReady) return;
      h.dataset.collapseReady = '1';
      h.setAttribute('role', 'button');
      h.setAttribute('tabindex', '0');
      h.setAttribute('aria-expanded', String(!card.classList.contains('collapsed')));
    };
    mark();
    // Re-mark after the predictor replaces its own heading.
    new MutationObserver(mark).observe(card, { childList: true });

    const toggle = h => {
      card.classList.toggle('collapsed');
      h.setAttribute('aria-expanded', String(!card.classList.contains('collapsed')));
    };
    // Only the card's OWN heading toggles — headings inside nested content (the track
    // record's set labels, say) must not collapse the whole card.
    const ownHeading = target => {
      const h = target.closest && target.closest('h2');
      return h && h.parentElement === card ? h : null;
    };
    card.addEventListener('click', ev => {
      const h = ownHeading(ev.target);
      if (h) toggle(h);
    });
    card.addEventListener('keydown', ev => {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      const h = ownHeading(ev.target);
      if (!h) return;
      ev.preventDefault(); // space would scroll the page
      toggle(h);
    });
  }

  // ---- track record: the model's own past predictions, graded
  // Loaded separately from analysis.json because it grows with every show while
  // analysis.json is always only about the next one.
  async function renderTrackRecord(host) {
    host.appendChild(el('h2', null, 'Track record <span class="hint">— how past predictions actually did</span>'));
    const body = el('div');
    host.appendChild(body);
    body.appendChild(el('div', 'hint', 'Loading…'));

    let H;
    try {
      const res = await fetch('/data/history.json');
      if (!res.ok) throw new Error(String(res.status));
      H = await res.json();
    } catch {
      body.innerHTML = '';
      body.appendChild(el('div', 'hint', 'No prediction history available yet.'));
      return;
    }

    const graded = H.shows.filter(s => s.result).sort((a, b) => b.showdate.localeCompare(a.showdate));
    body.innerHTML = '';
    if (!graded.length) {
      body.appendChild(el('div', 'hint',
        'No graded predictions yet — a show is scored once its setlist is posted.'));
      return;
    }

    // headline: lifetime accuracy across every graded show
    const sum = H.summary;
    body.appendChild(el('div', 'tr-summary',
      `<b>${sum.showsGraded}</b> show${sum.showsGraded === 1 ? '' : 's'} graded · ` +
      `mean precision <b>${pct(sum.meanPrecision)}</b> <span class="hint">(of what we predicted, how much played)</span> · ` +
      `mean recall <b>${pct(sum.meanRecall)}</b> <span class="hint">(of what played, how much we called)</span>`));

    const detail = el('div');

    function drawShow(s) {
      detail.innerHTML = '';
      const r = s.result;
      const card = el('div', 'tr-detail');
      card.appendChild(el('div', 'setlabel',
        `${esc(fmtDate(s.showdate))} — ${esc(s.venue)}${s.city ? ', ' + esc(s.city) : ''}`));
      card.appendChild(el('div', 'hint',
        `Predicted using data through ${esc(fmtDate(s.asOf))} — before the show was played.`));

      card.appendChild(el('div', 'tr-metrics',
        `Precision <b>${pct(r.precision)}</b> · Recall <b>${pct(r.recall)}</b> · ` +
        `Correct set placement <b>${r.setPlacementHits.length}/${r.hits.length}</b>` +
        (r.top40Hits != null ? ` · Top-40 coverage <b>${r.top40Hits}/${r.uniqueActualCount}</b>` : '')));

      const lists = el('div', 'grid cols-3');
      for (const [label, items, cls] of [
        [`Hits (${r.hits.length})`, r.hits, 'tr-hit'],
        [`Missed calls (${r.misses.length})`, r.misses, 'tr-miss'],
        [`Surprises (${r.surprises.length})`, r.surprises, 'tr-surprise'],
      ]) {
        const col = el('div');
        col.appendChild(el('div', 'setlabel', label));
        col.appendChild(el('div', 'tr-songs',
          items.length ? items.map(n => `<span class="tr-song ${cls}">${esc(n)}</span>`).join('') : '<span class="hint">none</span>'));
        lists.appendChild(col);
      }
      card.appendChild(lists);

      for (const c of r.slotChecks || []) {
        card.appendChild(el('div', 'tr-slot', `${c.ok ? '✓' : '✗'} <b>${esc(c.check)}</b> — ${esc(c.detail)}`));
      }
      // Hearing the show you were graded against is the natural end of reading the grade.
      // Attached to the show reference itself — see the note at the top of relisten.js for
      // why this belongs here and nowhere near a paid surface.
      if (window.KalphishiListen) window.KalphishiListen.attach(card, s.showdate, fmtDate(s.showdate));
      detail.appendChild(card);
    }

    // search across every archived show: date, venue, or any song named in it
    const search = el('input', 'ta-input tr-search');
    search.placeholder = 'search past predictions — date, venue, or song…';
    const list = el('div', 'tr-list');

    // Arrow navigation steps through whatever the search currently matches, so stepping
    // and filtering agree rather than the arrows walking shows the list isn't showing.
    // `graded` is newest-first, so a lower index is a more recent show.
    let matches = [];
    let idx = 0;
    const nav = el('div', 'tr-nav');
    const prev = el('button', 'tr-nav-btn', '← Newer');
    const next = el('button', 'tr-nav-btn', 'Older →');
    const pos = el('span', 'tr-nav-pos');
    nav.appendChild(prev); nav.appendChild(pos); nav.appendChild(next);

    function showAt(i) {
      if (!matches.length) return;
      idx = Math.max(0, Math.min(i, matches.length - 1));
      drawShow(matches[idx]);
      [...list.querySelectorAll('.tr-row')].forEach((n, j) => n.classList.toggle('active', j === idx));
      prev.disabled = idx === 0;
      next.disabled = idx === matches.length - 1;
      pos.textContent = `${idx + 1} of ${matches.length}`;
      // Keep the highlighted row visible when arrowing past the end of the viewport.
      list.querySelectorAll('.tr-row')[idx]?.scrollIntoView({ block: 'nearest' });
    }
    prev.addEventListener('click', () => showAt(idx - 1));
    next.addEventListener('click', () => showAt(idx + 1));

    function drawList() {
      const q = search.value.trim().toLowerCase();
      list.innerHTML = '';
      matches = graded.filter(s => {
        if (!q) return true;
        const hay = [
          s.showdate, s.venue, s.city,
          ...s.predicted.set1, ...s.predicted.set2, ...s.predicted.encore,
          ...(s.result.hits || []), ...(s.result.surprises || []),
        ].join(' ').toLowerCase();
        return hay.includes(q);
      });
      if (!matches.length) {
        list.appendChild(el('div', 'hint', 'No past predictions match that.'));
        nav.style.display = 'none';
        detail.innerHTML = '';
        return;
      }
      nav.style.display = matches.length > 1 ? '' : 'none';
      matches.forEach((s, i) => {
        const row = el('button', 'tr-row',
          `<b>${esc(fmtDate(s.showdate))}</b> <span class="hint">${esc(s.venue)}</span> ` +
          `<span class="tr-row-metrics">P ${pct(s.result.precision)} · R ${pct(s.result.recall)} · ` +
          `${s.result.hits.length} hit${s.result.hits.length === 1 ? '' : 's'}</span>`);
        row.addEventListener('click', () => showAt(i));
        list.appendChild(row);
      });
      showAt(0); // most recent match, so the panel is never empty
    }
    search.addEventListener('input', drawList);

    body.appendChild(search);
    body.appendChild(list);
    body.appendChild(nav);
    body.appendChild(detail);
    drawList(); // opens the most recent graded show by default
  }

  function num(v) { return v == null ? '—' : v; }
  function pct(v) { return v == null ? '—' : Math.round(v * 100) + '%'; }
  function tableOf(headers, rowsData, numCols = []) {
    const t = el('table');
    const tr = el('tr');
    headers.forEach((hh, i) => tr.appendChild(el('th', numCols.includes(i) ? 'num' : null, hh)));
    t.appendChild(tr);

    // per-column filter row: substring match, or >n <n >=n <=n =n on numeric-ish cells; plus sort toggles
    const ftr = el('tr', 'filter-row');
    const filters = [];
    const sortBtns = [];
    let sortState = { col: null, dir: 1 };
    headers.forEach((hh, i) => {
      const th = el('th');
      const wrap = el('div', 'th-controls');
      const inp = el('input', 'th-filter');
      inp.placeholder = '⌕';
      inp.addEventListener('input', apply);
      filters.push(inp);
      wrap.appendChild(inp);
      const btn = el('button', 'th-sort', '↕');
      btn.title = 'sort ' + (numCols.includes(i) ? 'numerically' : 'alphabetically');
      btn.addEventListener('click', () => {
        if (sortState.col === i) sortState.dir = -sortState.dir;
        else sortState = { col: i, dir: 1 };
        sortBtns.forEach(b => { b.textContent = '↕'; b.classList.remove('active'); });
        btn.textContent = sortState.dir === 1 ? '↑' : '↓';
        btn.classList.add('active');
        applySort();
      });
      sortBtns.push(btn);
      wrap.appendChild(btn);
      th.appendChild(wrap);
      ftr.appendChild(th);
    });
    t.appendChild(ftr);

    function applySort() {
      const i = sortState.col;
      if (i == null) return;
      const isNum = numCols.includes(i);
      const sorted = [...bodyRows].sort((a, b) => {
        const ta = a.children[i].textContent.trim();
        const tb = b.children[i].textContent.trim();
        if (isNum) {
          const na = parseFloat(ta.replace(/[^0-9.\-]/g, ''));
          const nb = parseFloat(tb.replace(/[^0-9.\-]/g, ''));
          if (isNaN(na) && isNaN(nb)) return 0;
          if (isNaN(na)) return 1;  // blanks/— always sink to the bottom
          if (isNaN(nb)) return -1;
          return sortState.dir * (na - nb);
        }
        return sortState.dir * ta.localeCompare(tb, undefined, { numeric: true, sensitivity: 'base' });
      });
      for (const r of sorted) t.appendChild(r);
    }

    const bodyRows = [];
    for (const r of rowsData) {
      const row = el('tr');
      r.forEach((cell, i) => row.appendChild(el('td', numCols.includes(i) ? 'num' : null, cell)));
      bodyRows.push(row);
      t.appendChild(row);
    }

    function apply() {
      for (const row of bodyRows) {
        let show = true;
        filters.forEach((f, i) => {
          if (!show) return;
          const v = f.value.trim().toLowerCase();
          if (!v) return;
          const text = row.children[i].textContent.toLowerCase();
          const cmp = v.match(/^(>=|<=|>|<|=)\s*(-?\d+\.?\d*)$/);
          if (cmp) {
            const cellNum = parseFloat(text.replace(/[^0-9.\-]/g, ''));
            if (isNaN(cellNum)) { show = false; return; }
            const n = parseFloat(cmp[2]);
            show = cmp[1] === '>' ? cellNum > n : cmp[1] === '<' ? cellNum < n :
                   cmp[1] === '>=' ? cellNum >= n : cmp[1] === '<=' ? cellNum <= n : cellNum === n;
          } else {
            show = text.includes(v);
          }
        });
        row.style.display = show ? '' : 'none';
      }
    }
    return t;
  }
}).catch(err => {
  // Everything on the Data side hangs off this one fetch, and until now the chain had no
  // catch at all: a dropped request or a truncated body on a phone left the whole page
  // rendering nothing, with the reason visible only in a console nobody on a phone can open.
  // A blank page reads as "the site is broken" and gets reported as that, if at all.
  console.error('analysis.json failed to load', err);
  const app = document.getElementById('app');
  if (!app) return;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<h2>The data did not load</h2>'
    + '<div class="hint">A reload usually fixes it. Your saved cards are safe on the server.</div>';
  app.appendChild(card);
});
</script>
</body>
</html>
