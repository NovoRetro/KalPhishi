<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalphishi — Phish Setlist Predictor</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
    --accent-wash: rgba(42,120,214,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
      --accent-wash: rgba(57,135,229,0.15);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.5; padding: 24px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  header .sub { color: var(--ink-2); margin-top: 2px; }
  .tabs { display: flex; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--grid); flex-wrap: wrap; }
  .tab { background: none; border: none; font: inherit; color: var(--ink-2); padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--ink); background: var(--accent-wash); border-radius: 6px 6px 0 0; }
  .tab.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--series-1); }
  .pill { display: inline-block; padding: 1px 8px; border: 1px solid var(--border); border-radius: 99px; font-size: 12px; color: var(--ink-2); background: var(--surface); margin-left: 6px; }
  .grid { display: grid; gap: 16px; margin-top: 20px; }
  .cols-2 { grid-template-columns: 1fr 1fr; }
  .cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 900px) { .cols-2, .cols-3 { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; overflow-x: auto; }
  .card.card-overflow { overflow: visible; }
  .card h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin-bottom: 10px; }
  .card h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 500; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--grid); }
  td { padding: 4px 10px 4px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .filter-row th { padding: 3px 10px 5px 0; }
  .th-controls { display: flex; gap: 3px; align-items: center; }
  .th-sort { background: none; border: 1px solid var(--grid); border-radius: 6px; color: var(--muted); cursor: pointer; font: inherit; font-size: 11px; padding: 1px 5px; flex-shrink: 0; }
  .th-sort:hover { color: var(--ink); }
  .th-sort.active { color: var(--series-1); border-color: var(--series-1); }
  .th-filter { width: 100%; min-width: 44px; box-sizing: border-box; font: inherit; font-size: 11px; padding: 2px 6px; border: 1px solid var(--grid); border-radius: 6px; background: var(--surface); color: var(--ink); }
  .th-filter:focus { outline: none; border-color: var(--series-1); }
  .th-filter::placeholder { color: var(--muted); }
  tr:hover td { background: var(--accent-wash); }
  .song { font-weight: 500; }
  .setlist { display: flex; flex-wrap: wrap; gap: 4px 0; align-items: baseline; }
  .setlist .s { padding: 2px 6px; border-radius: 6px; cursor: default; position: relative; }
  .setlist .s:hover { background: var(--accent-wash); }
  .setlist .t { color: var(--muted); padding: 0 2px; }
  .setlabel { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 10px 0 4px; }
  .marquee { border-left: 3px solid var(--series-1); }
  .why { color: var(--muted); font-size: 12px; }
  .venue-show { margin-bottom: 14px; }
  .venue-show .date { font-weight: 600; }
  .venue-show .tour { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .overlap { text-decoration: underline; text-decoration-color: var(--series-2); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 8px; }
  .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
  .bar .fill { width: 100%; max-width: 42px; background: var(--series-1); border-radius: 4px 4px 0 0; min-height: 2px; }
  /* Axis labels fill their whole slot and use tabular figures, so every tick occupies an
     identical box and the digits line up in a column. Left to shrink-wrap, a label sat at
     its own text width inside an equal-width bar — "Jul 7" measured 21.8px against 27.7px
     for "Jul 22" — and the short ones read as inset next to their neighbours. */
  .bar .x { font-size: 11px; color: var(--muted); width: 100%; text-align: center; font-variant-numeric: tabular-nums; }
  .bar .v { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .legend-note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .score { color: var(--series-1); font-weight: 600; font-variant-numeric: tabular-nums; }
  .sharebar { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .sharebar i { display: inline-block; height: 8px; background: var(--series-1); border-radius: 4px; }
  #tooltip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; max-width: 300px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); display: none; z-index: 10; }
  #tooltip .tt-name { font-weight: 600; margin-bottom: 2px; }
  #tooltip .tt-why { color: var(--ink-2); }
  /* predictor */
  .p-login, .p-topbar { margin-bottom: 12px; }
  .p-login { max-width: 420px; } /* full width on any phone; capped so it doesn't stretch edge-to-edge on wide desktop */
  .p-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .p-topbar { display: flex; flex-direction: column; gap: 8px; }
  /* Sign in / create account: always a stacked column, not just below some breakpoint —
     a row of 3-4 inputs plus a button never fit a phone width, and stacked reads fine
     on desktop too. font-size 16px stops iOS Safari's zoom-on-focus. */
  .p-login .p-row { flex-direction: column; align-items: stretch; }
  .p-login .ta-input { max-width: none; font-size: 16px; }
  .p-login .p-btn { width: 100%; }
  .p-login .p-modes { margin-bottom: 4px; }
  .p-modes { display: flex; gap: 6px; flex-wrap: wrap; }
  .p-mode { background: var(--surface); border: 1px solid var(--border); border-radius: 99px; color: var(--ink-2); font: inherit; font-size: 13px; padding: 4px 12px; cursor: pointer; }
  .p-mode.active { color: var(--ink); border-color: var(--series-1); font-weight: 600; }
  .p-btn { background: var(--series-1); color: #fff; border: none; border-radius: 8px; font: inherit; font-weight: 600; padding: 8px 16px; cursor: pointer; margin-top: 10px; }
  .ta-wrap { position: relative; margin-top: 6px; }
  .ta-input { width: 100%; max-width: 280px; font: inherit; padding: 6px 10px; border: 1px solid var(--baseline); border-radius: 8px; background: var(--surface); color: var(--ink); }
  .p-date { max-width: 130px; margin: 0 6px; }
  .ta-list { position: absolute; top: 100%; left: 0; z-index: 5; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; min-width: 280px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
  .ta-item { padding: 6px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  .ta-item.sel, .ta-item:hover { background: var(--accent-wash); }
  .ta-plays { color: var(--muted); font-size: 12px; }
  .p-sets { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .p-sets { grid-template-columns: 1fr; } }
  .p-songrow { display: flex; align-items: center; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--grid); }
  .p-songmain { display: flex; flex-direction: column; gap: 1px; }
  .p-songmeta { color: var(--muted); font-size: 11px; }
  .p-bust { font-size: 9px; font-weight: 700; letter-spacing: 0.05em; border-radius: 4px; padding: 1px 4px; color: #fff; vertical-align: 1px; }
  .p-bust.minor { background: var(--series-3); }
  .p-bust.major { background: var(--series-2); }
  .p-bust.mega { background: #e34948; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .p-bust.mega { background: #e66767; } }
  /* touch-action: none so a drag on the handle doesn't scroll the page instead. */
  .p-drag { cursor: grab; color: var(--muted); user-select: none; font-size: 11px; letter-spacing: -1px; padding: 0 2px; touch-action: none; }
  .p-drag:hover { color: var(--ink); }
  .p-songrow.dragging { opacity: 0.45; }
  .p-songrow.drop-above { box-shadow: 0 -2px 0 var(--series-1); }
  .p-songrow.drop-below { box-shadow: 0 2px 0 var(--series-1); }
  .p-stress { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: var(--series-2); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
  .p-x { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; margin-left: auto; }
  .p-x:hover { color: var(--ink); }
  .p-grid { display: grid; grid-template-columns: 28px repeat(5, minmax(90px, 130px)); gap: 4px; margin-top: 12px; }
  .p-head, .p-corner { display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--ink-2); }
  .p-cell { position: relative; aspect-ratio: 1; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4px; font-size: 12px; line-height: 1.25; cursor: pointer; }
  .p-cell.empty { color: var(--muted); border-style: dashed; }
  .p-cell.empty:hover, .p-cell.filled:hover { background: var(--accent-wash); }
  /* The donut is the whole square now, so it scales up to fill it rather than sitting at
     caption size above a label. line-height 1 keeps the glyph centred in the cell. */
  .p-cell.free { font-size: 54px; line-height: 1; cursor: default; }
  .p-cell.checked { background: var(--accent-wash); border-color: var(--series-1); box-shadow: inset 0 0 0 2px var(--series-1); }
  .p-cell .p-x { position: absolute; top: 0; right: 2px; }
  .p-cell .p-lock { position: absolute; top: 1px; left: 3px; background: none; border: none; cursor: pointer; font-size: 11px; opacity: 0.35; padding: 1px; }
  .p-cell .p-lock:hover { opacity: 1; }
  .p-cell.locked .p-lock { opacity: 1; }
  .p-cell.locked { border-color: var(--series-2); box-shadow: inset 0 0 0 1px var(--series-2); }
  /* Scoring rules panel. Width-bounded so the tables stay scannable on a wide screen —
     a full-bleed two-column table reads as two unrelated lists. */
  .p-help { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); max-width: 620px; }
  .p-help table { margin: 2px 0 10px; }
  .p-help td { font-size: 13px; }
  /* Deliberately NOT nowrap: the longest value ("1 each, max 10") held a fixed column on
     a phone and squeezed its description into six wrapped lines. Letting the value wrap
     instead costs one line and keeps the rows readable. */
  .p-help td.num { padding-left: 12px; }
  .p-help .setlabel { margin-top: 6px; }
  .p-help .setlabel:first-child { margin-top: 0; }
  .p-help-note { font-size: 12px; color: var(--muted); line-height: 1.45; margin: -4px 0 12px; }
  .p-help-note:last-child { margin-bottom: 0; }
  .p-lock { font-size: 12px; margin-top: 8px; padding: 6px 10px; border-radius: 6px; background: var(--accent-wash); border: 1px solid var(--border); }
  .p-lock.p-locked { border-color: var(--series-2); color: var(--ink); }
  .p-cap { font-size: 11px; color: var(--muted); text-align: right; padding: 4px 2px 0; }
  .p-cap-over { color: var(--series-2); font-weight: 600; }
  .p-btn-alt { background: var(--surface); color: var(--ink); border: 1px solid var(--baseline); font-weight: 500; }
  .p-cellname { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  /* Phones: let the 5 bingo columns divide the available width instead of holding a
     90px floor, which forced ~498px of sideways scrolling on a 375px screen. Must come
     after the base .p-grid/.p-cell rules — same specificity, so source order decides.
     Also enlarges the drag handle, which is a finger target here rather than a cursor one. */
  @media (max-width: 560px) {
    .p-grid { grid-template-columns: 16px repeat(5, minmax(0, 1fr)); gap: 3px; }
    .p-cell { font-size: 9.5px; padding: 2px; border-radius: 6px; line-height: 1.15; }
    .p-cell.free { font-size: 32px; }
    .p-cellname { -webkit-line-clamp: 4; }
    /* Full opacity, not the desktop hover-reveal design: touch has no hover to reveal
       these with, so the faint default was effectively invisible. p-x had no mobile
       override at all before this — stuck at its 14px desktop size in a ~52px cell. */
    .p-cell .p-lock { font-size: 14px; opacity: 0.85; padding: 3px; }
    .p-cell .p-x { font-size: 15px; opacity: 0.85; padding: 3px; line-height: 1; }
    .p-head, .p-corner { font-size: 11px; }
    .p-drag { font-size: 15px; padding: 6px 8px; }
    .p-songrow { padding: 5px 0; }
  }
  .p-bingo-banner { margin: 12px 0; padding: 12px; border: 2px solid var(--series-2); border-radius: 10px; text-align: center; font-size: 16px; }
  .p-histrow { padding: 5px 0; border-bottom: 1px solid var(--grid); }
  .p-flash { margin-top: 8px; color: var(--series-3); font-weight: 600; }
  .p-flash.err { color: var(--series-2); }
  .p-picker { margin-top: 10px; }
  .vs-controls { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
  .vs-panel { max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin: 6px 0; columns: 4; }
  @media (max-width: 900px) { .vs-panel { columns: 2; } }
  .vs-panel label { display: block; font-size: 12px; padding: 2px 0; break-inside: avoid; cursor: pointer; }
  .p-avatar { font-size: 15px; }
  .p-field { display: inline-block; margin: 6px 14px 6px 0; font-size: 12px; color: var(--ink-2); }
  .p-bio { display: block; min-width: 280px; min-height: 60px; resize: vertical; font: inherit; }
  .p-profilecard { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .p-boardrow { cursor: pointer; }
  .p-boardrow:hover { background: var(--accent-wash); }
  /* ---- attendance ---- */
  .p-attend { align-self: flex-start; background: var(--surface); color: var(--ink-2); border: 1px solid var(--border);
    border-radius: 99px; font: inherit; font-size: 12px; padding: 7px 14px; min-height: 36px; cursor: pointer; }
  .p-attend:hover { background: var(--accent-wash); }
  .p-attend.on { color: var(--ink); border-color: var(--series-1); font-weight: 600; box-shadow: inset 0 0 0 1px var(--series-1); }
  .p-attend:disabled { opacity: 0.6; cursor: default; }
  .p-there { font-size: 11px; color: var(--series-1); margin-left: 6px; }
  .p-attsummary { font-size: 13px; margin-bottom: 8px; }
  @media (max-width: 560px) { .p-attend { min-height: 44px; font-size: 13px; } }

  /* ---- track record (past predictions, graded) ---- */
  .tr-summary { margin: 6px 0 12px; font-size: 13px; }
  .tr-list { max-height: 190px; overflow-y: auto; margin: 8px 0; border: 1px solid var(--border); border-radius: 8px; }
  .tr-row { display: block; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--grid);
    color: var(--ink); font: inherit; font-size: 12px; padding: 8px 10px; min-height: 44px; cursor: pointer; }
  .tr-row:last-child { border-bottom: none; }
  .tr-row:hover { background: var(--accent-wash); }
  .tr-row.active { background: var(--accent-wash); box-shadow: inset 3px 0 0 var(--series-1); }
  .tr-row-metrics { color: var(--muted); }
  .tr-detail { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  .tr-metrics { font-size: 13px; margin: 8px 0 10px; }
  .tr-songs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .tr-song { font-size: 11px; padding: 2px 7px; border-radius: 99px; border: 1px solid currentColor; }
  .tr-hit { color: var(--series-1); }
  .tr-miss { color: var(--muted); }
  .tr-surprise { color: var(--series-2); }
  .tr-slot { font-size: 12px; color: var(--ink-2); padding: 2px 0; }
  .tr-nav { display: flex; align-items: center; gap: 10px; margin: 8px 0 2px; }
  .tr-nav-btn { background: var(--surface); border: 1px solid var(--baseline); border-radius: 99px;
    color: var(--ink); font: inherit; font-size: 12px; padding: 6px 14px; min-height: 36px; cursor: pointer; }
  .tr-nav-btn:hover:not(:disabled) { background: var(--accent-wash); }
  .tr-nav-btn:disabled { opacity: 0.4; cursor: default; }
  .tr-nav-pos { font-size: 12px; color: var(--muted); }

  /* ---- collapsible cards ---- */
  .collapsible > h2 { cursor: pointer; user-select: none; }
  .collapsible > h2::before { content: '▾'; display: inline-block; width: 1em; color: var(--muted); font-size: 11px; }
  .collapsible.collapsed > h2::before { content: '▸'; }
  .collapsible.collapsed > *:not(h2) { display: none; }

  /* Phones: the 3-up hit/miss/surprise columns stack, and the show list gets more room
     since it is the primary way to move between shows on a small screen. Must follow the
     base rules above — same specificity, so source order decides. */
  @media (max-width: 560px) {
    .tr-detail .cols-3 { grid-template-columns: 1fr; }
    .tr-list { max-height: 240px; }
    .tr-row { font-size: 12px; }
    /* 16px stops iOS Safari zooming the page when the field takes focus. */
    .tr-search { font-size: 16px; }
    .tr-nav-btn { min-height: 44px; font-size: 13px; }
  }
  .footer { margin-top: 28px; padding: 14px 0 6px; border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; text-align: center; }
  .footer .nr { font-weight: 700; color: var(--ink-2); letter-spacing: 0.02em; }

  /* ---- account menu (hamburger, upper right) ---- */
  /* Align with the right edge of the centered 1180px content column (the wrap's edge is
     (100vw - 1180px)/2 from the viewport once body padding cancels out); never closer
     than 12px to the viewport edge on narrow screens. */
  .menu-btn { position: fixed; top: 10px; right: max(12px, calc((100vw - 1180px) / 2)); z-index: 60; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1;
    background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 10px;
    cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
  .menu-btn:hover { background: var(--accent-wash); }
  .menu-backdrop { position: fixed; inset: 0; z-index: 58; background: rgba(0,0,0,0.35); display: none; }
  .menu-panel { position: fixed; top: 60px; right: max(12px, calc((100vw - 1180px) / 2)); z-index: 59; min-width: 260px; max-width: 92vw;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25); display: none; }
  .menu-open .menu-panel, .menu-open .menu-backdrop { display: block; }
  .menu-id { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; border-bottom: 1px solid var(--grid); margin-bottom: 8px; }
  .menu-id .p-avatar { font-size: 20px; }
  .menu-stats { color: var(--muted); font-size: 11px; }
  .menu-item { display: block; width: 100%; text-align: left; padding: 10px 8px; min-height: 44px;
    background: none; border: none; border-radius: 8px; color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
  .menu-item:hover { background: var(--accent-wash); }
  .menu-item.danger { color: var(--series-2); }
  .menu-form { padding: 8px 6px; display: flex; flex-direction: column; gap: 8px; }
  .menu-form .ta-input { max-width: none; }
  .menu-note { font-size: 11px; color: var(--muted); padding: 0 6px; }
  .friend-row, .invite-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 7px 6px; border-bottom: 1px solid var(--grid); font-size: 12px; }
  .friend-row > span:first-child { flex: 1; }
  .friend-remove { background: none; border: 1px solid var(--border); border-radius: 99px; color: var(--series-2);
    font: inherit; font-size: 11px; padding: 4px 10px; min-height: 32px; cursor: pointer; }
  .friend-remove:hover { background: var(--accent-wash); }
  .friend-remove:disabled { opacity: 0.5; cursor: default; }
  .invite-copy { flex: 1; background: var(--surface); border: 1px solid var(--baseline); border-radius: 8px;
    color: var(--ink); font: inherit; font-size: 12px; padding: 6px 10px; min-height: 32px; cursor: pointer; }
  .invite-copy:hover { background: var(--accent-wash); }
  @media (max-width: 560px) {
    .friend-remove, .invite-copy { min-height: 44px; font-size: 13px; }
  }
  /* Phones: right-hand drawer instead of a dropdown. Must follow the base .menu-panel
     rule — same specificity, so source order decides which wins. */
  @media (max-width: 560px) {
    .menu-panel { top: 0; right: 0; bottom: 0; border-radius: 12px 0 0 12px; width: 82vw; max-width: 320px;
      overflow-y: auto; padding-top: 64px; }
  }

  /* ---- sign in / create account modal ---- */
  /* Higher than the account menu (58-60) so the two never fight for a layer, even
     though in practice only one is ever open (the menu closes itself before opening this). */
  .auth-modal-backdrop { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center; padding: 16px; }
  .auth-modal-backdrop.open { display: flex; }
  /* The content is the existing .p-login.card box; just bound its height on short viewports. */
  .auth-modal-backdrop > .p-login { max-height: 90vh; overflow-y: auto; margin-bottom: 0; }
</style>
</head>
<body>
<button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu-panel" aria-label="Account menu">☰</button>
<div class="menu-backdrop" id="menu-backdrop"></div>
<div class="menu-panel" id="menu-panel" role="menu" aria-label="Account"></div>
<div class="auth-modal-backdrop" id="auth-modal-backdrop" role="dialog" aria-modal="true" aria-label="Sign in"></div>
<div class="wrap">
  <header>
    <h1>Kalphishi <span class="pill" id="asof"></span></h1>
    <div class="sub" id="nextshow"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="grid" id="app"></div>
  <footer class="footer">Powered by <span class="nr">NovoRetro</span></footer>
</div>
<div id="tooltip"></div>
<script src="/web/reorder.js"></script>
<script src="/web/predictor.js"></script>
<script>
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Show dates are stored and compared as ISO (YYYY-MM-DD) everywhere — sorting, object
// keys, API params and search all depend on that — so this is display-only. Parsed from
// the parts rather than `new Date('2026-09-04')`, which JS reads as UTC midnight and then
// renders as the previous day for anyone west of Greenwich.
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'];
function fmtDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso ?? ''));
  if (!m) return String(iso ?? ''); // not a plain date — leave it untouched
  return `${MONTHS[+m[2] - 1]} ${+m[3]}, ${m[1]}`;
}
// Compact variant for dense rows, where the full form will not fit.
function fmtDateShort(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso ?? ''));
  if (!m) return String(iso ?? '');
  return `${MONTHS[+m[2] - 1].slice(0, 3)} ${+m[3]}`;
}
// Chart ticks only: the zero-padded day, nothing else.
//
// Repeating the month on every tick cost most of the slot and could never line up — the
// day alone varies in width ("Jul 7" measured 21.8px against 27.7px for "Jul 22"), and
// padding the day only moved the problem to the month, since "Aug" is wider than "Jul"
// in any proportional face. Two tabular digits are identical for every date there is, and
// the month belongs to the axis as a whole rather than to each tick, so it is stated once
// under the chart. The full date is on hover.
function fmtAxisDay(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso ?? ''));
  if (!m) return String(iso ?? '');
  return m[3];
}
// "Jul 7 – Aug 1, 2026" for a run that crosses a month, "Jul 7 – 31, 2026" for one inside
// it. Carries the context the ticks no longer repeat.
function fmtDateSpan(firstIso, lastIso) {
  const a = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(firstIso ?? ''));
  const b = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(lastIso ?? ''));
  if (!a || !b) return '';
  const mon = m => MONTHS[+m[2] - 1].slice(0, 3);
  const head = `${mon(a)} ${+a[3]}`;
  const tail = a[1] === b[1] && a[2] === b[2] ? `${+b[3]}` : `${mon(b)} ${+b[3]}`;
  return `${head} – ${tail}, ${b[1]}`;
}
window.fmtDate = fmtDate; // predictor.js renders dates too

// ---- account menu ----
// Shell + open/close semantics live here; predictor.js pushes state into it via
// window.KalphishiMenu.update(user, actions) on every render.
(function () {
  const btn = document.getElementById('menu-btn');
  const panel = document.getElementById('menu-panel');
  const backdrop = document.getElementById('menu-backdrop');
  let state = { user: null, actions: null };
  let lastFocus = null;

  const isOpen = () => document.body.classList.contains('menu-open');
  function open() {
    lastFocus = document.activeElement;
    document.body.classList.add('menu-open');
    btn.setAttribute('aria-expanded', 'true');
    drawContent();
    const first = panel.querySelector('button, input');
    if (first) first.focus();
  }
  function close() {
    document.body.classList.remove('menu-open');
    btn.setAttribute('aria-expanded', 'false');
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); else btn.focus();
  }
  btn.addEventListener('click', () => (isOpen() ? close() : open()));
  backdrop.addEventListener('click', close);
  document.addEventListener('keydown', ev => {
    if (!isOpen()) return;
    if (ev.key === 'Escape') { close(); return; }
    if (ev.key === 'Tab') {
      // keep focus inside the panel while it is open
      const focusables = [...panel.querySelectorAll('button, input')].filter(n => !n.disabled);
      if (!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (ev.shiftKey && document.activeElement === first) { last.focus(); ev.preventDefault(); }
      else if (!ev.shiftKey && document.activeElement === last) { first.focus(); ev.preventDefault(); }
    }
  });

  const mfetch = (path, method, body) =>
    fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(r => r.json().then(j => { if (!r.ok) throw new Error(j.error || r.status); return j; }));

  const item = (label, onClick, cls) => {
    const b = el('button', 'menu-item' + (cls ? ' ' + cls : ''), label);
    b.setAttribute('role', 'menuitem');
    b.addEventListener('click', onClick);
    return b;
  };

  function drawContent(view) {
    panel.innerHTML = '';
    const { user, actions } = state;

    if (!user) {
      panel.appendChild(el('div', 'menu-note', 'Not signed in.'));
      panel.appendChild(item('Sign in', () => { close(); actions?.openLogin('login'); }));
      panel.appendChild(item('Create account', () => { close(); actions?.openLogin('register'); }));
      return;
    }

    const s = user.stats || {};
    const id = el('div', 'menu-id',
      `<span class="p-avatar">${esc((user.profile && user.profile.avatar) || '🎣')}</span>` +
      `<span><b>${esc((user.profile && user.profile.displayName) || user.name)}</b> <span class="menu-stats">@${esc(user.handle)}</span><br>` +
      `<span class="menu-stats">${s.predictions ?? 0} predictions · ${s.scored ?? 0} scored` +
      // Setlist points and bingo scores are separate scales and are never merged.
      `${s.setlistPoints != null ? ' · ' + s.setlistPoints + ' pts' : ''}` +
      `${s.bingoScore != null ? ' · bingo ' + s.bingoScore : ''}` +
      `${s.bingos ? ' · ' + s.bingos + ' 🍩' : ''}</span></span>`);
    panel.appendChild(id);

    if (view === 'password') {
      const form = el('div', 'menu-form');
      const cur = el('input', 'ta-input'); cur.type = 'password'; cur.placeholder = 'current password'; cur.autocomplete = 'current-password';
      const nw = el('input', 'ta-input'); nw.type = 'password'; nw.placeholder = 'new password (6+ chars for now)'; nw.autocomplete = 'new-password';
      const msg = el('div', 'menu-note');
      const save = el('button', 'p-btn', 'Change password');
      save.addEventListener('click', async () => {
        msg.textContent = '';
        try {
          await mfetch('/api/password', 'PUT', { currentPassword: cur.value, newPassword: nw.value });
          msg.textContent = 'Password changed. Other devices were signed out.';
          cur.value = nw.value = '';
        } catch (e) { msg.textContent = e.message; }
      });
      form.appendChild(cur); form.appendChild(nw); form.appendChild(save); form.appendChild(msg);
      panel.appendChild(form);
      panel.appendChild(item('← Back', () => drawContent()));
      return;
    }

    if (view === 'friends') {
      const wrap = el('div', 'menu-form');
      const msg = el('div', 'menu-note');
      const listHost = el('div');
      const inviteHost = el('div');

      async function drawFriends() {
        listHost.innerHTML = '';
        let friends = [];
        try { friends = (await mfetch('/api/friends', 'GET')).friends; }
        catch (e) { listHost.appendChild(el('div', 'menu-note', e.message)); return; }
        if (!friends.length) {
          listHost.appendChild(el('div', 'menu-note', 'No friends yet — share an invite link below.'));
          return;
        }
        for (const f of friends) {
          const row = el('div', 'friend-row',
            `<span><span class="p-avatar">${esc(f.profile.avatar || '🎣')}</span> <b>${esc(f.name)}</b> ` +
            `<span class="menu-stats">@${esc(f.handle)}</span></span>`);
          const rm = el('button', 'friend-remove', 'Remove');
          rm.title = `Remove ${f.name} — this also removes you from their list`;
          rm.addEventListener('click', async () => {
            rm.disabled = true;
            try {
              await mfetch('/api/friends/' + encodeURIComponent(f.handle), 'DELETE');
              // Unfriending also drops them from your groups server-side, so member
              // counts here would otherwise show stale numbers.
              await Promise.all([drawFriends(), drawGroups()]);
            } catch (e) { rm.disabled = false; msg.textContent = e.message; }
          });
          row.appendChild(rm);
          listHost.appendChild(row);
        }
      }

      async function drawInvites() {
        inviteHost.innerHTML = '';
        const make = el('button', 'p-btn', 'Create invite link');
        make.addEventListener('click', async () => {
          make.disabled = true;
          try { await mfetch('/api/invites', 'POST', {}); await drawInvites(); }
          catch (e) { make.disabled = false; msg.textContent = e.message; }
        });
        inviteHost.appendChild(make);

        let invites = [];
        try { invites = (await mfetch('/api/invites', 'GET')).invites; } catch { /* shown below */ }
        const live = invites.filter(i => !i.spent && !i.expired);
        if (!live.length) return;
        inviteHost.appendChild(el('div', 'menu-note', 'Share a link — whoever opens it becomes your friend.'));
        for (const i of live) {
          const url = `${location.origin}/?invite=${i.code}`;
          const row = el('div', 'invite-row');
          const copy = el('button', 'invite-copy', '📋 Copy link');
          copy.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(url);
              copy.textContent = '✓ Copied';
            } catch {
              // Clipboard needs permission/secure context; fall back to selectable text.
              copy.textContent = 'Copy manually →';
              const box = el('input', 'ta-input');
              box.value = url; box.readOnly = true;
              row.appendChild(box); box.select();
            }
            setTimeout(() => { copy.textContent = '📋 Copy link'; }, 1800);
          });
          row.appendChild(copy);
          row.appendChild(el('span', 'menu-stats', ` used ${i.uses}${i.maxUses ? '/' + i.maxUses : ''}`));
          const rev = el('button', 'friend-remove', 'Revoke');
          rev.addEventListener('click', async () => {
            rev.disabled = true;
            try { await mfetch('/api/invites/' + encodeURIComponent(i.code), 'DELETE'); await drawInvites(); }
            catch (e) { rev.disabled = false; msg.textContent = e.message; }
          });
          row.appendChild(rev);
          inviteHost.appendChild(row);
        }
      }

      const groupHost = el('div');

      async function drawGroups() {
        groupHost.innerHTML = '';
        groupHost.appendChild(el('div', 'setlabel', 'Groups'));
        let groups = [], friends = [];
        try {
          [groups, friends] = await Promise.all([
            mfetch('/api/groups', 'GET').then(j => j.groups),
            mfetch('/api/friends', 'GET').then(j => j.friends),
          ]);
        } catch (e) { groupHost.appendChild(el('div', 'menu-note', e.message)); return; }

        if (!groups.length) groupHost.appendChild(el('div', 'menu-note', 'No groups yet.'));
        for (const g of groups) {
          const row = el('div', 'friend-row',
            `<span><b>${esc(g.name)}</b> <span class="menu-stats">${g.memberCount} member${g.memberCount === 1 ? '' : 's'}` +
            `${g.isOwner ? '' : ' · joined'}</span></span>`);
          // Owners manage; everyone else can only leave.
          if (g.isOwner) {
            const add = el('button', 'friend-remove', '＋ Add');
            add.style.color = 'var(--ink-2)';
            add.addEventListener('click', () => drawAddPicker(g, friends));
            row.appendChild(add);
            const del = el('button', 'friend-remove', 'Delete');
            del.addEventListener('click', async () => {
              del.disabled = true;
              try { await mfetch('/api/groups/' + encodeURIComponent(g.id), 'DELETE'); await drawGroups(); }
              catch (e) { del.disabled = false; msg.textContent = e.message; }
            });
            row.appendChild(del);
          } else {
            const leave = el('button', 'friend-remove', 'Leave');
            leave.addEventListener('click', async () => {
              leave.disabled = true;
              try {
                await mfetch(`/api/groups/${encodeURIComponent(g.id)}/members/${encodeURIComponent(user.handle)}`, 'DELETE');
                await drawGroups();
              } catch (e) { leave.disabled = false; msg.textContent = e.message; }
            });
            row.appendChild(leave);
          }
          groupHost.appendChild(row);
        }

        const nameInput = el('input', 'ta-input');
        nameInput.placeholder = 'new group name';
        const create = el('button', 'p-btn', 'Create group');
        const go = async () => {
          const name = nameInput.value.trim();
          if (!name) return;
          create.disabled = true;
          try { await mfetch('/api/groups', 'POST', { name }); nameInput.value = ''; await drawGroups(); }
          catch (e) { msg.textContent = e.message; }
          create.disabled = false;
        };
        create.addEventListener('click', go);
        nameInput.addEventListener('keydown', ev => { if (ev.key === 'Enter') go(); });
        groupHost.appendChild(nameInput);
        groupHost.appendChild(create);
      }

      // Only friends are offered — groups are subsets of your friend list, so there is
      // no free-text handle entry that would bypass the invite flow.
      async function drawAddPicker(g, friends) {
        groupHost.innerHTML = '';
        groupHost.appendChild(el('div', 'setlabel', `Add to ${g.name}`));
        let members = [];
        try { members = (await mfetch(`/api/groups/${encodeURIComponent(g.id)}/members`, 'GET')).members; }
        catch { /* fall through with an empty list */ }
        const inGroup = new Set(members.map(m => m.handle));
        const available = friends.filter(f => !inGroup.has(f.handle));
        if (!available.length) {
          groupHost.appendChild(el('div', 'menu-note', friends.length
            ? 'All your friends are already in this group.'
            : 'Add friends first — share an invite link above.'));
        }
        for (const f of available) {
          const row = el('div', 'friend-row', `<span><b>${esc(f.name)}</b> <span class="menu-stats">@${esc(f.handle)}</span></span>`);
          const add = el('button', 'friend-remove', 'Add');
          add.style.color = 'var(--ink-2)';
          add.addEventListener('click', async () => {
            add.disabled = true;
            try {
              await mfetch(`/api/groups/${encodeURIComponent(g.id)}/members`, 'POST', { handle: f.handle });
              await drawAddPicker(g, friends);
            } catch (e) { add.disabled = false; msg.textContent = e.message; }
          });
          row.appendChild(add);
          groupHost.appendChild(row);
        }
        // Members currently in the group, with removal for the owner.
        if (members.length > 1) {
          groupHost.appendChild(el('div', 'setlabel', 'In this group'));
          for (const mem of members) {
            const row = el('div', 'friend-row',
              `<span><b>${esc(mem.name)}</b> <span class="menu-stats">@${esc(mem.handle)}${mem.isOwner ? ' · owner' : ''}</span></span>`);
            if (!mem.isOwner) {
              const rm = el('button', 'friend-remove', 'Remove');
              rm.addEventListener('click', async () => {
                rm.disabled = true;
                try {
                  await mfetch(`/api/groups/${encodeURIComponent(g.id)}/members/${encodeURIComponent(mem.handle)}`, 'DELETE');
                  await drawAddPicker(g, friends);
                } catch (e) { rm.disabled = false; msg.textContent = e.message; }
              });
              row.appendChild(rm);
            }
            groupHost.appendChild(row);
          }
        }
        const back = el('button', 'p-btn p-btn-alt', '← Back to groups');
        back.addEventListener('click', () => drawGroups());
        groupHost.appendChild(back);
      }

      wrap.appendChild(listHost);
      wrap.appendChild(inviteHost);
      wrap.appendChild(groupHost);
      wrap.appendChild(msg);
      panel.appendChild(wrap);
      panel.appendChild(item('← Back', () => drawContent()));
      drawFriends();
      drawInvites();
      drawGroups();
      return;
    }

    panel.appendChild(item('My History', () => { close(); actions?.goTo('history'); }));
    panel.appendChild(item('Profile', () => { close(); actions?.goTo('profile'); }));
    panel.appendChild(item('Friends', () => drawContent('friends')));
    panel.appendChild(item('Change password', () => drawContent('password')));
    panel.appendChild(item('Sign out', async () => { close(); await actions?.signOut(); }, 'danger'));
  }

  window.KalphishiMenu = {
    update(user, actions) {
      state = { user, actions };
      if (isOpen()) drawContent();
    },
  };
})();

// ---- sign in / create account modal ----
// Pure chrome: predictor.js owns the sign-in/register form and its state (authPrompt);
// this just gives that content a floating home instead of an inline slot in the page
// flow. show()/hide() are the programmatic API predictor.js drives every render from —
// hide() is a no-op if already closed, so calling it unconditionally is safe. Dismissal
// via Esc or backdrop click is chrome-initiated, so it's reported back through the
// dismiss callback rather than assumed — predictor.js's authPrompt is the single source
// of truth for whether the form should be showing.
(function () {
  const backdrop = document.getElementById('auth-modal-backdrop');
  let dismissCb = null;
  let lastFocus = null;

  function isOpen() { return backdrop.classList.contains('open'); }

  function doHide() {
    if (!isOpen()) return;
    backdrop.classList.remove('open');
    backdrop.innerHTML = '';
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); else document.getElementById('menu-btn')?.focus();
  }

  backdrop.addEventListener('click', ev => {
    if (ev.target !== backdrop) return; // only the dimmed area, not the card itself
    doHide();
    dismissCb?.();
  });
  document.addEventListener('keydown', ev => {
    if (!isOpen()) return;
    if (ev.key === 'Escape') { doHide(); dismissCb?.(); return; }
    if (ev.key === 'Tab') {
      const focusables = [...backdrop.querySelectorAll('button, input')].filter(n => !n.disabled);
      if (!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (ev.shiftKey && document.activeElement === first) { last.focus(); ev.preventDefault(); }
      else if (!ev.shiftKey && document.activeElement === last) { first.focus(); ev.preventDefault(); }
    }
  });

  window.KalphishiAuthModal = {
    show(contentNode) {
      if (!isOpen()) lastFocus = document.activeElement;
      backdrop.innerHTML = '';
      backdrop.appendChild(contentNode);
      backdrop.classList.add('open');
      const first = contentNode.querySelector('input') || contentNode.querySelector('button');
      if (first) first.focus();
    },
    hide: doHide,
    onDismiss(cb) { dismissCb = cb; },
  };
})();

const tooltip = document.getElementById('tooltip');

// Mouse tracks on hover; touch has no hover, so a tap toggles the tip and a tap
// anywhere else dismisses it. tipOwner is the node currently showing a tapped tip.
let tipOwner = null;
function showTip(name, why, x, y) {
  tooltip.innerHTML = `<div class="tt-name">${esc(name)}</div><div class="tt-why">${esc(why)}</div>`;
  tooltip.style.display = 'block';
  const w = tooltip.offsetWidth, h = tooltip.offsetHeight;
  // Flip above the finger when there is not room below, and keep it on-screen.
  const top = y + 14 + h > window.innerHeight ? Math.max(8, y - 14 - h) : y + 14;
  tooltip.style.left = Math.max(8, Math.min(x + 14, window.innerWidth - w - 8)) + 'px';
  tooltip.style.top = top + 'px';
}
function hideTip() { tooltip.style.display = 'none'; }

document.addEventListener('pointerup', ev => {
  if (tipOwner && !tipOwner.contains(ev.target)) { hideTip(); tipOwner = null; }
}, true);

function bindTip(node, name, why) {
  node.addEventListener('pointermove', ev => {
    if (ev.pointerType !== 'mouse' || tipOwner) return;
    showTip(name, why, ev.clientX, ev.clientY);
  });
  node.addEventListener('pointerleave', ev => {
    if (ev.pointerType === 'mouse' && !tipOwner) hideTip();
  });
  node.addEventListener('pointerup', ev => {
    if (ev.pointerType === 'mouse') return;
    if (tipOwner === node) { hideTip(); tipOwner = null; }
    else { tipOwner = node; showTip(name, why, ev.clientX, ev.clientY); }
  });
}

fetch('/data/analysis.json').then(r => r.json()).then(A => {
  document.getElementById('asof').textContent = 'data through ' + fmtDate(A.asOf);
  document.getElementById('nextshow').textContent =
    `Next show: ${fmtDate(A.nextShow.date)} — ${A.nextShow.venue}, ${A.nextShow.city} · ` +
    `${A.tour.name}: ${A.tour.shows.length} shows played, ${A.tour.songCount} unique songs · ` +
    `era window ${A.eraWindow.from} → ${A.eraWindow.to} (${A.eraWindow.totalShows} shows)`;

  const app = document.getElementById('app');

  // ---- predicted setlist marquee
  const pred = el('div', 'card marquee');
  pred.appendChild(el('h2', null, `Predicted setlist — ${esc(fmtDate(A.nextShow.date))} ${esc(A.nextShow.venue)} <span class="hint">(hover or tap a song for reasoning)</span>`));
  for (const [label, list] of [['Set 1', A.prediction.set1], ['Set 2', A.prediction.set2], ['Encore', A.prediction.encore]]) {
    pred.appendChild(el('div', 'setlabel', label));
    const row = el('div', 'setlist');
    const albumBySong = new Map((A.albums?.predictionMix || []).map(m => [m.song, m]));
    list.forEach((s, i) => {
      const sp = el('span', 's song', esc(s.name));
      const am = albumBySong.get(s.name);
      const albumNote = am && am.album ? ` · ${am.album} (${am.year})` : '';
      bindTip(sp, `${s.name} — score ${s.score}`, (s.why.join('; ') || 'rotation strength') + albumNote);
      row.appendChild(sp);
      if (i < list.length - 1) row.appendChild(el('span', 't', label === 'Encore' ? ',' : '&gt;'));
    });
    pred.appendChild(row);
  }
  pred.dataset.section = 'Prediction';

  // ---- user predictor
  const up = el('div', 'card card-overflow');
  up.dataset.section = 'Prediction';

  // ---- track record: how past predictions actually did
  const track = el('div', 'card card-overflow');
  track.dataset.section = 'Prediction';

  // Order on the Prediction tab: what you *do* first (build a setlist or bingo card),
  // then the model's call for the same show, then how it has done historically.
  app.appendChild(up);
  app.appendChild(pred);
  app.appendChild(track);
  initPredictor(up, A);
  renderTrackRecord(track);

  for (const card of [up, pred, track]) makeCollapsible(card);

  // ---- horizontal slice
  const h = el('div', 'grid cols-2');

  async function loadVenueSlice(venue, opts = {}) {
    vsResults.innerHTML = '';

      const j = await (await fetch(`/api/venue-slice?${qs}`)).json();

      const head = el('h2', null, `Phish at ${esc(label)} <span class="hint">— ${j.total} show${j.total === 1 ? '' : 's'} on record, ${desc}</span>`);
      head.style.marginTop = '14px';

  // Clicking a card's own <h2> collapses it. Delegated rather than bound directly,
  // because the predictor card rebuilds its heading on every render — a listener
  // attached to the original element would be discarded on the first re-render.
  // The .collapsed class lives on the card, which survives, so the state does too.
  function makeCollapsible(card) {
    card.classList.add('collapsible');

    const mark = () => {
      const h = [...card.children].find(n => n.tagName === 'H2');
      if (!h || h.dataset.collapseReady) return;
      h.dataset.collapseReady = '1';
      h.setAttribute('role', 'button');
      h.setAttribute('tabindex', '0');
      h.setAttribute('aria-expanded', String(!card.classList.contains('collapsed')));
    };
    mark();
    // Re-mark after the predictor replaces its own heading.
    new MutationObserver(mark).observe(card, { childList: true });

    const toggle = h => {
      card.classList.toggle('collapsed');
      h.setAttribute('aria-expanded', String(!card.classList.contains('collapsed')));
    };
    // Only the card's OWN heading toggles — headings inside nested content (the track
    // record's set labels, say) must not collapse the whole card.
    const ownHeading = target => {
      const h = target.closest && target.closest('h2');
      return h && h.parentElement === card ? h : null;
    };
    card.addEventListener('click', ev => {
      const h = ownHeading(ev.target);
      if (h) toggle(h);
    });
    card.addEventListener('keydown', ev => {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      const h = ownHeading(ev.target);
      if (!h) return;
      ev.preventDefault(); // space would scroll the page
      toggle(h);
    });
  }

  // ---- track record: the model's own past predictions, graded
  // Loaded separately from analysis.json because it grows with every show while
  // analysis.json is always only about the next one.
  async function renderTrackRecord(host) {
    host.appendChild(el('h2', null, 'Track record <span class="hint">— how past predictions actually did</span>'));
    const body = el('div');
    host.appendChild(body);
    body.appendChild(el('div', 'hint', 'Loading…'));

    let H;
    try {
      const res = await fetch('/data/history.json');
      if (!res.ok) throw new Error(String(res.status));
      H = await res.json();
    } catch {
      body.innerHTML = '';
      body.appendChild(el('div', 'hint', 'No prediction history available yet.'));
      return;
    }

    const graded = H.shows.filter(s => s.result).sort((a, b) => b.showdate.localeCompare(a.showdate));
    body.innerHTML = '';
    if (!graded.length) {
      body.appendChild(el('div', 'hint',
        'No graded predictions yet — a show is scored once its setlist is posted.'));
      return;
    }

    // headline: lifetime accuracy across every graded show
    const sum = H.summary;
    body.appendChild(el('div', 'tr-summary',
      `<b>${sum.showsGraded}</b> show${sum.showsGraded === 1 ? '' : 's'} graded · ` +
      `mean precision <b>${pct(sum.meanPrecision)}</b> <span class="hint">(of what we predicted, how much played)</span> · ` +
      `mean recall <b>${pct(sum.meanRecall)}</b> <span class="hint">(of what played, how much we called)</span>`));

    const detail = el('div');

    function drawShow(s) {
      detail.innerHTML = '';
      const r = s.result;
      const card = el('div', 'tr-detail');
      card.appendChild(el('div', 'setlabel',
        `${esc(fmtDate(s.showdate))} — ${esc(s.venue)}${s.city ? ', ' + esc(s.city) : ''}`));
      card.appendChild(el('div', 'hint',
        `Predicted using data through ${esc(fmtDate(s.asOf))} — before the show was played.`));

      card.appendChild(el('div', 'tr-metrics',
        `Precision <b>${pct(r.precision)}</b> · Recall <b>${pct(r.recall)}</b> · ` +
        `Correct set placement <b>${r.setPlacementHits.length}/${r.hits.length}</b>` +
        (r.top40Hits != null ? ` · Top-40 coverage <b>${r.top40Hits}/${r.uniqueActualCount}</b>` : '')));

      const lists = el('div', 'grid cols-3');
      for (const [label, items, cls] of [
        [`Hits (${r.hits.length})`, r.hits, 'tr-hit'],
        [`Missed calls (${r.misses.length})`, r.misses, 'tr-miss'],
        [`Surprises (${r.surprises.length})`, r.surprises, 'tr-surprise'],
      ]) {
        const col = el('div');
        col.appendChild(el('div', 'setlabel', label));
        col.appendChild(el('div', 'tr-songs',
          items.length ? items.map(n => `<span class="tr-song ${cls}">${esc(n)}</span>`).join('') : '<span class="hint">none</span>'));
        lists.appendChild(col);
      }
      card.appendChild(lists);

      for (const c of r.slotChecks || []) {
        card.appendChild(el('div', 'tr-slot', `${c.ok ? '✓' : '✗'} <b>${esc(c.check)}</b> — ${esc(c.detail)}`));
      }
      detail.appendChild(card);
    }

    // search across every archived show: date, venue, or any song named in it
    const search = el('input', 'ta-input tr-search');
    search.placeholder = 'search past predictions — date, venue, or song…';
    const list = el('div', 'tr-list');

    // Arrow navigation steps through whatever the search currently matches, so stepping
    // and filtering agree rather than the arrows walking shows the list isn't showing.
    // `graded` is newest-first, so a lower index is a more recent show.
    let matches = [];
    let idx = 0;
    const nav = el('div', 'tr-nav');
    const prev = el('button', 'tr-nav-btn', '← Newer');
    const next = el('button', 'tr-nav-btn', 'Older →');
    const pos = el('span', 'tr-nav-pos');
    nav.appendChild(prev); nav.appendChild(pos); nav.appendChild(next);

    function showAt(i) {
      if (!matches.length) return;
      idx = Math.max(0, Math.min(i, matches.length - 1));
      drawShow(matches[idx]);
      [...list.querySelectorAll('.tr-row')].forEach((n, j) => n.classList.toggle('active', j === idx));
      prev.disabled = idx === 0;
      next.disabled = idx === matches.length - 1;
      pos.textContent = `${idx + 1} of ${matches.length}`;
      // Keep the highlighted row visible when arrowing past the end of the viewport.
      list.querySelectorAll('.tr-row')[idx]?.scrollIntoView({ block: 'nearest' });
    }
    prev.addEventListener('click', () => showAt(idx - 1));
    next.addEventListener('click', () => showAt(idx + 1));

    function drawList() {
      const q = search.value.trim().toLowerCase();
      list.innerHTML = '';
      matches = graded.filter(s => {
        if (!q) return true;
        const hay = [
          s.showdate, s.venue, s.city,
          ...s.predicted.set1, ...s.predicted.set2, ...s.predicted.encore,
          ...(s.result.hits || []), ...(s.result.surprises || []),
        ].join(' ').toLowerCase();
        return hay.includes(q);
      });
      if (!matches.length) {
        list.appendChild(el('div', 'hint', 'No past predictions match that.'));
        nav.style.display = 'none';
        detail.innerHTML = '';
        return;
      }
      nav.style.display = matches.length > 1 ? '' : 'none';
      matches.forEach((s, i) => {
        const row = el('button', 'tr-row',
          `<b>${esc(fmtDate(s.showdate))}</b> <span class="hint">${esc(s.venue)}</span> ` +
          `<span class="tr-row-metrics">P ${pct(s.result.precision)} · R ${pct(s.result.recall)} · ` +
          `${s.result.hits.length} hit${s.result.hits.length === 1 ? '' : 's'}</span>`);
        row.addEventListener('click', () => showAt(i));
        list.appendChild(row);
      });
      showAt(0); // most recent match, so the panel is never empty
    }
    search.addEventListener('input', drawList);

    body.appendChild(search);
    body.appendChild(list);
    body.appendChild(nav);
    body.appendChild(detail);
    drawList(); // opens the most recent graded show by default
  }

  function num(v) { return v == null ? '—' : v; }
  function pct(v) { return v == null ? '—' : Math.round(v * 100) + '%'; }
  function tableOf(headers, rowsData, numCols = []) {
    const t = el('table');
    const tr = el('tr');
    headers.forEach((hh, i) => tr.appendChild(el('th', numCols.includes(i) ? 'num' : null, hh)));
    t.appendChild(tr);

    // per-column filter row: substring match, or >n <n >=n <=n =n on numeric-ish cells; plus sort toggles
    const ftr = el('tr', 'filter-row');
    const filters = [];
    const sortBtns = [];
    let sortState = { col: null, dir: 1 };
    headers.forEach((hh, i) => {
      const th = el('th');
      const wrap = el('div', 'th-controls');
      const inp = el('input', 'th-filter');
      inp.placeholder = '⌕';
      inp.addEventListener('input', apply);
      filters.push(inp);
      wrap.appendChild(inp);
      const btn = el('button', 'th-sort', '↕');
      btn.title = 'sort ' + (numCols.includes(i) ? 'numerically' : 'alphabetically');
      btn.addEventListener('click', () => {
        if (sortState.col === i) sortState.dir = -sortState.dir;
        else sortState = { col: i, dir: 1 };
        sortBtns.forEach(b => { b.textContent = '↕'; b.classList.remove('active'); });
        btn.textContent = sortState.dir === 1 ? '↑' : '↓';
        btn.classList.add('active');
        applySort();
      });
      sortBtns.push(btn);
      wrap.appendChild(btn);
      th.appendChild(wrap);
      ftr.appendChild(th);
    });
    t.appendChild(ftr);

    function applySort() {
      const i = sortState.col;
      if (i == null) return;
      const isNum = numCols.includes(i);
      const sorted = [...bodyRows].sort((a, b) => {
        const ta = a.children[i].textContent.trim();
        const tb = b.children[i].textContent.trim();
        if (isNum) {
          const na = parseFloat(ta.replace(/[^0-9.\-]/g, ''));
          const nb = parseFloat(tb.replace(/[^0-9.\-]/g, ''));
          if (isNaN(na) && isNaN(nb)) return 0;
          if (isNaN(na)) return 1;  // blanks/— always sink to the bottom
          if (isNaN(nb)) return -1;
          return sortState.dir * (na - nb);
        }
        return sortState.dir * ta.localeCompare(tb, undefined, { numeric: true, sensitivity: 'base' });
      });
      for (const r of sorted) t.appendChild(r);
    }

    const bodyRows = [];
    for (const r of rowsData) {
      const row = el('tr');
      r.forEach((cell, i) => row.appendChild(el('td', numCols.includes(i) ? 'num' : null, cell)));
      bodyRows.push(row);
      t.appendChild(row);
    }

    function apply() {
      for (const row of bodyRows) {
        let show = true;
        filters.forEach((f, i) => {
          if (!show) return;
          const v = f.value.trim().toLowerCase();
          if (!v) return;
          const text = row.children[i].textContent.toLowerCase();
          const cmp = v.match(/^(>=|<=|>|<|=)\s*(-?\d+\.?\d*)$/);
          if (cmp) {
            const cellNum = parseFloat(text.replace(/[^0-9.\-]/g, ''));
            if (isNaN(cellNum)) { show = false; return; }
            const n = parseFloat(cmp[2]);
            show = cmp[1] === '>' ? cellNum > n : cmp[1] === '<' ? cellNum < n :
                   cmp[1] === '>=' ? cellNum >= n : cmp[1] === '<=' ? cellNum <= n : cellNum === n;
          } else {
            show = text.includes(v);
          }
        });
        row.style.display = show ? '' : 'none';
      }
    }
    return t;
  }
});
</script>
