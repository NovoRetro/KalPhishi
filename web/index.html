          `Whoever opens a link becomes your friend. Limited by default — 0 means no limit.${owned.length
            ? ' Pick a group and they join it too.' : ''}`));

        const live = invites.filter(i => !i.spent && !i.expired);
        if (!live.length) return;
        for (const i of live) {
          const url = `${location.origin}/?invite=${i.code}`;
          const row = el('div', 'invite-row');
          const label = i.group ? `📋 Copy ${i.group.name} link` : '📋 Copy link';
          const copy = el('button', 'invite-copy');
          copy.textContent = label;
          copy.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(url);
              copy.textContent = '✓ Copied';
            } catch {
              // Clipboard needs permission/secure context; fall back to selectable text.
              copy.textContent = 'Copy manually →';
              const box = el('input', 'ta-input');
              box.value = url; box.readOnly = true;
              row.appendChild(box); box.select();
            }
            setTimeout(() => { copy.textContent = label; }, 1800);
          });
          row.appendChild(copy);
          // Limits are shown because they are now real: a link that says nothing about its
          // reach is the state this was fixing.
          const left = i.maxUses == null ? '∞' : i.maxUses - i.uses;
          const dleft = i.expires == null ? null : Math.ceil((i.expires - Date.now()) / 86_400_000);
          row.appendChild(el('span', 'menu-stats',
            ` used ${i.uses}${i.maxUses ? '/' + i.maxUses : ''} · ${left} left` +
            (dleft == null ? ' · no expiry' : dleft <= 1 ? ' · expires today' : ` · ${dleft}d left`)));
          const rev = el('button', 'friend-remove', 'Revoke');
          rev.addEventListener('click', async () => {
            rev.disabled = true;
            try { await mfetch('/api/invites/' + encodeURIComponent(i.code), 'DELETE'); await drawInvites(); }
            catch (e) { rev.disabled = false; msg.textContent = e.message; }
          });
          row.appendChild(rev);
          inviteHost.appendChild(row);
        }
      }

      const groupHost = el('div');

      async function drawGroups() {
        groupHost.innerHTML = '';
        groupHost.appendChild(el('div', 'setlabel', 'Groups'));
        let groups = [], friends = [];
        try {
          [groups, friends] = await Promise.all([
            mfetch('/api/groups', 'GET').then(j => j.groups),
            mfetch('/api/friends', 'GET').then(j => j.friends),
          ]);
        } catch (e) { groupHost.appendChild(el('div', 'menu-note', e.message)); return; }

        if (!groups.length) groupHost.appendChild(el('div', 'menu-note', 'No groups yet.'));
        for (const g of groups) {
          const row = el('div', 'friend-row',
            `<span><b>${esc(g.name)}</b> <span class="menu-stats">${g.memberCount} member${g.memberCount === 1 ? '' : 's'}` +
            `${g.isOwner ? '' : ' · joined'}</span></span>`);
          // Owners manage; everyone else can only leave.
          if (g.isOwner) {
            const add = el('button', 'friend-remove', '＋ Add');
            add.style.color = 'var(--ink-2)';
            add.addEventListener('click', () => drawAddPicker(g, friends));
            row.appendChild(add);
            const del = el('button', 'friend-remove', 'Delete');
            del.addEventListener('click', async () => {
              del.disabled = true;
              try {
                await mfetch('/api/groups/' + encodeURIComponent(g.id), 'DELETE');
                // Invites too: any link into this group has just become a plain friend
                // invite, and the selector must lose the option.
                await Promise.all([drawGroups(), drawInvites()]);
              } catch (e) { del.disabled = false; msg.textContent = e.message; }
            });
            row.appendChild(del);
          } else {
            const leave = el('button', 'friend-remove', 'Leave');
            leave.addEventListener('click', async () => {
              leave.disabled = true;
              try {
                await mfetch(`/api/groups/${encodeURIComponent(g.id)}/members/${encodeURIComponent(user.handle)}`, 'DELETE');
                await drawGroups();
              } catch (e) { leave.disabled = false; msg.textContent = e.message; }
            });
            row.appendChild(leave);
          }
          groupHost.appendChild(row);
        }

        const nameInput = el('input', 'ta-input');
        nameInput.placeholder = 'new group name';
        const create = el('button', 'p-btn', 'Create group');
        const go = async () => {
          const name = nameInput.value.trim();
          if (!name) return;
          create.disabled = true;
          try {
            await mfetch('/api/groups', 'POST', { name });
            nameInput.value = '';
            // A brand-new group has to appear in the invite selector, or the first thing
            // an owner wants to do with it — share it — isn't offered.
            await Promise.all([drawGroups(), drawInvites()]);
          } catch (e) { msg.textContent = e.message; }
          create.disabled = false;
        };
        create.addEventListener('click', go);
        nameInput.addEventListener('keydown', ev => { if (ev.key === 'Enter') go(); });
        groupHost.appendChild(nameInput);
        groupHost.appendChild(create);
      }

      // Only friends are offered — groups are subsets of your friend list, so there is
      // no free-text handle entry that would bypass the invite flow.
      async function drawAddPicker(g, friends) {
        groupHost.innerHTML = '';
        groupHost.appendChild(el('div', 'setlabel', `Add to ${g.name}`));
        let members = [];
        try { members = (await mfetch(`/api/groups/${encodeURIComponent(g.id)}/members`, 'GET')).members; }
        catch { /* fall through with an empty list */ }
        const inGroup = new Set(members.map(m => m.handle));
        const available = friends.filter(f => !inGroup.has(f.handle));
        if (!available.length) {
          groupHost.appendChild(el('div', 'menu-note', friends.length
            ? 'All your friends are already in this group.'
            : 'Add friends first — share an invite link above.'));
        }
        for (const f of available) {
          const row = el('div', 'friend-row', `<span><b>${esc(f.name)}</b> <span class="menu-stats">@${esc(f.handle)}</span></span>`);
          const add = el('button', 'friend-remove', 'Add');
          add.style.color = 'var(--ink-2)';
          add.addEventListener('click', async () => {
            add.disabled = true;
            try {
              await mfetch(`/api/groups/${encodeURIComponent(g.id)}/members`, 'POST', { handle: f.handle });
              await drawAddPicker(g, friends);
            } catch (e) { add.disabled = false; msg.textContent = e.message; }
          });
          row.appendChild(add);
          groupHost.appendChild(row);
        }
        // Members currently in the group, with removal for the owner.
        if (members.length > 1) {
          groupHost.appendChild(el('div', 'setlabel', 'In this group'));
          for (const mem of members) {
            const row = el('div', 'friend-row',
              `<span><b>${esc(mem.name)}</b> <span class="menu-stats">@${esc(mem.handle)}${mem.isOwner ? ' · owner' : ''}</span></span>`);
            if (!mem.isOwner) {
              const rm = el('button', 'friend-remove', 'Remove');
              rm.addEventListener('click', async () => {
                rm.disabled = true;
                try {
                  await mfetch(`/api/groups/${encodeURIComponent(g.id)}/members/${encodeURIComponent(mem.handle)}`, 'DELETE');
                  await drawAddPicker(g, friends);
                } catch (e) { rm.disabled = false; msg.textContent = e.message; }
              });
              row.appendChild(rm);
            }
            groupHost.appendChild(row);
          }
        }
        const back = el('button', 'p-btn p-btn-alt', '← Back to groups');
        back.addEventListener('click', () => drawGroups());
        groupHost.appendChild(back);
      }

      wrap.appendChild(listHost);
      wrap.appendChild(inviteHost);
      wrap.appendChild(groupHost);
      wrap.appendChild(msg);
      panel.appendChild(wrap);
      panel.appendChild(item('← Back', () => drawContent()));
      drawFriends();
      drawInvites();
      drawGroups();
      return;
    }

    // Ordered by how often a returning player reaches for each thing, not by how the app is
    // built. Who you are, then what you did, then who you are playing against — that is the
    // loop the cohort is here for, and Friends now sits inside it rather than below the
    // reference material. How scoring works is read once or twice and then rarely, so it
    // drops to just above the way out. Change password is gone from this list entirely: it
    // is account maintenance, it lives in Profile with the rest of the account, and it was
    // taking a top-level slot ahead of the social loop.
    panel.appendChild(item('My History', () => { close(); actions?.goTo('history'); }));
    panel.appendChild(item('Friends', () => drawContent('friends')));
    panel.appendChild(item('How scoring works', () => drawContent('scoring')));
    panel.appendChild(item('Sign out', async () => { close(); await actions?.signOut(); }, 'danger'));
  }

  window.KalphishiMenu = {
    update(user, actions) {
      state = { user, actions };
      if (isOpen()) drawContent();
    },
  };
})();

// ---- sign in / create account modal ----
// Pure chrome: predictor.js owns the sign-in/register form and its state (authPrompt);
// this just gives that content a floating home instead of an inline slot in the page
// flow. show()/hide() are the programmatic API predictor.js drives every render from —
// hide() is a no-op if already closed, so calling it unconditionally is safe. Dismissal
// via Esc or backdrop click is chrome-initiated, so it's reported back through the
// dismiss callback rather than assumed — predictor.js's authPrompt is the single source
// of truth for whether the form should be showing.
(function () {
  const backdrop = document.getElementById('auth-modal-backdrop');
  let dismissCb = null;
  let lastFocus = null;

  function isOpen() { return backdrop.classList.contains('open'); }

  function doHide() {
    if (!isOpen()) return;
    backdrop.classList.remove('open');
    backdrop.innerHTML = '';
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); else document.getElementById('menu-btn')?.focus();
  }

  backdrop.addEventListener('click', ev => {
    if (ev.target !== backdrop) return; // only the dimmed area, not the card itself
    doHide();
    dismissCb?.();
  });
  document.addEventListener('keydown', ev => {
    if (!isOpen()) return;
    if (ev.key === 'Escape') { doHide(); dismissCb?.(); return; }
    if (ev.key === 'Tab') {
      const focusables = [...backdrop.querySelectorAll('button, input')].filter(n => !n.disabled);
      if (!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (ev.shiftKey && document.activeElement === first) { last.focus(); ev.preventDefault(); }
      else if (!ev.shiftKey && document.activeElement === last) { first.focus(); ev.preventDefault(); }
    }
  });

  window.KalphishiAuthModal = {
    show(contentNode) {
      if (!isOpen()) lastFocus = document.activeElement;
      backdrop.innerHTML = '';
      backdrop.appendChild(contentNode);
      backdrop.classList.add('open');
      const first = contentNode.querySelector('input') || contentNode.querySelector('button');
      if (first) first.focus();
    },
    hide: doHide,
    onDismiss(cb) { dismissCb = cb; },
  };
})();

const tooltip = document.getElementById('tooltip');

// Mouse tracks on hover; touch has no hover, so a tap toggles the tip and a tap
// anywhere else dismisses it. tipOwner is the node currently showing a tapped tip.
let tipOwner = null;
function showTip(name, why, x, y) {
  tooltip.innerHTML = `<div class="tt-name">${esc(name)}</div><div class="tt-why">${esc(why)}</div>`;
  tooltip.style.display = 'block';
  // A phone has no hover, so every tip here is a deliberate tap — and anchoring a 300px
  // card to a fingertip near the edge of a 375px screen leaves it clamped hard against a
  // margin and half under the thumb that opened it. Centre it instead and let it read as
  // a small panel. Dismissal is unchanged: it is pointer-events:none, so a tap anywhere
  // reaches the document handler below.
  const phone = window.matchMedia('(max-width: 560px)').matches;
  tooltip.classList.toggle('tt-modal', phone);
  if (phone) { tooltip.style.left = ''; tooltip.style.top = ''; return; }
  const w = tooltip.offsetWidth, h = tooltip.offsetHeight;
  // Flip above the finger when there is not room below, and keep it on-screen.
  const top = y + 14 + h > window.innerHeight ? Math.max(8, y - 14 - h) : y + 14;
  tooltip.style.left = Math.max(8, Math.min(x + 14, window.innerWidth - w - 8)) + 'px';
  tooltip.style.top = top + 'px';
}
function hideTip() { tooltip.style.display = 'none'; }

document.addEventListener('pointerup', ev => {
  if (tipOwner && !tipOwner.contains(ev.target)) { hideTip(); tipOwner = null; }
}, true);

function bindTip(node, name, why) {
  node.addEventListener('pointermove', ev => {
    if (ev.pointerType !== 'mouse' || tipOwner) return;
    showTip(name, why, ev.clientX, ev.clientY);
  });
  node.addEventListener('pointerleave', ev => {
    if (ev.pointerType === 'mouse' && !tipOwner) hideTip();
  });
  node.addEventListener('pointerup', ev => {
    if (ev.pointerType === 'mouse') return;
    if (tipOwner === node) { hideTip(); tipOwner = null; }
    else { tipOwner = node; showTip(name, why, ev.clientX, ev.clientY); }
  });
}

fetch('/data/analysis.json').then(r => r.json()).then(A => {
  // The header used to carry the next show, the tour totals and the era window. The next
  // show is stated again by the game below it, and the other two are corpus stats — the
  // sort of thing that belongs where the corpus is being read, not above a bingo card.

  const app = document.getElementById('app');

  // ---- predicted setlist marquee
  const pred = el('div', 'card marquee');
  pred.appendChild(el('h2', null, `Predicted setlist — ${esc(fmtDate(A.nextShow.date))} ${esc(A.nextShow.venue)} <span class="hint">(hover or tap a song for reasoning)</span>`));
  for (const [label, list] of [['Set 1', A.prediction.set1], ['Set 2', A.prediction.set2], ['Encore', A.prediction.encore]]) {
    pred.appendChild(el('div', 'setlabel', label));
    const row = el('div', 'setlist');
    const albumBySong = new Map((A.albums?.predictionMix || []).map(m => [m.song, m]));
    list.forEach((s, i) => {
      const sp = el('span', 's song', esc(s.name));
      const am = albumBySong.get(s.name);
      const albumNote = am && am.album ? ` · ${am.album} (${am.year})` : '';
      bindTip(sp, `${s.name} — score ${s.score}`, (s.why.join('; ') || 'rotation strength') + albumNote);
      row.appendChild(sp);
      if (i < list.length - 1) row.appendChild(el('span', 't', label === 'Encore' ? ',' : '&gt;'));
    });
    pred.appendChild(row);
  }
  pred.dataset.section = 'Predicted Setlist';

  // Both read by renderTabs, and both reachable from initPredictor's onModeChange before
  // the tab code below runs — see the note at the initPredictor call.
  let predictor = null;
  let menuMode = null; // 'history' | 'profile' while the account menu owns the view

  // ---- user predictor. Not filed under a data section: it IS the two game tabs, and the
  // tab bar shows or hides it directly.
  const up = el('div', 'card card-overflow');
  up.dataset.games = '1';

  // ---- track record: how past predictions actually did.
  // Sits with the predicted setlist rather than getting its own tab — it is the same
  // subject, the model's calls, seen after the fact instead of before.
  const track = el('div', 'card card-overflow');
  track.dataset.section = 'Predicted Setlist';

  app.appendChild(up);
  app.appendChild(pred);
  app.appendChild(track);
  // Declared with `let`, above the call, on purpose: onModeChange can fire from inside
  // initPredictor, and renderTabs reads both. A `const` after the call would leave them in
  // the temporal dead zone and throw on the way past.
  predictor = initPredictor(up, A, {
    // History and profile are reached from the account menu, which does not go through
    // the tab bar — so the page hears about them and shows the card with no game selected.
    onModeChange: m => { menuMode = (m === 'history' || m === 'profile') ? m : null; renderTabs(); },
    // A fresh tagline greets whoever just arrived, whether that's a login or a new
    // account — both are "someone showing up", and the fade makes the swap read as
    // deliberate rather than the page glitching under them.
    onSignedIn: () => showTagline(true),
  });
  renderTrackRecord(track);

  for (const card of [up, pred, track]) makeCollapsible(card);

  // ---- horizontal slice
  const h = el('div', 'grid cols-2');
  h.dataset.section = 'Song Rotation';

  const due = el('div', 'card');
  due.appendChild(el('h2', null, 'Due back up <span class="hint">— in tour rotation, repeat window open</span>'));
  due.appendChild(tableOf(
    // Header follows the target show rather than a hardcoded date, which went stale the
    // moment the prediction advanced.
    ['Song', 'Last tour play', `Gap at ${fmtDateShort(A.nextShow.date)}`, 'Era freq', 'Cadence'],
    A.horizontal.dueBackUp.slice(0, 18).map(d => [
      `<span class="song">${esc(d.name)}</span>`, fmtDateShort(d.lastTourPlay),
      num(d.gapAtNext), pct(d.eraFreq), num(d.medianInterval),
    ]), [2, 3, 4]));
  h.appendChild(due);

  const abs = el('div', 'card');
  abs.appendChild(el('h2', null, 'Conspicuously absent <span class="hint">— era staples with zero tour plays</span>'));
  abs.appendChild(tableOf(
    ['Song', 'Last played', 'Shows since', 'Cadence', 'Overdue ×'],
    A.horizontal.absent.slice(0, 18).map(d => [
      `<span class="song">${esc(d.name)}</span>`, fmtDate(d.lastPlayed),
      num(d.currentGap), num(d.medianInterval), num(d.overdueFactor),
    ]), [2, 3, 4]));
  h.appendChild(abs);
  app.appendChild(h);

  const h2 = el('div', 'grid cols-2');
  h2.dataset.section = 'Song Rotation';

  const rot = el('div', 'card');
  rot.appendChild(el('h2', null, 'Tour rotation <span class="hint">— most-played songs this tour, tap a date to hear it</span>'));
  rot.appendChild(tableOf(
    ['Song', 'Plays', 'Dates'],
    A.horizontal.tourSongs.filter(t => t.plays >= 2).slice(0, 18).map(t => [
      `<span class="song">${esc(t.name)}</span>`, num(t.plays),
      // Each date is a show reference, so each one is its own trigger. The panel opens
      // once at the bottom of the card rather than inside a table cell — see bind().
      `<span class="why">${t.dates.map(d =>
        `<button class="rl-chip" data-listen-date="${esc(d)}">${esc(fmtDateShort(d))}</button>`).join('')}</span>`,
    ]), [1]));
  if (window.KalphishiListen) window.KalphishiListen.bind(rot);
  h2.appendChild(rot);

  const hist = el('div', 'card');
  hist.appendChild(el('h2', null, 'Intra-tour repeat gaps <span class="hint">— shows between repeats of the same song</span>'));
  const hd = A.tour.intraTourGapHistogram;
  const keys = Object.keys(hd).map(Number).sort((a, b) => a - b);
  const max = Math.max(...keys.map(k => hd[k]));
  const bars = el('div', 'bars');
  for (const k of keys) {
    const b = el('div', 'bar');
    b.appendChild(el('div', 'v', hd[k]));
    const f = el('div', 'fill'); f.style.height = (hd[k] / max * 80) + 'px';
    bindTip(f, `Gap of ${k} shows`, `${hd[k]} song repeat${hd[k] > 1 ? 's' : ''} came back after ${k} shows`);
    b.appendChild(f);
    b.appendChild(el('div', 'x', k));
    bars.appendChild(b);
  }
  hist.appendChild(bars);
  hist.appendChild(el('div', 'legend-note', `Median repeat gap: ${A.tour.medianRepeatGap} shows — songs last played ≥${A.tour.medianRepeatGap} shows ago are back in the window.`));
  h2.appendChild(hist);
  app.appendChild(h2);

  // ---- album slice
  const h3 = el('div', 'grid cols-2');
  h3.dataset.section = 'Album Coverage';

  const alb = el('div', 'card');
  alb.appendChild(el('h2', null, `Album representation <span class="hint">— tour plays by studio album (${A.albums.attributedPlays} of ${A.albums.attributedPlays + A.albums.unattributedPlays} plays attributed)</span>`));
  const maxShare = Math.max(...A.albums.tourShare.map(t => t.sharePct));
  alb.appendChild(tableOf(
    ['Album', 'Year', 'Plays', 'Songs', 'Share'],
    A.albums.tourShare.map(t => [
      `<span class="song">${esc(t.album)}</span>`, t.year, num(t.plays), num(t.uniqueSongs),
      `<span class="sharebar"><i style="width:${(t.sharePct / maxShare * 60).toFixed(0)}px"></i>${t.sharePct}%</span>`,
    ]), [1, 2, 3]));
  h3.appendChild(alb);

  const era = el('div', 'card');
  era.appendChild(el('h2', null, 'Era center of gravity <span class="hint">— mean album year per show; the MSG run reaches back</span>'));
  const YMIN = 1988;
  const eraBars = el('div', 'bars');
  for (const s of A.albums.perShowEra) {
    const b = el('div', 'bar');
    b.appendChild(el('div', 'v', String(Math.round(s.meanYear)).slice(2)));
    const f = el('div', 'fill');
    f.style.height = ((s.meanYear - YMIN) / (2026 - YMIN) * 96) + 'px';
    bindTip(f, `${fmtDate(s.date)} — mean album year ${s.meanYear}`,
      `Top album: ${s.topAlbum || '—'} · ${s.attributed}/${s.total} songs on a studio album`);
    b.appendChild(f);
    b.appendChild(el('div', 'x', fmtAxisDay(s.date)));
    eraBars.appendChild(b);
  }
  era.appendChild(eraBars);
  // The month lives here, not on every tick — see fmtAxisDay.
  const eraSpan = A.albums.perShowEra.length
    ? fmtDateSpan(A.albums.perShowEra[0].date, A.albums.perShowEra[A.albums.perShowEra.length - 1].date)
    : '';
  era.appendChild(el('div', 'legend-note',
    `Bar = average release year of the show’s studio-album songs (baseline 1988).`
    + `${eraSpan ? ` Ticks are show days, ${eraSpan}.` : ''} Hover for the show’s top album.`));
  h3.appendChild(era);
  app.appendChild(h3);

  // ---- vertical slice
  const v = el('div', 'card card-overflow');
  v.dataset.section = 'Venue History';
  v.appendChild(el('h2', null, `Vertical slice — Phish at ${esc(A.vertical.venue)} <span class="hint">(songs also in the current top-40 candidates are underlined)</span>`));
  const topSlugs = new Set(A.candidates.slice(0, 40).map(c => c.slug));

  function venueShowsGrid(shows) {
    const vwrap = el('div', 'grid cols-3');
    const setNames = { 1: 'Set 1', 2: 'Set 2', 3: 'Set 3', e: 'Encore', e2: 'Encore 2' };
    for (const show of shows) {
      const card = el('div', 'venue-show');
      card.appendChild(el('div', null, `<span class="date">${esc(fmtDate(show.date))}</span><span class="tour">${esc(show.tour || '')}</span>` +
        `<button class="rl-chip rl-chip-lone" data-listen-date="${esc(show.date)}" title="Hear this show">Listen</button>`));
      for (const [set, items] of Object.entries(show.sets)) {
        card.appendChild(el('div', 'setlabel', setNames[set] || 'Set ' + set));
        const row = el('div', 'setlist');
        items.forEach((it, i) => {
          // Same idea as the ranked table — the song is the control — but this one plays
          // THIS show's performance rather than the best-loved one, so it carries the date
          // alongside the title. The href points at that exact performance on phish.in;
          // bind() intercepts the plain click and leaves a modified one to the browser.
          const listen = window.KalphishiListen;
          const cls = (listen ? 's s-play' : 's') + (topSlugs.has(it.slug) ? ' overlap' : '');
          const sp = el(listen ? 'a' : 'span', cls, esc(it.song));
          if (listen) {
            sp.href = `https://phish.in/${encodeURIComponent(show.date)}/${listen.slugify(it.song)}`;
            sp.target = '_blank';
            sp.rel = 'noopener noreferrer';
            sp.dataset.listenDate = show.date;
            sp.dataset.listenTrack = it.song;
            sp.title = `Play ${it.song} from this show`;
          }
          row.appendChild(sp);
          if (i < items.length - 1) row.appendChild(el('span', 't', esc(it.trans || ',').trim() || ','));
        });
        card.appendChild(row);
      }
      if (show.notes) {
        const n = el('div', 'why', esc(show.notes.slice(0, 260)) + (show.notes.length > 260 ? '…' : ''));
        n.style.marginTop = '6px';
        card.appendChild(n);
      }
      vwrap.appendChild(card);
    }
    return vwrap;
  }

  v.appendChild(venueShowsGrid(A.vertical.shows));
  // Bound on the card, not the grid, so the panel survives the grid being replaced when
  // someone explores a different venue below.
  if (window.KalphishiListen) window.KalphishiListen.bind(v);

  // venue search: generate a vertical slice for any past venue
  v.appendChild(el('div', 'setlabel', 'Explore another venue'));
  const vs = el('div', 'ta-wrap');
  const vsInput = el('input', 'ta-input');
  vsInput.placeholder = 'search venues…';
  const vsList = el('div', 'ta-list');
  vsList.style.display = 'none';
  vs.appendChild(vsInput); vs.appendChild(vsList);
  v.appendChild(vs);
  const vsResults = el('div');
  v.appendChild(vsResults);

  let venueCatalog = null;
  vsInput.addEventListener('focus', () => {
    if (!venueCatalog) fetch('/data/venues.json').then(r => r.json()).then(d => { venueCatalog = d; });
  });
  vsInput.addEventListener('input', () => {
    const q = vsInput.value.trim().toLowerCase();
    vsList.innerHTML = '';
    if (!q || !venueCatalog) { vsList.style.display = 'none'; return; }
    const matches = venueCatalog
      .filter(x => (`${x.venuename} ${x.city} ${x.state}`).toLowerCase().includes(q))
      .slice(0, 8);
    for (const m of matches) {
      const row = el('div', 'ta-item', `${esc(m.venuename)} <span class="ta-plays">${esc(m.city)}${m.state ? ', ' + esc(m.state) : ''}</span>`);
      row.addEventListener('mousedown', ev => {
        ev.preventDefault();
        vsList.style.display = 'none';
        vsInput.value = '';
        loadVenueSlice(m);
      });
      vsList.appendChild(row);
    }
    vsList.style.display = matches.length ? '' : 'none';
  });
  vsInput.addEventListener('blur', () => setTimeout(() => { vsList.style.display = 'none'; }, 150));

  async function loadVenueSlice(venue, opts = {}) {
    vsResults.innerHTML = '';
    const label = `${venue.venuename}, ${venue.city}${venue.state ? ' ' + venue.state : ''}`;
    const loadingN = opts.limit || (opts.dates && opts.dates.length) || 5;
    vsResults.appendChild(el('div', 'hint', `Loading ${esc(label)}… ${loadingN > 10 ? `(${loadingN} shows — first load can take a moment)` : ''}`));
    try {
      const qs = new URLSearchParams({ venueid: venue.venueid });
      if (opts.limit) qs.set('limit', opts.limit);
      if (opts.dates) qs.set('dates', opts.dates.join(','));
      const j = await (await fetch(`/api/venue-slice?${qs}`)).json();
      if (j.error) throw new Error(j.error);
      vsResults.innerHTML = '';
      const desc = opts.dates ? `showing ${j.shown} selected` : (j.total > j.shown ? `showing the ${j.shown} most recent` : 'showing all');
      const head = el('h2', null, `Phish at ${esc(label)} <span class="hint">— ${j.total} show${j.total === 1 ? '' : 's'} on record, ${desc}</span>`);
      head.style.marginTop = '14px';
      vsResults.appendChild(head);

      // controls: show more / show all / pick specific shows
      const shownDates = new Set(j.shows.map(s => s.date));
      const controls = el('div', 'vs-controls');
      if (!opts.dates && j.shown < j.total) {
        const more = el('button', 'p-mode', 'Show 5 more');
        more.addEventListener('click', () => loadVenueSlice(venue, { limit: j.shown + 5 }));
        controls.appendChild(more);
        const all = el('button', 'p-mode', `Show all ${j.total}`);
        all.addEventListener('click', () => loadVenueSlice(venue, { limit: j.total }));
        controls.appendChild(all);
      }
      const pick = el('button', 'p-mode', 'Pick shows ▾');
      controls.appendChild(pick);
      vsResults.appendChild(controls);

      const panel = el('div', 'vs-panel');
      panel.style.display = 'none';
      for (const d of j.dates) {
        const lab = el('label', null, `<input type="checkbox" value="${d}"${shownDates.has(d) ? ' checked' : ''}> ${d}`);
        panel.appendChild(lab);
      }
      const apply = el('button', 'p-btn', 'Show selected');
      apply.style.marginTop = '6px';
      apply.addEventListener('click', () => {
        const sel = [...panel.querySelectorAll('input:checked')].map(i => i.value);
        if (sel.length) loadVenueSlice(venue, { dates: sel });
      });
      const panelWrap = el('div');
      panelWrap.appendChild(panel);
      panelWrap.appendChild(apply);
      apply.style.display = 'none';
      vsResults.appendChild(panelWrap);
      pick.addEventListener('click', () => {
        const open = panel.style.display === 'none';
        panel.style.display = open ? '' : 'none';
        apply.style.display = open ? '' : 'none';
        pick.textContent = open ? 'Pick shows ▴' : 'Pick shows ▾';
      });

      if (!j.shows.length) vsResults.appendChild(el('div', 'hint', 'No Phish setlists on record at this venue.'));
      else vsResults.appendChild(venueShowsGrid(j.shows));
    } catch (e) {
      vsResults.innerHTML = '';
      vsResults.appendChild(el('div', 'hint', `Could not load venue: ${esc(e.message)}`));
    }
  }
  app.appendChild(v);

  // ---- candidates table
  const c = el('div', 'card');
  c.dataset.section = 'Ranked Songs';
  c.appendChild(el('h2', null, 'All candidates <span class="hint">— ranked by combined horizontal + vertical score. Tap a song for its best-loved version; hover or tap a Why to read it in full.</span>'));

  // The name IS the control, rather than a name plus a play chip beside it — the chip cost
  // width in every one of 60 rows to say what the link already says.
  //
  // Unlike every other trigger in the app this one names a SONG, not a show: there is no
  // single show behind a ranked candidate, so it resolves to the performance phish.in's
  // users have liked most. The slug comes from the listen module rather than x.slug or a
  // local copy of the rule, so the href and the panel it opens can never disagree about
  // which song they mean — phish.in slugifies apostrophes differently to us.
  //
  // A real <a>, so it behaves like one: focusable, right-clickable, and openable in a new
  // tab. bind() steps aside for a modified click and intercepts the plain one. Degrades to
  // plain text if the module is absent, rather than rendering a link built on a guess.
  const songCell = x => (window.KalphishiListen
    ? `<a class="song song-link" href="https://phish.in/songs/${esc(window.KalphishiListen.slugify(x.name))}"` +
      ` target="_blank" rel="noopener noreferrer"` +
      ` data-listen-song="${esc(x.name)}" title="Hear the highest rated version">${esc(x.name)}</a>`
    : `<span class="song">${esc(x.name)}</span>`);

  const candTable = tableOf(
    ['#', 'Song', 'Score', 'Era freq', 'Shows since', 'Cadence', 'Tour plays', 'Why'],
    A.candidates.slice(0, 60).map((x, i) => [
      num(i + 1),
      songCell(x),
      `<span class="score">${x.score}</span>`,
      pct(x.eraFreq), num(x.currentGap), num(x.medianInterval), num(x.tourPlays),
      // Full text, clamped to one line by CSS — see .why-trunc. The reason travels in a
      // data attribute too, so the tip reads it without depending on what the clamp left
      // visible.
      `<span class="why why-trunc" data-song="${esc(x.name)}" data-why="${esc(x.why.join('; '))}">${esc(x.why.join('; '))}</span>`,
    ]), [0, 2, 3, 4, 5, 6]);
  c.appendChild(candTable);
  // Bound after the table exists, since tableOf builds its cells from HTML strings and
  // there is no node to hand a listener to until it has run.
  for (const cell of candTable.querySelectorAll('.why-trunc')) {
    bindTip(cell, cell.dataset.song, cell.dataset.why);
  }
  if (window.KalphishiListen) window.KalphishiListen.bind(c);
  app.appendChild(c);

  // ---- play a show
  //
  // Its own destination rather than another Data sub-tab: everywhere else audio hangs off
  // a show the model was already talking about, so it answers "what did that sound like".
  // This one answers "I want to listen to something", which is a different errand and does
  // not start from the model at all.
  //
  // The catalogue is Relisten's, not ours — 39 years of it — so nothing here is derived
  // from analysis.json. A year is one request, cached for the session, and the list only
  // ever offers shows that actually have a source behind them.
  const playCard = el('div', 'card card-overflow');
  playCard.dataset.play = '1';
  app.appendChild(playCard);

  let playBuilt = false;
  function buildPlayShow() {
    if (playBuilt) return;
    playBuilt = true;
    const L = window.KalphishiListen;
    playCard.innerHTML = '';
    playCard.appendChild(el('h2', null,
      'Play a Show <span class="hint">— streamed from phish.in, indexed by Relisten</span>'));
    if (!L || !L.loadYears) {
      playCard.appendChild(el('div', 'hint', 'The listening module did not load.'));
      return;
    }

    const quickHost = el('div', 'ps-quick-host');
    playCard.appendChild(quickHost);

    const filters = el('div', 'ps-filters');
    const yearSel = el('select', 'ps-year');
    const search = el('input', 'ta-input ps-search');
    search.placeholder = 'filter by venue, city or date…';
    search.setAttribute('aria-label', 'Filter shows');
    filters.appendChild(yearSel);
    filters.appendChild(search);
    playCard.appendChild(filters);

    const head = el('div', 'ps-listhead', 'Loading the catalogue…');
    playCard.appendChild(head);
    const list = el('div', 'ps-list');
    playCard.appendChild(list);

    // `all` is every show for the selected scope; `label` describes that scope. The search
    // box filters `all` on the way to the DOM rather than mutating it, so clearing the box
    // restores the full list without another fetch.
    let all = [];
    let label = '';

    const matches = (s, q) =>
      !q || `${s.date} ${fmtDate(s.date)} ${s.venue} ${s.location}`.toLowerCase().includes(q);

    function paintList() {
      const q = search.value.trim().toLowerCase();
      const rows = all.filter(s => matches(s, q));
      list.innerHTML = '';
      head.textContent = rows.length === all.length
        ? `${label} · ${all.length} show${all.length === 1 ? '' : 's'}`
        : `${label} · ${rows.length} of ${all.length} shown`;
      if (!rows.length) {
        list.appendChild(el('div', 'hint', 'No shows match that filter.'));
        return;
      }
      for (const s of rows) list.appendChild(showRow(s));
    }

    // Collapsed by default; the panel is built once on first expand and then only hidden,
    // never removed. Destroying it would take its transport controls away from a recording
    // that carries on playing — the <audio> is global and does not care about the DOM.
    function showRow(s) {
      const row = el('div', 'ps-row');
      const where = [s.venue, s.location].filter(Boolean).join(' · ');
      const btn = el('button', 'ps-rowhead',
        `<span class="ps-caret">&#9656;</span>` +
        `<span class="ps-date">${esc(fmtDate(s.date))}</span>` +
        `<span class="ps-where">${esc(where)}</span>` +
        (s.soundboard ? '<span class="ps-sbd" title="A soundboard source exists">SBD</span>' : ''));
      btn.setAttribute('aria-expanded', 'false');
      const body = el('div', 'ps-body');
      let loaded = false;
      btn.addEventListener('click', () => {
        const open = row.classList.toggle('open');
        btn.setAttribute('aria-expanded', String(open));
        if (open && !loaded) { loaded = true; L.renderShow(body, s.date); }
      });
      row.appendChild(btn);
      row.appendChild(body);
      return row;
    }

    // The quick way in. Names the most recent show Relisten actually has, so it stays
    // truthful as the tour advances without anything here being edited.
    function paintQuick(s) {
      quickHost.innerHTML = '';
      if (!s) return;
      const where = [s.venue, s.location].filter(Boolean).join(' · ');
      const b = el('button', 'ps-quick',
        `<span class="ps-quick-ico">&#9654;</span>` +
        `<span><span class="ps-quick-main">Play ${esc(fmtDate(s.date))}</span>` +
        `<span class="ps-quick-sub">${esc(where)} — the latest show with a recording</span></span>`);
      b.addEventListener('click', () => {
        // Jump to that row, open it, and start it from the top. One press, one stream.
        const target = [...list.querySelectorAll('.ps-row')]
          .find(r => r.querySelector('.ps-date').textContent === fmtDate(s.date));
        if (target && !target.classList.contains('open')) target.querySelector('.ps-rowhead').click();
        if (target) target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        const body = target ? target.querySelector('.ps-body') : el('div');
        L.renderShow(body, s.date, { start: true });
      });
      quickHost.appendChild(b);
    }

    search.addEventListener('input', paintList);
    yearSel.addEventListener('change', async () => {
      const v = yearSel.value;
      head.textContent = 'Loading…';
      list.innerHTML = '';
      if (v === 'tour') return showTour();
      all = await L.loadYear(v);
      label = v;
      paintList();
    });

    let tourShows = [];
    let tourName = '';
    function showTour() {
      all = tourShows;
      label = tourName || 'Most recent shows';
      paintList();
    }

    (async () => {
      const years = await L.loadYears();
      if (!years.length) {
        head.textContent = 'Could not reach the Relisten catalogue.';
        return;
      }
      // The most recent tour, derived from the newest year's newest show rather than
      // hardcoded — Relisten labels each show with its tour, so "this tour" is a fact in
      // the data instead of a date range we would have to maintain.
      const latest = await L.loadYear(years[0].year);
      const newest = latest[0];
      tourName = newest && newest.tour ? newest.tour : `${years[0].year} shows`;
      tourShows = newest && newest.tour ? latest.filter(s => s.tour === newest.tour) : latest;

      yearSel.appendChild(el('option', null, tourName)).value = 'tour';
      for (const y of years) {
        yearSel.appendChild(el('option', null, `${y.year} (${y.shows})`)).value = y.year;
      }
      yearSel.value = 'tour';
      showTour();
      paintQuick(newest);
    })();
  }

  // ---- tabs
  //
  // The games come first, because they are why the app gets opened. Everything the model
  // knows sits behind Data, subdivided — it used to all render at once on an "All Data"
  // default, which was 45,000px and 55 screens of scrolling on a phone before a visitor
  // had done anything.
  const tabBar = document.getElementById('tabs');
  const subBar = document.getElementById('subtabs');
  const sections = [...app.children];
  const GAME_TABS = [
    { name: 'Phish Bingo', mode: 'bingo' },
    { name: 'Setlist Bets', mode: 'setlist' },
  ];
  const DATA_TABS = ['Predicted Setlist', 'Song Rotation', 'Album Coverage', 'Venue History', 'Ranked Songs'];
  let activeTab = GAME_TABS[0].name;
  let activeDataTab = DATA_TABS[0];

  // The standings are not in this row. They were, briefly, and a fourth tab cost a
  // permanent slot in the one row a phone can least afford for something read occasionally
  // — and a combined board had to rank by one game's scale while printing the other's
  // beside it. They now open per game from that game's Actions menu, ranked by the game
  // they belong to.
  //
  // The short labels stay: three full labels plus Play a Show still need more room than a
  // 375px phone has, and shortening them is what keeps this to one line.
  const SHORT_LABELS = { 'Phish Bingo': 'Bingo', 'Setlist Bets': 'Setlist' };
  // 560px, the same breakpoint the touch sizing and the banner stack already use, rather
  // than the 460 this started at. Measured by sweeping widths: the full labels plus the full
  // Play a Show button need 498px and do not fit until about 522px, so a 460px switch left a
  // band from 461 to ~530 where the row wrapped — narrow enough to miss on a phone and a
  // desktop and to only turn up on a tablet.
  const narrowTabs = window.matchMedia('(max-width: 560px)');
  const tabLabel = name => (narrowTabs.matches && SHORT_LABELS[name]) || name;

  // ---- banner actions
  //
  // Built once and left alone, unlike the tab bar, which is emptied and rebuilt on every
  // render — so renderTabs re-appends the button rather than re-creating it, and its click
  // handler survives.
  //
  // Play a Show rides the tab row, pinned right. It sat floating on the banner above the
  // row, which read as elevated above the things it is actually a peer of — it is somewhere
  // you go, and every other somewhere-you-go is in that row. The freshness stamp stays on
  // the banner: it describes the data behind Data and is not a destination at all.
  //
  // The catalogue is fetched the first time the button is pressed, not at page load — 39
  // years of index is not worth loading for a visitor who came to fill in a bingo card.
  const stageEl = document.getElementById('stage');
  const stageActions = el('div', 'stage-actions');
  // "Updated", not "Last updated:" — the shorter label is what keeps this narrow enough for
  // the tagline to keep a readable column beside it. At the longer wording the block is
  // 171px wide and the tagline has to drop to a 340px column, which pushes the longest
  // lines to three rows.
  stageActions.appendChild(el('span', 'pill stamp', 'Updated ' + esc(fmtDate(A.asOf))));
  if (stageEl) stageEl.appendChild(stageActions);

  const playBtn = el('button', 'btn-play');
  playBtn.addEventListener('click', () => {
    activeTab = 'Play a Show'; menuMode = null; buildPlayShow(); renderTabs();
  });

  function renderTabs() {
    const game = GAME_TABS.find(g => g.name === activeTab);
    // History and profile come from the account menu and belong to no tab, so while one is
    // open the card shows and no game reads as selected.
    const showingGames = !!game || !!menuMode;

    tabBar.innerHTML = '';
    for (const { name } of GAME_TABS) {
      const b = el('button', 'tab' + (name === activeTab && !menuMode ? ' active' : ''), esc(tabLabel(name)));
      b.addEventListener('click', () => { activeTab = name; menuMode = null; renderTabs(); });
      tabBar.appendChild(b);
    }
    const dataBtn = el('button', 'tab' + (activeTab === 'Data' ? ' active' : ''), 'Data');
    dataBtn.addEventListener('click', () => { activeTab = 'Data'; menuMode = null; renderTabs(); });
    tabBar.appendChild(dataBtn);

    // Pinned to the far right of the row by margin-left:auto in the CSS, so it reads as
    // separated from the four that are views rather than a fifth one. Re-appended rather
    // than rebuilt — the row is emptied every render and the handler lives on the element.
    // The narrow form was the glyph alone, from when a Leaderboard tab shared this row and
    // there was no room for a word. That tab is gone, so re-measured: three short tabs and
    // the gaps take 199 of the 327px bar at 375px, and "▶ Play" needs 71 — 57px to spare,
    // and 50 at 320px. A bare glyph asks the reader to guess; the word does not.
    playBtn.innerHTML = narrowTabs.matches
      ? '<span class="btn-play-ico">&#9654;</span> Play'
      : '<span class="btn-play-ico">&#9654;</span> Play a Show';
    playBtn.setAttribute('aria-label', 'Play a Show');
    playBtn.title = 'Play a Show';
    playBtn.classList.toggle('active', activeTab === 'Play a Show' && !menuMode);
    tabBar.appendChild(playBtn);

    subBar.innerHTML = '';
    subBar.style.display = activeTab === 'Data' ? '' : 'none';
    if (activeTab === 'Data') {
      for (const name of DATA_TABS) {
        const b = el('button', 'subtab' + (name === activeDataTab ? ' active' : ''), esc(name));
        b.addEventListener('click', () => { activeDataTab = name; renderTabs(); });
        subBar.appendChild(b);
      }
    }

    for (const s of sections) {
      s.style.display = s.dataset.games
        ? (showingGames ? '' : 'none')
        : s.dataset.play
          ? (activeTab === 'Play a Show' && !menuMode ? '' : 'none')
          : (activeTab === 'Data' && s.dataset.section === activeDataTab ? '' : 'none');
    }
    // Only steer the predictor when a game tab is what selected it — otherwise opening
    // History from the menu would immediately be overwritten by the tab it left behind.
    if (game && !menuMode && predictor) predictor.setMode(game.mode);
  }
  renderTabs();
  // Rotating a phone crosses the breakpoint without a reload, and the labels are baked in
  // at render time rather than by CSS, so the row has to be rebuilt when it changes.
  narrowTabs.addEventListener('change', renderTabs);

  // Clicking a card's own <h2> collapses it. Delegated rather than bound directly,
  // because the predictor card rebuilds its heading on every render — a listener
  // attached to the original element would be discarded on the first re-render.
  // The .collapsed class lives on the card, which survives, so the state does too.
  function makeCollapsible(card) {
    card.classList.add('collapsible');

    const mark = () => {
      const h = [...card.children].find(n => n.tagName === 'H2');
      if (!h || h.dataset.collapseReady) return;
      h.dataset.collapseReady = '1';
      h.setAttribute('role', 'button');
      h.setAttribute('tabindex', '0');
      h.setAttribute('aria-expanded', String(!card.classList.contains('collapsed')));
    };
    mark();
    // Re-mark after the predictor replaces its own heading.
    new MutationObserver(mark).observe(card, { childList: true });

    const toggle = h => {
      card.classList.toggle('collapsed');
      h.setAttribute('aria-expanded', String(!card.classList.contains('collapsed')));
    };
    // Only the card's OWN heading toggles — headings inside nested content (the track
    // record's set labels, say) must not collapse the whole card.
    const ownHeading = target => {
      const h = target.closest && target.closest('h2');
      return h && h.parentElement === card ? h : null;
    };
    card.addEventListener('click', ev => {
      const h = ownHeading(ev.target);
      if (h) toggle(h);
    });
    card.addEventListener('keydown', ev => {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      const h = ownHeading(ev.target);
      if (!h) return;
      ev.preventDefault(); // space would scroll the page
      toggle(h);
    });
  }

  // ---- track record: the model's own past predictions, graded
  // Loaded separately from analysis.json because it grows with every show while
  // analysis.json is always only about the next one.
  async function renderTrackRecord(host) {
    host.appendChild(el('h2', null, 'Track record <span class="hint">— how past predictions actually did</span>'));
    const body = el('div');
    host.appendChild(body);
    body.appendChild(el('div', 'hint', 'Loading…'));

    let H;
    try {
      const res = await fetch('/data/history.json');
      if (!res.ok) throw new Error(String(res.status));
      H = await res.json();
    } catch {
      body.innerHTML = '';
      body.appendChild(el('div', 'hint', 'No prediction history available yet.'));
      return;
    }

    const graded = H.shows.filter(s => s.result).sort((a, b) => b.showdate.localeCompare(a.showdate));
    body.innerHTML = '';
    if (!graded.length) {
      body.appendChild(el('div', 'hint',
        'No graded predictions yet — a show is scored once its setlist is posted.'));
      return;
    }

    // headline: lifetime accuracy across every graded show
    const sum = H.summary;
    body.appendChild(el('div', 'tr-summary',
      `<b>${sum.showsGraded}</b> show${sum.showsGraded === 1 ? '' : 's'} graded · ` +
      `mean precision <b>${pct(sum.meanPrecision)}</b> <span class="hint">(of what we predicted, how much played)</span> · ` +
      `mean recall <b>${pct(sum.meanRecall)}</b> <span class="hint">(of what played, how much we called)</span>`));

    const detail = el('div');

    function drawShow(s) {
      detail.innerHTML = '';
      const r = s.result;
      const card = el('div', 'tr-detail');
      card.appendChild(el('div', 'setlabel',
        `${esc(fmtDate(s.showdate))} — ${esc(s.venue)}${s.city ? ', ' + esc(s.city) : ''}`));
      card.appendChild(el('div', 'hint',
        `Predicted using data through ${esc(fmtDate(s.asOf))} — before the show was played.`));

      card.appendChild(el('div', 'tr-metrics',
        `Precision <b>${pct(r.precision)}</b> · Recall <b>${pct(r.recall)}</b> · ` +
        `Correct set placement <b>${r.setPlacementHits.length}/${r.hits.length}</b>` +
        (r.top40Hits != null ? ` · Top-40 coverage <b>${r.top40Hits}/${r.uniqueActualCount}</b>` : '')));

      const lists = el('div', 'grid cols-3');
      for (const [label, items, cls] of [
        [`Hits (${r.hits.length})`, r.hits, 'tr-hit'],
        [`Missed calls (${r.misses.length})`, r.misses, 'tr-miss'],
        [`Surprises (${r.surprises.length})`, r.surprises, 'tr-surprise'],
      ]) {
        const col = el('div');
        col.appendChild(el('div', 'setlabel', label));
        col.appendChild(el('div', 'tr-songs',
          items.length ? items.map(n => `<span class="tr-song ${cls}">${esc(n)}</span>`).join('') : '<span class="hint">none</span>'));
        lists.appendChild(col);
      }
      card.appendChild(lists);

      for (const c of r.slotChecks || []) {
        card.appendChild(el('div', 'tr-slot', `${c.ok ? '✓' : '✗'} <b>${esc(c.check)}</b> — ${esc(c.detail)}`));
      }
      // Hearing the show you were graded against is the natural end of reading the grade.
      // Attached to the show reference itself — see the note at the top of relisten.js for
      // why this belongs here and nowhere near a paid surface.
      if (window.KalphishiListen) window.KalphishiListen.attach(card, s.showdate, fmtDate(s.showdate));
      detail.appendChild(card);
    }

    // search across every archived show: date, venue, or any song named in it
    const search = el('input', 'ta-input tr-search');
    search.placeholder = 'search past predictions — date, venue, or song…';
    const list = el('div', 'tr-list');

    // Arrow navigation steps through whatever the search currently matches, so stepping
    // and filtering agree rather than the arrows walking shows the list isn't showing.
    // `graded` is newest-first, so a lower index is a more recent show.
    let matches = [];
    let idx = 0;
    const nav = el('div', 'tr-nav');
    const prev = el('button', 'tr-nav-btn', '← Newer');
    const next = el('button', 'tr-nav-btn', 'Older →');
    const pos = el('span', 'tr-nav-pos');
    nav.appendChild(prev); nav.appendChild(pos); nav.appendChild(next);

    function showAt(i) {
      if (!matches.length) return;
      idx = Math.max(0, Math.min(i, matches.length - 1));
      drawShow(matches[idx]);
      [...list.querySelectorAll('.tr-row')].forEach((n, j) => n.classList.toggle('active', j === idx));
      prev.disabled = idx === 0;
      next.disabled = idx === matches.length - 1;
      pos.textContent = `${idx + 1} of ${matches.length}`;
      // Keep the highlighted row visible when arrowing past the end of the viewport.
      list.querySelectorAll('.tr-row')[idx]?.scrollIntoView({ block: 'nearest' });
    }
    prev.addEventListener('click', () => showAt(idx - 1));
    next.addEventListener('click', () => showAt(idx + 1));

    function drawList() {
      const q = search.value.trim().toLowerCase();
      list.innerHTML = '';
      matches = graded.filter(s => {
        if (!q) return true;
        const hay = [
          s.showdate, s.venue, s.city,
          ...s.predicted.set1, ...s.predicted.set2, ...s.predicted.encore,
          ...(s.result.hits || []), ...(s.result.surprises || []),
        ].join(' ').toLowerCase();
        return hay.includes(q);
      });
      if (!matches.length) {
        list.appendChild(el('div', 'hint', 'No past predictions match that.'));
        nav.style.display = 'none';
        detail.innerHTML = '';
        return;
      }
      nav.style.display = matches.length > 1 ? '' : 'none';
      matches.forEach((s, i) => {
        const row = el('button', 'tr-row',
          `<b>${esc(fmtDate(s.showdate))}</b> <span class="hint">${esc(s.venue)}</span> ` +
          `<span class="tr-row-metrics">P ${pct(s.result.precision)} · R ${pct(s.result.recall)} · ` +
          `${s.result.hits.length} hit${s.result.hits.length === 1 ? '' : 's'}</span>`);
        row.addEventListener('click', () => showAt(i));
        list.appendChild(row);
      });
      showAt(0); // most recent match, so the panel is never empty
    }
    search.addEventListener('input', drawList);

    body.appendChild(search);
    body.appendChild(list);
    body.appendChild(nav);
    body.appendChild(detail);
    drawList(); // opens the most recent graded show by default
  }

  function num(v) { return v == null ? '—' : v; }
  function pct(v) { return v == null ? '—' : Math.round(v * 100) + '%'; }
  function tableOf(headers, rowsData, numCols = []) {
    const t = el('table');
    const tr = el('tr');
    headers.forEach((hh, i) => tr.appendChild(el('th', numCols.includes(i) ? 'num' : null, hh)));
    t.appendChild(tr);

    // per-column filter row: substring match, or >n <n >=n <=n =n on numeric-ish cells; plus sort toggles
    const ftr = el('tr', 'filter-row');
    const filters = [];
    const sortBtns = [];
    let sortState = { col: null, dir: 1 };
    headers.forEach((hh, i) => {
      const th = el('th');
      const wrap = el('div', 'th-controls');
      const inp = el('input', 'th-filter');
      inp.placeholder = '⌕';
      inp.addEventListener('input', apply);
      filters.push(inp);
      wrap.appendChild(inp);
      const btn = el('button', 'th-sort', '↕');
      btn.title = 'sort ' + (numCols.includes(i) ? 'numerically' : 'alphabetically');
      btn.addEventListener('click', () => {
        if (sortState.col === i) sortState.dir = -sortState.dir;
        else sortState = { col: i, dir: 1 };
        sortBtns.forEach(b => { b.textContent = '↕'; b.classList.remove('active'); });
        btn.textContent = sortState.dir === 1 ? '↑' : '↓';
        btn.classList.add('active');
        applySort();
      });
      sortBtns.push(btn);
      wrap.appendChild(btn);
      th.appendChild(wrap);
      ftr.appendChild(th);
    });
    t.appendChild(ftr);

    function applySort() {
      const i = sortState.col;
      if (i == null) return;
      const isNum = numCols.includes(i);
      const sorted = [...bodyRows].sort((a, b) => {
        const ta = a.children[i].textContent.trim();
        const tb = b.children[i].textContent.trim();
        if (isNum) {
          const na = parseFloat(ta.replace(/[^0-9.\-]/g, ''));
          const nb = parseFloat(tb.replace(/[^0-9.\-]/g, ''));
          if (isNaN(na) && isNaN(nb)) return 0;
          if (isNaN(na)) return 1;  // blanks/— always sink to the bottom
          if (isNaN(nb)) return -1;
          return sortState.dir * (na - nb);
        }
        return sortState.dir * ta.localeCompare(tb, undefined, { numeric: true, sensitivity: 'base' });
      });
      for (const r of sorted) t.appendChild(r);
    }

    const bodyRows = [];
    for (const r of rowsData) {
      const row = el('tr');
      r.forEach((cell, i) => row.appendChild(el('td', numCols.includes(i) ? 'num' : null, cell)));
      bodyRows.push(row);
      t.appendChild(row);
    }

    function apply() {
      for (const row of bodyRows) {
        let show = true;
        filters.forEach((f, i) => {
          if (!show) return;
          const v = f.value.trim().toLowerCase();
          if (!v) return;
          const text = row.children[i].textContent.toLowerCase();
          const cmp = v.match(/^(>=|<=|>|<|=)\s*(-?\d+\.?\d*)$/);
          if (cmp) {
            const cellNum = parseFloat(text.replace(/[^0-9.\-]/g, ''));
            if (isNaN(cellNum)) { show = false; return; }
            const n = parseFloat(cmp[2]);
            show = cmp[1] === '>' ? cellNum > n : cmp[1] === '<' ? cellNum < n :
                   cmp[1] === '>=' ? cellNum >= n : cmp[1] === '<=' ? cellNum <= n : cellNum === n;
          } else {
            show = text.includes(v);
          }
        });
        row.style.display = show ? '' : 'none';
      }
    }
    return t;
  }
});
</script>
</body>
</html>
